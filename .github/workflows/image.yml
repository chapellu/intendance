name: Image

# Construit l'image de l'app, la publie sur GHCR, puis épingle le SHA dans
# `k8s/deployment.yaml` — que Flux lit depuis ce dépôt. Git reste la source de
# vérité et rien ne s'applique hors bande.
#
# Le Dockerfile typecheck et construit ; les tests, eux, tournent AVANT la
# publication. Une image qui part sur GHCR avec des tests rouges n'a rien à y
# faire, et un `needs:` le dit mieux qu'une consigne.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # committe le nouveau tag d'image sur main
  packages: write # pousse sur GHCR

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/intendance

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # La parité rejoue les mêmes semaines dans le modèle du prototype (figé
      # dans `reference/`) et dans celui de l'app, et compare tout ce que
      # `calculer` produit. Elle disparaîtra avec le prototype ; d'ici là, c'est
      # elle qui prouve le port.
      - run: npm run parite

  e2e:
    name: Parcours de bout en bout
    # x86_64 et non ARM comme les autres jobs : ici on teste un comportement de
    # navigateur, pas l'image qui sera déployée, et Playwright livre son
    # Chromium sur cette plateforme sans discussion. L'architecture du nœud n'a
    # rien à voir avec ce qu'un pouce fait dans une page.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # `playwright.config.ts` construit et sert lui-même l'app : les parcours
      # tournent contre le BUILD DE PRODUCTION, seul endroit où le service
      # worker existe.
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-e2e
          path: test-results/
          retention-days: 7

  build:
    name: Build & publish
    needs: [test, e2e]
    # Le cluster est un nœud unique Ampere A1 : image arm64, build natif sur
    # runner ARM.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin the new tag in the deployment manifest
        run: |
          set -euo pipefail
          manifest=k8s/deployment.yaml
          sed -i -E "s|(image: ${IMAGE}:).*|\1${GITHUB_SHA}|" "$manifest"
          if git diff --quiet -- "$manifest"; then
            echo "Image tag unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "roll image to ${GITHUB_SHA}"
          # Les pushes faits avec GITHUB_TOKEN ne déclenchent pas de workflow,
          # donc pas de boucle possible.
          git push
