<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` : la coquille pose sa barre du bas dans la zone de
       sécurité de l'iPhone, et il lui faut donc l'écran entier. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5ead8">
  <title>Intendance</title>

  <!-- La PWA (T18). Le manifeste porte les icônes, le nom et le mode
       d'affichage ; les trois balises `apple-` restent nécessaires parce
       qu'iOS ne lit toujours pas tout le manifeste — il veut son icône à lui,
       son titre à lui, et il ignore `background_color`. `default` pour la
       barre d'état donne du texte sombre sur la crème du fond ; `black` la
       peindrait en noir et mangerait le haut de l'écran. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Intendance">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png">
  <!-- L'onglet d'un navigateur ne masque rien : c'est la variante arrondie qui
       y va, pas celle que le système découpe. -->
  <link rel="icon" href="/icones/intendance.svg" type="image/svg+xml">
</head>
<body>
  <div id="racine"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
