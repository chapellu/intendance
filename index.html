<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- `viewport-fit=cover` : la coquille pose sa barre du bas dans la zone de
       sécurité de l'iPhone, et il lui faut donc l'écran entier. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5ead8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Intendance</title>
  <!-- Une icône en data-URI : sans elle, chaque chargement se solde par un 404
       sur /favicon.ico. Le jeu d'icônes complet (et le manifeste) arrive avec
       la PWA, en T18 ; celle-ci n'a qu'à ne pas mentir en attendant. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5ead8'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23c67139' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>
  <div id="racine"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
