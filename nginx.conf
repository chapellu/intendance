# La conf du serveur — deux règles de cache, et c'est tout ce qu'elle décide.
#
# LA RÈGLE EST CELLE-CI : ce dont l'URL porte l'empreinte se garde un an, tout
# le reste se revalide. Rollup hache le contenu dans le nom (`index-C3wFhysQ.js`)
# — ce fichier-là ne peut pas changer sans changer d'URL, donc le garder pour
# toujours est exact. Le document, le manifeste, les polices, le catalogue et le
# service worker gardent leur nom d'une version à l'autre : les mettre en cache
# long, c'est promettre du vieux.
#
# ET SURTOUT `/sw.js`. C'est le seul fichier que le navigateur va rechercher
# tout seul pour savoir s'il existe une nouvelle version. Servi sous un
# `Cache-Control` long, il ne serait jamais revérifié, et l'app resterait sur sa
# version pour la durée de ce cache — sans que rien n'échoue nulle part. C'est
# la conséquence de T18 qu'il fallait écrire ici, et elle tient en une ligne.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 326 ko de JS en 106 ko sur le fil. Ça ne compte qu'à la première visite
    # — après, c'est le service worker qui sert — mais c'est précisément la
    # visite où l'on décide si l'app vaut d'être installée.
    #
    # `gzip_static` sert le `.gz` fabriqué par le Dockerfile ; `gzip` reste
    # allumé pour ce qui n'en aurait pas, et compresse alors à la volée.
    gzip_static on;
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # `.webmanifest` ne figure pas dans les types connus de nginx, qui le sert
    # donc en `application/octet-stream`. Le type juste est nommé ici — c'est
    # aussi ce qui rend la ligne `application/manifest+json` de `gzip_types`
    # autre chose qu'un vœu.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # `no-cache` ne dit pas « ne garde rien » mais « demande avant de
        # servir » : le navigateur garde le fichier et reçoit un 304 tant qu'il
        # n'a pas changé. On paie un aller-retour, jamais un octet de trop.
        add_header Cache-Control "no-cache";
        # Toute navigation retombe sur le document : c'est exactement ce que
        # fait le service worker hors ligne, et deux comportements identiques
        # en ligne et hors ligne valent mieux qu'un 404 qui n'arrive que sur
        # l'un des deux. Le routeur en dièse fait que ce cas ne se produit
        # qu'après une URL tapée de travers.
        try_files $uri /index.html;
    }
}
