# ---------------------------------------------------------------------------
# SOURCE — index bibliographique d'un livre du foyer.
#
# CE FICHIER N'EST PAS UN CATALOGUE. Il vit hors de `recipes/` exprès :
# `charger_recettes()` ne lit que `recipes/*.yaml`, donc rien d'ici n'entre dans
# le catalogue tant que quelqu'un n'a pas ouvert la page et saisi le plat.
#
# Ce qu'il contient est ce que les photos du sommaire donnent, et rien de plus :
# saison, titre, page. Les ingrédients, les temps et les `apports` ne sont PAS
# dans un sommaire — les inventer produirait cent entrées fausses au lieu de
# cent entrées vides, et le README dit déjà que les quantités inventées de
# `_repertoire.yaml` sont à corriger.
#
# Une entrée saisie se signale en lui ajoutant `catalogue_id: <id>` pointant sur
# le plat correspondant dans `recipes/`. Saisies à ce jour : **25 sur 100**.
# Le PRINTEMPS est complet à cinq pages près (42, 45, 46, 49, 50) ; l'ÉTÉ est
# entamé (p. 70 à 81) ; l'automne et l'hiver sont entièrement à saisir.
#
# `niveau: plan` marquerait une entrée saisie SANS étapes — planifiable et
# achetable, pas encore cuisinable. Aucune n'est dans ce cas : les samoussas
# p. 76 y sont passés le temps que la page de pliage (p. 78) arrive.
#
# CADRE DE LICENCE (celui de la carte #26) : un sommaire est une donnée
# factuelle de référence — auteur, titre, page. Aucune prose, aucune photo,
# aucune recette de l'ouvrage n'est reproduite ici. Quand un plat sera saisi, il
# le sera comme `burgers-de-lentilles` : plat et procédé (savoir-faire non
# protégeable), formulation refaite, `source:` renseignée.
#
# CE QUE CETTE SOURCE APPORTE ET QUE LE MODÈLE N'A PAS : le livre est organisé
# par SAISON, et aucune recette du catalogue ne porte de champ `saison`. Les
# quatre bornes de pagination ci-dessous sont donc, en creux, une table de
# saisonnalité pour cent plats — exactement l'axe qui manque à `_score()` pour
# refuser un tian-ratatouille en février.
# ---------------------------------------------------------------------------

source:
  id: chioca-cuisine-bio-quotidien
  type: livre
  author: Marie Chioca
  title: La cuisine bio du quotidien
  subtitle: 100 recettes pour bien manger en famille sans se ruiner !
  publisher: Terre vivante
  lang: fr
  releve: photos du sommaire, 2026-08-13
  encodage: >-
    index seul (saison, titre, page). Ni prose, ni photo, ni recette reproduite.

# Les quatre saisons du livre, avec leurs bornes de pagination : une recette
# entre ces bornes est de cette saison, ce qui vaut aussi pour les plats du
# catalogue qu'on y retrouverait.
saisons:
