# ---------------------------------------------------------------------------
# MENUS TYPES DE L'AUTEURE
#
# Deux journées équilibrées données en introduction, pour une famille de deux
# adultes (dont un absent le midi), deux jumeaux de 16 ans, une fillette de
# 7 ans et un bébé de 13 mois. L'auteure précise que ce ne sont pas des journées
# calquées sur les siennes (six enfants de 6 à 19 ans), mais l'illustration
# d'« un seul menu pour tout le monde ».
#
# POURQUOI C'EST DANS LA DB : c'est une validation externe de `creneaux.yaml`.
# Ses journées sont indexées par CRÉNEAU (petit déjeuner / déjeuner / goûter /
# dîner), pas par plat du soir, et les créneaux ne sont pas symétriques — le
# petit déjeuner et le goûter sont des routines sans recette, exactement le
# `nature: routine` du modèle. Deux mécaniques déjà codées apparaissent aussi en
# clair dans sa prose : le prélèvement bébé avant salage (`baby_portion`) et la
# part mise de côté qui devient le déjeuner du lendemain (`emits` → `accepts`).
# ---------------------------------------------------------------------------
menus_types:
  foyer_decrit: >-
    deux adultes dont un absent le midi, deux jumeaux de 16 ans,
    une fillette de 7 ans, un bébé de 13 mois
  journees:
    - id: journee-1
      creneaux:
        petit_dejeuner:
          items:
            - "tartines de pain complet, 20 g de beurre bio"
            - "un œuf à la coque"
          note: >-
            riche en céréales complètes, légèrement protéiné et sans sucres
            rapides ; même petit déjeuner pour tout le monde, on adapte les
            quantités de pain aux appétits. Bébé : 10 g de beurre et une
            mouillette dans l'œuf.
        dejeuner:
          items:
            - "salade verte"
            - {titre_menu: "Pizza végétarienne", page: 99}
            - {titre_menu: "Gratin de crozets", page: 198, alternative: true}
          note: >-
            entrée crue parce que le plat principal contient peu de légumes ;
            le fromage du plat tient lieu de laitage. Part du bébé écrasée à la
            fourchette ; une part mise de côté pour le déjeuner du lendemain de
            l'adulte absent (à emporter au travail).
        gouter:
          items: ["pain complet avec du chocolat noir", "une poire"]
        diner:
          items:
            - {titre_menu: "Tian-ratatouille", page: 88}
          note: "on ajoute du riz complet pour les ados"

    - id: journee-2
      creneaux:
        petit_dejeuner:
          items:
            - "muësli aux vrais flocons d'avoine, fruits frais et séchés"
            - "yaourt ou fromage blanc bio"
        dejeuner:
          items:
            - {titre_menu: "Donburi de chou chinois", page: 193}
          note: >-
            pas d'entrée et pas de fromage, le plat principal est déjà
            équilibré. Part mise de côté pour le déjeuner du lendemain de
            l'adulte absent ; on écrase les aliments avec un peu de jus pour le
            bébé.
        gouter:
          items:
            - {titre_menu: "pain d'épices fait maison", page: 208, qty: "une ou deux tranches"}
            - "une orange"
        diner:
          items:
            - {titre_menu: "Soupe crétoise « 3 min chrono »", page: 172}
          note: >-
            mixée pour le bébé, additionnée de deux larges tranches de pain
            complet grillé pour les ados
