    titre: "Petits choux à la crème, très « sages » et très gourmands"
    url: https://saines-gourmandises.fr/un-dessert-de-paques-trop-chou/
    ingredients:
      - "Préparation : Moi, j'ai mis 3 jours, mais vous n'êtes pas obligés de rater 8 essais préalables… Alors dans votre cas, ce sera 10 minutes pour la pâte (c'est vraiment très simple), 5 minutes pour la crème, 10 minutes pour les fourrer et les napper"
