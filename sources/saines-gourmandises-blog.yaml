      - "1 pincée de sel"
      - "Pour la crème pâtissière :"
      - "20cl de lait de soja"
      - "1 cuil à soupe de farine d'épeautre complète"
      - "3cl d'expresso serré"
      - "une cuil à café d'extrait de vanille liquide ou en poudre"
      - "3 cuil à soupe de purée de noisette bien fluide"
      - "75g de sucre de bouleau"
      - "Pour le nappage au chocolat"
      - "10cl de lait de soja"
      - "100g de chocolat noir 70%"
      - "1/ Préchauffer le four sur 180°C. Préparez et pesez tous les ingrédients pour les avoir sous la main, car c'est LA condition pour réussir la pâte à choux : Pas question de laisser refroidir la préparation pour aller se casser un œuf une fois qu'on est lancé!"
