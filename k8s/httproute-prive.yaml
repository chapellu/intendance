# T179 — La route PRIVÉE : `/prive/`, et rien d'autre.
#
# Une route à part pour qu'une politique de sécurité ne vise QU'ELLE
# (`securitypolicy.yaml`) : le site reste public, comme le dit `httproute.yaml`,
# et seul ce chemin exige une clé. Entre deux routes du même hôte, Gateway API
# donne la requête au préfixe le plus long : `/prive/` passe ici, tout le reste
# passe par `intendance`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intendance-prive
  namespace: intendance
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
      sectionName: https-intendance
  hostnames:
    - intendance.chapellu.fr
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /prive/
      backendRefs:
        - name: intendance
          port: 80
