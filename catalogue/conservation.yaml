# ---------------------------------------------------------------------------
# CONSERVATION — la transformation qui rallonge la vie d'une sortie.
#
# Le modèle change de forme ici, et c'est le point. Jusqu'ici `keeps:` était une
# propriété du plat : « frigo 3 j, congélo oui ». Faux. La durée de vie n'est pas
# une propriété du plat, c'est une propriété du **plat × la méthode qu'on sait et
# qu'on peut appliquer**. Exactement la logique de Don't Starve : l'aliment a une
# horloge, et le transformer remet l'horloge à zéro — mais seulement si on a le
# séchoir, et seulement si on a appris à s'en servir.
#
# D'où trois conséquences qui tombent toutes seules :
#
# 1. `needs` désigne une **capacité**, jamais un outil — même indirection que
#    rules.yaml. Le foyer possède la capacité ou non.
# 2. Une méthode non possédée n'est pas une erreur, c'est un **nœud de l'arbre de
#    compétences verrouillé par le kit** — précisément le type de verrou retenu
#    par #10 (kit possédé / acte prérequis / fenêtre saisonnière).
# 3. La conservation devient une **acquisition** : elle a un coût d'entrée, un
#    geste à apprendre, et un gain mesurable en jours. C'est un axe de
#    progression, pas un réglage.
#
# ⚠ SÉCURITÉ — LE POINT LE PLUS IMPORTANT DE CE FICHIER
# La stérilisation maison n'est pas un détail de confort. *Clostridium botulinum*
# se développe en milieu **anaérobie, peu acide, à température ambiante** — c'est
# exactement un bocal de sauce à la viande, de lentilles ou de légumes fermé et
# rangé dans un placard. Un bain-marie à 100 °C ne détruit pas les spores : seul
# un traitement **sous pression** (autocuiseur/stérilisateur, >115 °C) le fait.
# Le bain-marie n'est sûr que pour les aliments **acides** (pH ≤ 4,6 : fruits,
# cornichons, tomates *acidifiées*).
# Le sous-vide crée le même milieu anaérobie : il **prolonge le froid, il ne
# remplace pas le froid**. Un sous-vide laissé hors du frigo est plus dangereux
# qu'un aliment à l'air libre, pas moins.
#
# `defaut_acidite: basse` ci-dessous est délibérément le choix prudent : un plat
# est présumé peu acide tant qu'il n'est pas explicitement marqué autrement.
#
# ⚠ CHIFFRES NON SOURCÉS. Les fenêtres ci-dessous sont des ordres de grandeur de
# prototype. À remplacer par des références réelles avant que quiconque agisse
# dessus : ANSES / DGCCRF côté français, NCHFP (National Center for Home Food
# Preservation) pour les barèmes de stérilisation, qui est la référence publique
# la plus détaillée sur les temps et pressions par aliment.
# ---------------------------------------------------------------------------

defaut_acidite: basse

# `applique_a` : les NATURES d'aliment auxquelles la méthode a un sens. Absent =
# s'applique à tout. Le champ dormait depuis l'écriture de ce fichier — déclaré,
# jamais lu — et le garde-manger (T23) en est le premier consommateur. Il a fallu
# le compléter : sans ça le modèle proposait de mettre de la farine « en bocal
# sous pression », ce qui n'est pas dangereux, seulement absurde. Un conseil
# absurde apprend à ignorer les conseils, y compris celui qui compte.
#
# `plat` est la nature d'une sortie de cuisine — ce que `stock.yaml` porte. Les
# natures de matière première viennent de `garde-manger.yaml` : `legume-cru`,
# `fruit`, `herbe`, `sec`, `gras`.

methodes:
  - id: frigo
    label: au frigo
    needs: null                      # tout le monde a un frigo
    fenetre: {unite: jours, valeur: 4, source: household.fridge_window_days}
    # Cette fenêtre est celle des RESTES — c'est `household.fridge_window_days`,
    # le délai au bout duquel le planificateur cesse de compter sur un plat
    # cuisiné. Elle ne veut rien dire pour de la matière première : un sachet de
    # farine ne périme pas en quatre jours parce qu'on l'a mis au frais. D'où
    # `applique_a: [plat]`, et d'où le fait que le garde-manger ne propose jamais
    # le frigo — y ranger un ingrédient est un choix de RANGEMENT, que les zones
    # portent déjà, pas une transformation qui remet une horloge à zéro.
    applique_a: [plat]
    noeud_competence: null

  - id: congeler
    label: au congélateur
    needs: congeler
    fenetre: {unite: mois, valeur: 3}
    contrainte: "compte contre les 3 tiroirs (#29) — la vraie limite ici"
    noeud_competence:
      id: congeler-en-portions
      titre: "Congeler en portions utiles"
      verrou: kit
      acte: "porter une sortie au congélo en portions d'un repas, étiquetées et datées"

  - id: sous-vide-frigo
    label: sous vide, au frigo
    needs: mise-sous-vide
    fenetre: {unite: jours, multiplicateur: 2.5}
    exige_froid: true
    note_securite: >
      Prolonge le froid, ne le remplace pas. Le sachet est anaérobie : hors du
      frigo il favorise précisément les germes qu'on veut éviter.
    noeud_competence:
      id: mise-sous-vide
      titre: "Mettre sous vide"
      verrou: kit
      kit_manquant: machine à mise sous vide (à cloche ou à aspiration)
      acte: "conditionner une sortie sous vide et vérifier la tenue du sachet à J+7"

  - id: bocal-bain-marie
    label: en bocal, bain-marie
    needs: sterilisation-bain-marie
    fenetre: {unite: mois, valeur: 12}
    applique_a: [plat, legume-cru, fruit]
    exige_acidite: haute
    note_securite: >
      RÉSERVÉ aux aliments acides (pH ≤ 4,6). Sur un plat peu acide — sauce à la
      viande, lentilles, légumes nature — le bain-marie ne détruit pas les spores
      de C. botulinum et le bocal devient dangereux à température ambiante.
    noeud_competence:
      id: steriliser-acide
      titre: "Stériliser les acides au bain-marie"
      verrou: acte
      acte: "réussir un lot de bocaux acides, couvercles bombés vérifiés à froid"

  - id: bocal-sous-pression
    label: en bocal, sous pression
    needs: sterilisation-sous-pression
    fenetre: {unite: mois, valeur: 12}
    applique_a: [plat, legume-cru]
    note_securite: >
      La seule voie sûre pour mettre un plat PEU ACIDE en bocal à température
      ambiante : >115 °C sous pression, avec un barème temps/pression propre à
      l'aliment et au volume du bocal. Barèmes à sourcer (NCHFP) avant usage.
    noeud_competence:
      id: steriliser-sous-pression
      titre: "Stériliser sous pression"
      verrou: kit
      kit_manquant: autocuiseur/stérilisateur avec manomètre
      acte: "réussir un lot peu acide en suivant un barème publié, sans improviser"

  - id: lacto-fermentation
    label: en lacto-fermentation
    needs: bocaux-a-joint
    fenetre: {unite: mois, valeur: 6}
    applique_a: [legume-cru]
    note_securite: >
      Le milieu s'acidifie lui-même, ce qui le sécurise — mais seulement pour des
      légumes en saumure, jamais pour un plat cuisiné.
    noeud_competence:
      id: lacto-fermenter
      titre: "Lacto-fermenter un légume"
      verrou: kit
      kit_manquant: bocaux à joint caoutchouc
      acte: "réussir un bocal de légumes en saumure, goûté à 3 semaines"

  - id: sechage
    label: séché
    needs: sechage
    fenetre: {unite: mois, valeur: 6}
    applique_a: [herbe, legume-cru, fruit]
    noeud_competence:
      id: secher
      titre: "Sécher herbes et légumes"
      verrou: kit
      kit_manquant: déshydrateur (ou four à très basse température)
      acte: "sécher une récolte d'herbes du jardin et la mettre en bocal"

# ---------------------------------------------------------------------------
# LA GARDE DES DENRÉES — combien de temps une MATIÈRE PREMIÈRE tient, rangée
# comme il faut. Arrivé avec le fond de roulement, le 2026-10-18.
#
# LA MÊME HORLOGE, D'AUTRES LONGUEURS. Workspace#50 a tranché avec l'utilisateur
# qu'il n'y a qu'une horloge pour tous les stocks — le frigo en jours, le
# congélateur en mois, les conserves en années. Les `methodes` ci-dessus
# disent ce qu'une TRANSFORMATION fait gagner à une sortie de cuisine ; les
# familles ci-dessous disent ce que tient une denrée qu'on ne transforme pas,
# seulement qu'on RANGE bien. Même `fenetre`, mêmes unités, même conversion
# (`garde_manger.fenetre_jours`) : un deuxième modèle de durée de vie serait
# le deuxième chiffre qui finit par contredire le premier.
#
# PAS DE CAS SPÉCIAL POUR L'OIGNON. Dit le 2026-10-18 : les pommes de terre,
# les oignons, l'ail et les carottes « tiennent des semaines », les secs des
# mois, les surgelés des mois, les conserves des années, et les œufs aussi se
# gardent en stock. Tout ce qui tient des semaines au moins est du FOND — de
# quoi porter un plancher (`fond: true`). Seul le frais vraiment fragile —
# salade, courgettes, herbes, poisson, viande — reste dehors (`fond: false`),
# et c'est pour lui que le CONSEIL compte le plus : c'est lui qu'un bon geste
# fait passer de trois jours à trois mois.
#
# `conseil` EST UN GESTE, PAS UNE DÉFINITION. L'app le montre là où la denrée
# est rangée (l'écran du placard, la ligne du fond) : il doit tenir en une
# phrase qu'on lit debout devant le placard ouvert. Rédigé pour ce foyer — les
# bocaux Le Parfait qu'il possède déjà, ses sacs congélation.
#
# `methode` nomme, quand il y en a une, la méthode ci-dessus qui RELANCE
# l'horloge (congeler la viande en portions). Absente, la garde est un simple
# rangement : rien ne se transforme, on évite seulement d'abîmer.
#
# ⚠ LES FENÊTRES SONT DES ORDRES DE GRANDEUR, COMME CELLES DU HAUT, et chaque
# famille dit d'où vient la sienne (`source`). Une seule est réglementaire —
# les œufs. Partout ailleurs la date imprimée sur l'emballage fait foi, et ces
# nombres ne servent qu'à dire « ça se garde des semaines » plutôt que « ça se
# garde trois jours ». À confronter aux fiches ANSES / DGCCRF avant de s'en
# servir pour jeter quoi que ce soit.
#
# UN ID N'APPARTIENT QU'À UNE FAMILLE — le vérificateur le tient. Deux fenêtres
# pour la même denrée, et l'écran choisirait au hasard laquelle afficher.
#
# `entame_se_finit: true` — T140, dit le 2026-10-20 : « je préfère utiliser la
# boîte entière plutôt que les trois quarts et gérer un petit reste ». Une
# boîte, une brique, un bocal, un paquet sous atmosphère ouverts ne se gardent
# pas : quand la recette en demande une bonne part (un tiers, voir
# `src/model/paquet.ts`), le plat la prend ENTIÈRE — au rejeu, à la liste, et
# la fiche le dit. Il faut aussi que `fond.yaml:unite` dise le poids de la
# boîte. ABSENT ailleurs, et c'est voulu : le sec se garde ouvert ; le fromage
# râpé entamé se congèle (son conseil) et les yaourts se comptent au pot.
# ---------------------------------------------------------------------------

familles:
  - id: sec
    label: épicerie sèche
    fond: true
    espace: placard
    rangement: en bocal hermétique, au sec et à l'abri de la lumière
    fenetre: {unite: mois, valeur: 12}
    source: >-
      ordre de grandeur, non sourcé — légumineuses, riz et pâtes tiennent un an
      et plus fermés ; les farines COMPLÈTES rancissent en 3 à 6 mois une fois
      ouvertes (le germe garde ses huiles). La date du paquet fait foi.
    conseil: >-
      Une fois le paquet ouvert, tout passe en bocal Le Parfait étiqueté de sa
      date : ni mites alimentaires ni humidité, et le niveau se voit d'un coup
      d'œil.
    ids: [farine, farine-complete, farine-epeautre, farine-petit-epeautre,
          lentilles-corail, lentilles-seches, pois-casses, pois-chiches,
          haricots-blancs, haricots-rouges, riz, riz-rond, pates, semoule,
          flocons-avoine]

  - id: emballe
    label: frais emballé longue garde
    fond: true
    entame_se_finit: true
    espace: placard
    rangement: dans son emballage fermé, au placard
    fenetre: {unite: semaines, valeur: 8}
    source: >-
      ordre de grandeur — les gnocchis sous atmosphère se gardent à température
      ambiante jusqu'à leur date, souvent plusieurs mois. Ouverts, deux à trois
      jours au frigo.
    conseil: >-
      Ne pas ouvrir le paquet d'avance : c'est l'emballage qui le conserve.
      Entamé, le refermer d'une pince et le finir dans les trois jours.
    ids: [gnocchis]

  - id: legume-de-garde
    label: légumes de garde
    fond: true
    espace: placard
    rangement: au sombre, au frais et au sec, chacun dans son panier
    fenetre: {unite: semaines, valeur: 6}
    source: >-
      ordre de grandeur, non sourcé — un à deux mois pour les pommes de terre
      et les oignons dans un endroit frais et sombre, davantage pour l'ail et
      une courge entière.
    conseil: >-
      Pommes de terre d'un côté, oignons et ail de l'autre : les alliacées font
      germer les tubercules. En panier ou en sac papier, jamais en sac
      plastique fermé — et loin du sous-évier, trop humide.
    ids: [pomme-de-terre, oignon, oignon-rouge, ail, echalote, courge, potimarron]

  - id: legume-du-bac
    label: légumes et fruits du bac
    fond: true
    espace: frigo
    rangement: au bac à légumes du frigo, à l'air
    fenetre: {unite: semaines, valeur: 3}
    source: >-
      ordre de grandeur, non sourcé — deux à quatre semaines au bac pour des
      carottes sans fanes, un céleri-rave entier ou des pommes.
    conseil: >-
      Couper les fanes des carottes dès le retour des courses (elles tirent
      l'eau de la racine), et laisser le bac respirer : un sac fermé fait
      moisir.
    ids: [carottes, celeri-rave, navets, pommes, citron]

  - id: surgele
    label: surgelés du commerce
    fond: true
    espace: congelo
    rangement: au congélateur, sachet refermé
    fenetre: {unite: mois, valeur: 8}
    source: >-
      ordre de grandeur — la date d'un sachet surgelé est souvent à un ou deux
      ans ; une fois ouvert, la qualité baisse en quelques mois (le givre
      dessèche). Pas un risque sanitaire tant que la chaîne du froid tient.
    conseil: >-
      Chasser l'air et refermer d'une pince à chaque usage : c'est le givre,
      pas le temps, qui abîme. Un sachet décongelé ne repart pas au
      congélateur.
    ids: [epinards-surgeles, petits-pois-surgeles, haricots-verts-surgeles,
          champignons-surgeles, legumes-surgeles]

  - id: conserve
    label: conserves
    fond: true
    entame_se_finit: true
    espace: placard
    rangement: au placard, boîtes fermées
    fenetre: {unite: ans, valeur: 2}
    source: >-
      ordre de grandeur — la date d'une conserve va de deux à cinq ans selon le
      produit ; lire la boîte. Une boîte bombée ou rouillée se jette.
    conseil: >-
      Une boîte entamée ne reste jamais dans le métal : transvaser dans une
      boîte hermétique, au frigo, et finir dans les trois jours.
    ids: [tomates-pelees, concentre-tomate, lait-coco, thon-boite,
          maquereaux-boite, sardines-boite, mais]

  - id: oeufs
    label: œufs
    fond: true
    espace: frigo
    rangement: dans leur boîte, au frigo ou au frais
    fenetre: {unite: jours, valeur: 28}
    source: >-
      RÉGLEMENTAIRE — la date de durabilité minimale d'un œuf est fixée à
      28 jours après la ponte (règlement CE n° 589/2008). La date de la boîte
      fait foi.
    conseil: >-
      Les garder dans leur boîte, pointe en bas, sans les laver : la coquille
      est poreuse, et la boîte la protège des odeurs du frigo.
    ids: [oeufs]

  - id: laitier
    label: frais laitier
    fond: true
    espace: frigo
    rangement: au frigo, fermé
    fenetre: {unite: semaines, valeur: 3}
    source: >-
      ordre de grandeur — yaourts et fromage râpé fermés tiennent jusqu'à leur
      date, souvent trois à quatre semaines. Ouvert, le fromage râpé tient
      quelques jours.
    conseil: >-
      Un sachet de fromage râpé entamé se congèle tel quel et s'emploie sans
      décongeler, directement sur le gratin.
    ids: [fromage-rape, yaourt-nature]

  # ── Le frais fragile : PAS du fond, et c'est là que le geste compte ──────

  - id: viande-poisson
    label: viande et poisson frais
    fond: false
    espace: frigo
    rangement: au plus froid du frigo, dans son emballage
    methode: congeler
    fenetre: {unite: jours, valeur: 2}
    source: >-
      ordre de grandeur — un à deux jours pour la viande hachée et le poisson,
      deux à trois pour une pièce entière. La date limite de l'étiquette fait
      foi.
    conseil: >-
      Achetée en quantité, la partager dès le retour en portions d'un repas, à
      plat dans des sacs congélation, air chassé, datés au feutre : à plat,
      elle décongèle en une nuit au frigo.
    ids: [boeuf-hache, poulet, poulet-filets, roti-porc, saumon, cabillaud]

  - id: legume-fragile
    label: légumes fragiles
    fond: false
    espace: frigo
    rangement: au bac à légumes, à cuisiner dans la semaine
    methode: congeler
    fenetre: {unite: jours, valeur: 5}
    source: >-
      ordre de grandeur, non sourcé — trois jours pour une salade, une semaine
      pour un poireau ou un brocoli.
    conseil: >-
      Pour en congeler : blanchir deux à trois minutes à l'eau bouillante,
      plonger dans l'eau glacée, bien sécher, puis à plat en sachet. Sans
      blanchiment, ils perdent couleur et goût en quelques semaines.
    ids: [courgettes, salade-verte, tomates, poivron, aubergine, brocoli,
          pousses-epinards, petits-pois, champignons-paris, poireau,
          vert-de-blette, cebette, chou-frise]

  - id: herbe
    label: herbes fraîches
    fond: false
    espace: frigo
    rangement: en bouquet dans un verre d'eau, ou dans un torchon humide au frigo
    methode: congeler
    fenetre: {unite: jours, valeur: 5}
    source: ordre de grandeur, non sourcé.
    conseil: >-
      Le reste du bouquet se hache dans un bac à glaçons, se couvre d'huile
      d'olive et se congèle : un cube suffit à finir une soupe ou une poêlée.
    ids: [persil, ciboulette, basilic, menthe, thym-frais, herbes-fraiches]
