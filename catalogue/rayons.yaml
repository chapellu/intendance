    # recette ne cite une denrée d'apéro, c'est ce qui prouve que le plancher du
    # placard agit sans passer par le scoring.
    - tomates-cerises-confites
    - fruits-secs-panaches
    # Ticket du 2026-09-12. Première BOISSON du vocabulaire : aucune recette n'en
    # boit, et le modèle n'a pas de rayon pour elles — l'épicerie faute de mieux,
    # comme les cueillettes sont au primeur faute de rayon « cueillette ».
    - nectar-mangue
    # ── Arrivés avec le FOND DE ROULEMENT (2026-10-18). La troisième fois que le
    # vocabulaire grandit sans recette : ici c'est un MINIMUM qu'on veut tenir
    # qui nomme. Les pois cassés étaient la seule légumineuse du fond sans id.
    - pois-casses
  # LES LÉGUMES ACHETÉS SURGELÉS, distincts de leurs homonymes frais —
  # `petits-pois` (primeur, mai–juillet) et `petits-pois-surgeles` ne
  # s'achètent ni au même rayon ni au même moment, et l'un tient trois jours
  # quand l'autre tient des mois. Les aliaser ferait dire au calendrier des
  # saisons que le sachet du congélateur est « hors saison » en novembre.
  surgelés:
    - epinards-surgeles
    - herbes-surgelees
    - petits-pois-surgeles
    - haricots-verts-surgeles
    - champignons-surgeles
    - legumes-surgeles
    # T187 — le colin ACHETÉ SURGELÉ était rangé en poissonnerie : ajouté au
    # stock, il finissait au frigo. Son rayon dit sa porte, donc il vit ici ;
    # il reste central par `centraux.ids` (le poisson d'un plat de poisson).
    - colin-surgele
    # T198 — LA VIANDE ET LE POISSON DU FOND, AU CONGÉLATEUR : achetés frais (Grand
    # Frais) et portionnés en sacs, ou achetés surgelés. Distincts du frais pour
    # la même raison que les petits pois : ils ne tiennent pas trois jours mais
    # des mois. Centraux par `centraux.ids`.
    - boeuf-hache-congele
    - poulet-filets-congeles
    - saumon-congele
    # T198 — les légumes d'été et du marché, surgelés : le dîner de courgettes
    # se fait en février, et un soir sans courses.
    - courgettes-surgelees
    - poivrons-surgeles
    - aubergines-surgelees
    - poireaux-surgeles
    - moules-surgelees
    - pain-levain-congele

