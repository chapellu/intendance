# Shopping-aisle table for the week planner.
#
# Three jobs beyond the obvious one:
#
# 1. `ordre` is the order you walk the shop, so the list comes out in the order
#    you meet the shelves. That ordering is household data, not recipe data.
#
# 2. `aliases` merges ingredient ids that mean the same thing. Recipes authored
#    independently drift immediately — `oignons`/`oignon`, then
#    `pommes-de-terre`/`pomme-de-terre` the moment a bulk repertoire landed.
#    This map is the cheap stand-in for the typed ingredient vocabulary the
#    corpus actually needs.
#
# 3. `placard` marks what the household almost certainly already owns in the
#    quantities these recipes use. Those are listed to *check*, never added to
#    the buy list — a list that says "buy salt" every week gets ignored.
#
# 4. `centraux` decides which ingredients the app is allowed to ASK about (T33).
#    You do not make a bolognese without meat; you make it perfectly well
#    without parsley. Centrality rides on the aisle rather than on `apports`
#    because deriving it from `apports` would need a `viande-rouge → boeuf-hache`
#    table, which is judgement, i.e. data entry in disguise.

ordre: [primeur, boucherie, poissonnerie, crèmerie, frais, épicerie]

# Ce dont un plat ne se fait pas. Quand la confiance est basse sur l'un d'eux,
# l'app demande ; sur tout le reste elle parie en silence.
#
# LA RÈGLE EST DANS `rayons`, LA LISTE EST L'EXCEPTION. Boucherie, poissonnerie
# et crèmerie sont centraux en entier — un rayon suffit à les décrire. L'épicerie
# ne l'est pas : elle porte le riz ET le vinaigre balsamique, et seuls ses
# féculents commandent un plat. D'où `ids`, qui ne nomme QUE ces féculents-là.
#
# Le primeur reste secondaire, et c'est délibéré : l'oignon paraît dans 42 % des
# 86 plats, l'ail dans 19 % — demander sur eux serait demander tout le temps,
# donc ne rien départager. `frais` est secondaire pour la même raison qu'il est
# petit : une recette qui tient vraiment sur ses gnocchis le dit sur sa ligne,
# avec `central: true`, et cette surcharge l'emporte sur tout ce qui suit.
#
# LISTE POSÉE À VUE, À RÉGLER À L'USAGE — le même statut que les nombres
# d'`equilibre.yaml`, et pour la même raison : seul l'usage dira si demander
# « des biscottes ? » vaut la question qu'elle coûte.
centraux:
  rayons: [boucherie, poissonnerie, crèmerie]
  ids:
    # Légumineuses et céréales sèches
    - lentilles-seches
    - pois-chiches
    - haricots-rouges
    - ble-lentilles
    - orge
    - kasha
    - flocons-avoine
    - semoule
    # Pâtes et riz. `riz-arborio` et `riz-rond` restent distincts de `riz` ici
    # comme partout : un risotto ne se fait pas avec le basmati du placard.
    - pates
    - pates-lasagne
    - vermicelles
    - riz
    - riz-arborio
    - riz-rond
    # Farines. Les trois céréales sont trois lignes de courses (voir plus bas),
    # donc trois questions distinctes — manquer du petit épeautre n'est pas
    # réparé par un paquet de farine complète.
    - farine-complete
    - farine-epeautre
    - farine-petit-epeautre
    # Les féculents qui PORTENT le plat : sans pain de mie il n'y a pas de
    # croque-monsieur, sans tortilla pas de wrap. `maizena` et `chapelure` ne
    # sont pas ici — elles épaississent et elles panent, elles ne portent rien.
    - tortillas
    - pain-de-mie
    - pain-levain
    - biscottes
    - cracotte
    - krisprolls
    - puree-mousline
    - quinoa
    - lentilles-corail
    - petit-epeautre
    - gruau-avoine
    - nouilles-soba
    - baguette

aliases:
  oignons: oignon
  pommes-de-terre: pomme-de-terre

rayons:
  primeur:
    - oignon
    - oignon-rouge
    - ail
    - carottes
    - courgettes
    - aubergine
    - poivron
    - tomates
    - pomme-de-terre
    - poireau
    - brocoli
    - citron
    - salade-verte
    # Arrivés avec les recettes de printemps de Chioca (p. 26–34).
    - cebette
    - ciboulette
    - persil
    - thym-frais
    - vert-de-blette
    - pousses-epinards
    - petits-pois
    - pois-gourmands
    - navet-primeur
    - navets-roses
    - echalote
    - champignons-paris
    - celeri-branche
    - fraises
    - peches
    - tomates-roma
    - concombre
    - chou-chinois
    - chou-frise
    - celeri-rave
    - champignons-conserve
    - basilic
    - abricots
    # NE S'ACHÈTENT PAS — SE CUEILLENT. Le modèle n'a pas de rayon
    # « cueillette », et trois des dix recettes saisies en dépendent (orties
    # p. 34 et p. 35, pousses sauvages et ail des ours p. 36). C'est une vraie
    # limite pour un projet qui a un jardin : la liste de courses les fait
    # acheter alors qu'ils demandent une sortie, une saison et une
    # identification. Rangés ici faute de mieux.
    - orties
    - pousses-sauvages
    - ail-des-ours
    - fenouil-sauvage
    - herbes-fraiches
    # Les châtaignes de la p. 124 rejoignent ce bloc : « venant juste d'être
    # ramassées ou achetées au marché ». Elles s'achètent AUSSI, ce qui en
    # fait le premier ingrédient à double régime de la liste.
    - chataignes
    # Arrivés avec l'hiver de Chioca (p. 177–182). `navets` est le navet d'hiver
    # et reste un id à part de `navet-primeur` et de `navets-roses`, qui sont des
    # légumes de printemps : les aliaser reviendrait à dire que le pot-au-feu de
    # février et la salade de mai s'achètent au même moment.
    - topinambours
    - panais
    - navets
    - potimarron
    # Arrivés avec l'été (p. 82) et l'automne (p. 157–166). Les fruits n'ont
    # pas de rayon à eux : le primeur les vend à côté des légumes.
    - tomates-cerises
    - pommes
    - poires
    - banane
    - chou-rouge
    # Arrivés avec l'été (p. 93 à 101). `fruits-frais` est volontairement
    # générique : la p. 101 écrit « fraises, poires, pêches, cerises ou
    # abricots SELON LA SAISON », donc l'ingrédient EST la substitution.
    - sauge
    - romarin
    - fruits-frais
    - mures
    - groseilles
    - courge
    # Arrivés avec « Je mange sain et bio, même au boulot ! ». Les deux souches
    # p. 72 et p. 86 amènent chacune un ingrédient d'un genre nouveau :
    # `legumes-verts-saison` est une CLASSE (l'autrice écrit « seuls ou en
    # mélange, en fonction de la saison » — l'ingrédient EST la substitution,
    # même parti que `fruits-frais`), et `sarriette` est une aromatique
    # fonctionnelle : elle est là pour la digestion des légumineuses, pas pour
    # le parfum.
    - legumes-verts-saison
    - sarriette
    # Arrivés avec « Je mange sain et bio, même au boulot ! ». Le fenouil-bulbe
    # est un id à part de `fenouil-sauvage` et de `graines-fenouil` : trois
    # produits, trois lignes de courses.
    # `avocat` et `pomelo` sont les deux premiers fruits d'import du catalogue —
    # ils ne viennent d'aucun jardin de Francheville, et le modèle n'a pas d'axe
    # pour le dire.
    - fenouil
    - avocat
    - pomelo
    - menthe
    - radis
    - jeunes-pousses
  boucherie:
    - boeuf-hache
    - agneau-collier
    - roti-porc
    - poulet
    - poulet-filets
    - jambon
    - jambon-cru
    - jarret-boeuf
    - os-a-moelle
    - saucisse-fumee
  poissonnerie:
    - saumon
    - colin-surgele
    - sardines-boite
    # Poissons fumés du chapitre lunchbox : ils se mangent froids, sans
    # cuisson, ce qui est exactement ce qu'un déjeuner emporté demande.
    - saumon-fume
    - truite-fumee
    - cabillaud
    - anchois
  crèmerie:
    - oeufs
    - fromage-rape
    - creme
    - lait
    - feta
    - faisselle
    - chevre-demi-sec
    - chevre-buche
    - parmesan
    - cantal
    - beurre
    - petits-suisses
    - tomme-savoie
    - mozzarella
    - mascarpone
    # `yaourt-soja` est un id d'INGRÉDIENT, distinct du type de chaînage
    # `yaourt-soja` qu'émet la p. 159 : on peut l'acheter ou le cuisiner.
    - yaourt-soja
    - yaourt-brebis
    - yaourt-nature
    - chevre-frais
    - gouda
    - etorki
  frais:
    - tofu-fume
    - gnocchis
    - pate-brisee
    - pate-feuilletee
    - feuilles-brick
    # `tofu-lactofermente` reste DISTINCT de `tofu-fume` : l'autrice le choisit
    # pour sa digestibilité, pas pour son goût, et les deux ne se remplacent pas.
    - tofu-lactofermente
  épicerie:
    - lentilles-seches
    - pates
    - pates-lasagne
    - vermicelles
    - riz
    - tomates-pelees
    - pois-chiches
    - haricots-rouges
    - mais
    - lait-coco
    - tortillas
    - pain-de-mie
    - farine-complete
    - poudre-amande
    - poudre-a-lever
    - vin-blanc-sec
    - flocons-avoine
    - kasha
    - vinaigre-balsamique
    - biscottes
    - orge
    - creme-coco
    - sucre-roux
    - sucre-vanille
    - chocolat-noir
    - huile-coco
    - sucre-complet
    - sirop-agave
    - extrait-vanille
    - lait-soja-vanille
    - biscuits-cuillere
    - sirop-imbibage
    - cacao
    - pain-levain
    - olives-noires
    - concentre-tomate
    - gousse-vanille
    - rhum
    - vinaigre
    - tahin
    - pruneaux
    - noix
    - caissettes
    - pots-carton
    # Arrivés avec le clafoutis p. 115. `farine-petit-epeautre` est un id à part
    # de `farine-complete` : le petit épeautre (engrain) et le grand épeautre
    # sont deux céréales distinctes, vendues côte à côte au rayon bio. Les
    # aliaser aurait fusionné deux lignes de courses qui ne s'achètent pas au
    # même endroit — exactement l'inverse du service que rend `aliases`.
    - lait-amande
    - puree-amande-blanche
    - farine-petit-epeautre
    - miel-acacia
    - extrait-amande-amere
    - amandes-effilees
    # Arrivés avec l'hiver (p. 177 et p. 178).
    - cornichons
    - thon-boite
    # Arrivés avec l'été et l'automne (p. 82 à 166). `riz-arborio` reste
    # distinct de `riz` : un riz rond à risotto ne remplace pas un basmati,
    # et les deux se retrouvent dans la même semaine (p. 85 et p. 86).
    - capres
    - sauce-tomate
    - riz-arborio
    - huile-pepin-raisin
    - huile-tournesol
    - ferments-yaourt
    - creme-soja
    - levure-boulangere
    - agar-agar
    - lait-avoine
    - eau-fleur-oranger
    # Arrivés avec le RELEVÉ DU GARDE-MANGER (2026-08-26), pas avec une recette.
    # C'est une première : jusqu'ici le vocabulaire ne grandissait qu'en saisissant
    # un plat, donc il ne nommait que ce qu'on cuisine. Un placard contient aussi
    # ce avec quoi on n'a encore rien cuisiné, et ces ids sont ce qui permet au
    # garde-manger de pointer vers le même mot que la liste de courses.
    - petits-pois-carottes
    - pousses-haricots
    - maquereaux-boite
    - pignons-pin
    - cocktail-fruits
    - creme-dessert-chocolat
    - confiture-orange
    # `miel` est générique et reste DISTINCT de `miel-acacia`, que la p. 115
    # demande nommément. Les aliaser ferait croire qu'un pot de miel de placard
    # répond à une recette qui veut de l'acacia.
    - miel
    - chocolat-poudre
    - puree-mousline
    - cracotte
    - krisprolls
    # `sucre-blanc` complète `sucre-roux`, `sucre-complet` et `sucre-vanille` :
    # les quatre sucres du foyer sont enfin nommés.
    - sucre-blanc
    - ble-lentilles
    - semoule
    - feuilles-nori
    - graines-courge
    - tomates-sechees
    # Bocal du commerce, à ne pas confondre avec le type de chaînage
    # `sauce-bolognaise` qu'un plat souche émet : l'un s'achète, l'autre se
    # cuisine, et c'est le second qui fait gagner du temps.
    - sauce-bolognaise-bocal
    - guacamole
    - compote
    - terrine-campagne
    # `farine-epeautre` (grand épeautre) est un troisième id, à côté de
    # `farine-complete` et de `farine-petit-epeautre` : trois céréales, trois
    # lignes de courses, et les deux épeautres sont vendus côte à côte.
    - farine-epeautre
    - maizena
    - chapelure
    # `riz-rond` est le riz de bocal, générique. Il reste distinct de
    # `riz-arborio`, qui est un riz À RISOTTO : la p. 85 ne se contente pas d'un
    # riz rond quelconque.
    - riz-rond
    - fruits-secs-melange
    - preparation-amandine
    # Arrivés avec « même au boulot ! ». `laitue-de-mer` est la première algue
    # du catalogue — conservée au sel, elle demande trois rinçages, ce que la
    # recette p. 37 porte en étape.
    # `olives-vertes` complète `olives-noires` : les deux se retrouvent dans la
    # même semaine et ne s'achètent pas ensemble.
    - laitue-de-mer
    - tapenade
    - pistaches
    - olives-vertes
    - noisettes
    - quinoa
    - lentilles-corail
    - haricots-blancs
    - petit-epeautre
    - gruau-avoine
    - puree-noisette
    - levure-biere
    - baguette
    - jus-orange
    - huile-essentielle-orange
    - figues-seches
    - raisins-secs
    - jus-pomme
    - nouilles-soba
    # `tomates-cerises-confites` et `fruits-secs-panaches` sont distincts de
    # `tomates-sechees` et `fruits-secs-melange`, qui portent `usage: apero` au
    # garde-manger. Ce ne sont pas les mêmes produits — les cerises confites à
    # l'huile de la p. 44 et le panachage à pâtisser de la p. 108 ne sont pas un
    # bocal d'apéritif — et les confondre casserait la promesse de T40 : aucune
    # recette ne cite une denrée d'apéro, c'est ce qui prouve que le plancher du
    # placard agit sans passer par le scoring.
    - tomates-cerises-confites
    - fruits-secs-panaches

