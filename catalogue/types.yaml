# ---------------------------------------------------------------------------
# CE QU'UN PLAT PRODUIT, DIT EN FRANÇAIS — T193.
#
# Un `emits` porte un `type` (`lentilles-vertes-cuites`) qui sert à chaîner,
# jamais à être lu. Les écrans le dé-tiretisaient faute de mieux : « pate
# vegetal », « puree lentilles carottes », sans accents — noté au backlog
# depuis T15 (« Le catalogue n'a pas de nom lisible pour ce qu'il produit »).
#
# LA PLUPART N'ONT PAS BESOIN D'ÊTRE ÉCRITS ICI. Un type émis par UN SEUL plat,
# qui n'émet que lui, se dit par le titre de ce plat (`export_json.py`) : le
# reste du « Casspoulet » est du casspoulet. Ce fichier ne nomme que ce que le
# titre ne peut pas dire — les bases (une pâte, des lentilles cuites), les
# types que plusieurs plats émettent, et ceux d'un plat qui en émet plusieurs
# (le pot-au-feu laisse un bouillon, de la viande et des légumes).
# `verifier.py` refuse un type émis qui n'a ni l'un ni l'autre.
# ---------------------------------------------------------------------------
