# ---------------------------------------------------------------------------
# Cibles d'équilibre de la semaine, et poids du classement « équilibre ».
#
# HONNÊTETÉ SUR CE QUE ÇA FAIT, ET NE FAIT PAS
# Ceci ne calcule aucun apport nutritionnel. C'est une *couverture par
# catégories* : est-ce que la semaine touche assez de sources de protéines
# différentes, assez de familles de légumes, sans répéter trois fois le même
# féculent ni le même format de plat. C'est suffisant pour proposer un plat qui
# complète la semaine, et très insuffisant pour prétendre à un équilibre
# nutritionnel réel.
#
# Le vrai chemin, si on veut des apports au sens strict : la table de
# composition **Ciqual** de l'ANSES, publiée sous **Licence Ouverte** — donc
# compatible avec la politique de contenu du projet (CC0 / Licence Ouverte /
# CC BY / travail propre), contrairement aux bases sous BY-SA. Les repères de
# fréquence ci-dessous devraient de même être sourcés sur les recommandations
# du PNNS plutôt que posés à vue. **Les chiffres actuels ne sont pas sourcés :
# ce sont des hypothèses de prototype, à remplacer.**
# ---------------------------------------------------------------------------

# Fréquences visées sur une semaine (hypothèses non sourcées — cf. ci-dessus).
cibles:
  proteine:
    legumineuse: {min: 2}
    poisson: {min: 1}
    oeuf: {min: 1}
    viande-rouge: {max: 1}
    viande-blanche: {max: 2}
    fromage: {max: 2}
    tofu-soja: {min: 0}
  # Nombre de familles de légumes distinctes visé sur la semaine.
  familles_legumes_min: 5
  # « Varier les plaisirs » se mesure sur le **format** du plat (mijoté, four,
  # poêlé, soupe, cru, rapide) — pas sur la nationalité. Corrigé par
  # l'utilisateur : dans un foyer qui cuisine français, plafonner l'origine
  # faisait remonter des plats exotiques sans raison. `origine` reste saisi
  # dans les recettes mais ne pèse plus rien.
  repetition_max:
    feculent: 2
    profil: 2

# Poids du score. Positif = attire le plat vers le haut de la proposition.
poids:
  proteine_manquante: 6      # comble une cible non atteinte
  proteine_saturee: -5       # dépasse un plafond
  famille_legume_neuve: 2    # chaque famille de légumes pas encore vue
  repetition_feculent: -3
  repetition_profil: -4      # l'axe « varier les plaisirs », renforcé
  chaine_couverte: 4         # sa base est déjà cuite plus tôt dans la semaine
  ecoule_frigo: 5            # consomme un reste qui dort au frigo
  ecoule_congelo: 3          # sort une portion d'urgence du congélateur
  # UN SEUL POIDS POUR TOUT CE QUI S'ÉCOULE — T57 et T59, Workspace#50.
  #
  # Il remplace la paire `ecoule_placard_urgent: 5` / `ecoule_placard_entame: 2`,
  # qui classait par RANG là où on sait maintenant classer par FRACTION DE VIE
  # CONSOMMÉE. Le score vaut `ecoule × somme des fractions`, sur au plus trois
  # articles : 1,0 rend exactement l'ancien 5 et 0,4 l'ancien 2. Ce ticket donne
  # donc une échelle au placard, il ne change pas ce qu'il pèse.
  #
  # `ecoule_frigo` et `ecoule_congelo` ci-dessus sont ses deux autres moitiés et
  # tombent avec T47 : classer par ENDROIT est un proxy grossier de l'urgence —
  # « une bolognaise un peu vieille au congélateur est plus urgente qu'un truc
  # frais au frigo ». Elles restent le temps que le modèle Python, qui les lit,
  # suive ; rien côté app ne les lit, et T48 les compte comme mortes.
  #
  # SEULES LES DENRÉES À RISQUE SONT PAYÉES, et c'est tout le point. Utiliser une
  # boîte de conserve qui tient trois ans n'a rien d'urgent — et c'est déjà
  # récompensé ailleurs, par `article_marginal` qui ne monte pas quand
  # l'ingrédient est au placard. Payer aussi le maïs ferait gagner les plats à
  # longue liste d'épicerie, ce qui est l'inverse du service rendu.
  #
  # Valeur posée à vue, à régler à l'usage — et c'est ICI que se corrigerait un
  # écoulement trop dominant, jamais dans un mécanisme de plus.
  ecoule: 5                  # × la fraction de vie consommée, cumulée sur 3 max
  chaine_manquante: -8       # exige une base que rien ne produit avant
  hors_budget: -4
  # LES DEUX PLANCHERS SONT DEUX MÉCANIQUES, DONC DEUX POIDS (T36). Le premier
  # paie le plancher de SECOURS — « il n'y a plus de soir qu'on sauve » —, le
  # second le plancher PAR TYPE — « la dernière bolognaise vient de partir ».
  # Le secours vaut plus, parce qu'il protège la soirée qui s'effondre quand le
  # par-type ne protège qu'une habitude. Les deux restent sous
  # `proteine_manquante` : reconstituer départage deux plats également bons, ça
  # ne rend pas bon un plat qui sature une protéine. Valeurs posées à vue, à
  # régler à l'usage.
  plancher_congelo: 4        # remonte le stock d'urgence quand il est bas
  plancher_type: 3           # recharge un type précis passé sous son plancher
  mal_transporte: -6         # déjeuner de coworking : ce plat voyage mal
  article_marginal: -0.4     # la liste de courses pèse, mais ne décide plus
  # Anticipation ratée : l'échéance est DÉJÀ passée (le trempage était pour
  # hier soir). Ce n'est pas un interdit, c'est un prix — même règle 7 Wonders
  # que le chaînage. Un plat qui demande simplement de s'y prendre à l'avance
  # n'est pas pénalisé du tout : sanctionner l'anticipation reviendrait à
  # décourager les légumineuses, ce que la cible `legumineuse: {min: 2}` juste
  # au-dessus passe son temps à encourager.
  anticipation_ratee: -5

# Le congélateur est une *sortie* à part entière, pas un débarras : un plat
# souche produit des portions d'urgence en bocal ou en barquette. Le foyer a
# trois tiroirs (#29), et c'est la contrainte qui mord — d'où le plafond.
congelateur:
  portions_par_tiroir: 6
  # Plancher, au sens de l'ordre permanent de RimWorld (« cuisiner jusqu'à en
  # avoir N ») : en dessous, le congélateur n'a plus assez de portions pour
  # amortir un soir qui s'effondre, et un plat qui le recharge vaut plus qu'un
  # plat qui nourrit seulement ce soir. Ce n'est pas une cible à atteindre — un
  # congélateur plein n'est pas un but — c'est un seuil sous lequel on redevient
  # dépendant de la liste de courses. Valeur posée à vue, à régler à l'usage.
  plancher: 4
  # ET LA DIVERSITÉ, QUI MANQUAIT (T36). « Quatre portions » sans elle, c'est
  # quatre bolognaises — et l'utilisateur a tranché : « si je déstocke la
  # dernière bolognaise il faut encourager d'en refaire », donc quatre fois le
  # même plat n'est pas une réserve, c'est un stock d'un plat. L'objection tuait
  # le compteur SANS diversité, pas le compteur : les deux conditions tiennent
  # ensemble. Posée à vue elle aussi.
  diversite_min: 3
  # DEUX POPULATIONS, DEUX PLAFONDS (T35). Un pot-au-feu met en stock d'un seul
  # soir un `bouillon-pot-au-feu` (une base — elle ne fait pas un dîner, elle en
  # accélère un) et une `viande-pot-au-feu` (un dîner). Ce sont deux réserves
  # différentes, et elles se disputent les mêmes tiroirs : si les bocaux de
  # bouillon mangent les dix-huit places, il ne reste plus un seul soir qu'on
  # sauve. Les deux plafonds font donc exactement la capacité — 6 + 12 = 18 —
  # et un test l'épingle. Le partage, lui, est posé à vue.
  plafond_apports: 6
  plafond_diners: 12
  # Une protéine plafonnée n'est décomptée que si elle est ACHETÉE. Reprendre
  # une bolognaise déjà cuisinée et congelée ne « dépense » pas le quota de
  # viande rouge de la semaine : la viande a été payée la semaine où on l'a
  # achetée. Refuser le reste ne fait que gaspiller.
  reste_ne_compte_pas_dans_les_plafonds: true

# Main de cartes : combien de plats proposer par soir, et quelles catégories
# garantir dans la main. Le deck tourne — un plat récemment cuisiné
# (historique.yaml) sort du paquet pour `cooldown_jours`.
main:
  taille: 5
  cooldown_jours: 10
  garantir: [express, souche, derive]
