# Capability fallback rules — GLOBAL, not per-recipe. This is the anti-explosion bet
# of ticket #31: a recipe step requires a capability; these chains say how each
# capability degrades onto whatever the household actually owns. Adding a recipe
# adds zero rules; adding a tool amends a handful of chains.
#
# Each entry: ordered candidates. First one satisfiable by household equipment wins.
# `rewrite` replaces the step's tool phrase; `time_delta_min` adjusts the step timer.

capabilities:
  # LE COUTEAU PASSE DEVANT LE PETIT BLENDER, et c'est une décision du 15/09/2026
  # prise en voyant l'écran : le guide annonçait « au petit blender » sur des
  # étapes qui disent « émincer les oignons » et « tailler les carottes en petits
  # dés ». Le blender hache, il ne taille pas — sur un émincé, c'est le repli qui
  # abîme le plus le résultat, et l'ordre d'une chaîne de repli dit lequel on
  # préfère. Il reste dans la chaîne, derrière : une purée de légumes racines
  # s'en accommode très bien.
  #
  # Les deux `time_delta_min` sont relatifs au plan A (le robot ménager), que ce
  # foyer n'a pas ; ils ne changent pas avec l'ordre.
  chop-coarse:
    - tool: food-processor
    - tool: couteau
      rewrite: "au couteau, sur une planche"
      time_delta_min: 5
    - tool: mini-blender
      rewrite: "au petit blender, en 2–3 fois, par impulsions courtes"
      time_delta_min: 3

  blend-smooth:
    - tool: blender
    - tool: mixeur-plongeur
      rewrite: "au mixeur plongeur, directement dans le récipient"
      time_delta_min: 0

  steam:
    - tool: cuit-vapeur
    - tool: cocotte-7.5l
      rewrite: "dans le panier vapeur de la cocotte, 2 cm d'eau au fond"
      time_delta_min: 0
    - tool: micro-ondes
      rewrite: "au micro-ondes, récipient couvert avec un fond d'eau"
      time_delta_min: -5

  pan-fry: [{tool: sauteuse-28}, {tool: poele-inox-30}, {tool: poeles-ingenio}]
  simmer: [{tool: casseroles}, {tool: sauteuse-28}]
  simmer-large: [{tool: cocotte-7.5l}]
  bake: [{tool: four-chaleur-tournante}]
  gratin: [{tool: four-chaleur-tournante}]
  # Le gril est une résistance de voûte, pas la chaleur tournante — une capacité
  # distincte, et un four qui ne l'a pas doit finir autrement plutôt que de
  # sauter l'étape. Ce foyer l'a ; la chaîne existe pour celui qui ne l'aurait pas.
  grill:
    - tool: four-chaleur-tournante
    - tool: none
      rewrite: "sans gril : prolonger de 5 min à 210 °C en surveillant la couleur"
      time_delta_min: 5
  # LE GAUFRIER, ET C'EST LA PREMIÈRE CAPACITÉ SANS REPLI PRATICABLE. Le croque
  # p. 177 s'en passait parce que l'autrice donnait elle-même le four comme
  # seconde voie ; une gaufre n'en a aucune — sans gaufrier, la p. 111 ne se
  # fait pas, un point c'est tout. Déclarer la capacité avec un seul outil que
  # le foyer ne possède PAS est la seule façon pour le modèle de dire ça :
  # `resolve_capability` renvoie alors (None, None) et `compile.py` marque
  # l'étape « aucune solution avec l'équipement du foyer ».
  #
  # Ce chemin de code existait depuis le début et rien ne l'avait jamais
  # emprunté. C'est aussi ce qui manquait à la p. 177 pour signaler que son plan
  # A était hors de portée : là-bas le repli était dans la prose, ici il est
  # dans le modèle.
  gaufrier: [{tool: gaufrier}]

  # SECONDE CAPACITÉ SANS REPLI, ET POUR LA MÊME RAISON QUE LE GAUFRIER : la
  # p. 20 de « même au boulot ! » cuit son pain de mie EN MACHINE, et ce foyer
  # n'en a pas. Un pain à la machine n'a pas de repli au four — ce serait un
  # autre pain, avec un autre procédé et d'autres temps, et c'est justement la
  # p. 19. Déclarer l'outil sans que le foyer le possède est ce qui fait dire au
  # compilateur « aucune solution avec l'équipement du foyer » au lieu de
  # bricoler une équivalence qui n'existe pas.
  #
  # La différence avec le gaufrier vaut d'être notée : la gaufre p. 111 n'avait
  # AUCUNE autre voie, alors qu'ici le livre fournit lui-même le plan A de
  # remplacement à la page précédente. Le `plan_b` de la p. 20 y renvoie.
  machine-a-pain: [{tool: machine-a-pain}]

  puree: [{tool: mixeur-plongeur}, {tool: presse-puree, rewrite: "au presse-purée", time_delta_min: 3}]
  weigh:
    - tool: balance-tefal
    - tool: none
      rewrite: "en volume (voir équivalences)"
      time_delta_min: 0

  # Une chaîne de repli qui ne se paie PAS en minutes mais en HEURES D'AVANCE
  # (`avance_h`) — la seconde horloge, celle d'`anticipation.py`. Décongeler ne
  # prend pas plus de temps de cuisine selon l'outil, ça prend plus de PRÉAVIS.
  #
  # Conséquence désagréable et vraie : sans micro-ondes, une portion du
  # congélateur réclame une nuit de préavis, et « portion d'urgence » devient un
  # abus de langage — c'est une réserve. Ce foyer a un micro-ondes, donc la
  # carte se joue le soir même ; le modèle ne le savait pas et l'aurait promis
  # à un foyer qui n'en a pas.
  decongeler:
    - tool: micro-ondes
      rewrite: "au micro-ondes, mode décongélation, en remuant à mi-parcours"
      avance_h: 0.5
    - tool: none
      rewrite: "au frigo, sorti la veille au soir"
      avance_h: 12
