# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# SEIZE GAUFRES DE LIÈGE À LA PÂTE LEVÉE : ghee fondu, soja-vanille, sucre de coco
# et sucre vanillé tiédis (45 °C au plus), levure, œufs, farine d'épeautre et
# fleur de sel, levée 1 h 30 ; cuites au gaufrier graissé d'une noisette de
# ghee, froides nappées de chocolat croquant. Sans chocolat, avec un voile de
# sucre et de cannelle.

recipe:
  id: gaufres-liege-chocolat
  title: Gaufres de Liège au chocolat
  creneaux: [gouter]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Gaufres de Liège au chocolat (ou pas !) », blog Saines Gourmandises, 24 janvier 2018"
    url: https://saines-gourmandises.fr/tres-retard-lepiphanie-avance-chandeleur/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 16 gaufres »
    pieces: 16
  time_min_total: 130
  active_min: 30

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: poele
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine T110 de grand épeautre", qty: 350, unit: g}
    - {id: sucre-vanille, name: "sucre vanillé", qty: 4, unit: sachet}
    - {id: sucre-complet, name: "sucre de coco", qty: 50, unit: g}
    - {id: ghee, name: "ghee (ou beurre) + pour le gaufrier", qty: 115, unit: g}
    - {id: lait-soja-vanille, name: "lait soja-vanille", qty: 15, unit: cl}
    - {id: oeufs, name: "œufs moyens", qty: 2, unit: pièce}
    - {id: levure-boulangere, name: "levure de boulanger déshydratée", qty: 1, unit: sachet}
    - {id: fleur-de-sel, name: "fleur de sel (c. à c. à peine bombée)", qty: 1, unit: c. à c., seasoning: true}
    - {id: chocolat-noir, name: "chocolat noir pâtissier 70 %", qty: 200, unit: g, optional: true}

  steps:
    - id: pate
      action: "Fondre 100 g de ghee, y mêler hors du feu lait et sucres, tiède, fouetter la levure puis les œufs ; pétrir 5 min avec farine et sel"
      needs: [simmer]
      charge_partielle: true
      uses: [ghee, lait-soja-vanille, sucre-vanille, sucre-complet, levure-boulangere, oeufs, farine-epeautre, fleur-de-sel]
      time_min: 10
      attente_min: 90
      attente_raison: "pousse de 1 h 30 au tiède"
    - id: cuire
      action: "Façonner un boudin, le couper en 16 et cuire chaque morceau au gaufrier graissé d'une noisette de ghee, jusqu'à ce qu'il soit levé et doré"
      needs: [gaufrier]
      uses: []
      time_min: 25
      attended: true
      kid: {age_min_months: 36, task: "poser les boules de pâte"}
    - id: napper
      action: "Laisser refroidir et napper de chocolat fondu au bain-marie"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir]
      time_min: 8

  emits:
    - kind: base
      type: gaufres-liege-chocolat
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
