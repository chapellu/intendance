# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# SIX JAUNES FOUETTÉS DIX MINUTES avec l'agave et l'écorce de mandarine, jusqu'à
# tripler ; un coulis de chocolat au soja-vanille ; des biscuits à la
# cuillère trempés dans le jus des mandarines. À servir aussitôt. Les blancs
# servent ailleurs. Au fouet à main, compter un peu plus.

recipe:
  id: sabayon-mandarine-chocolat
  title: Sabayon à la mandarine Satsuma et coulis de chocolat chaud
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« … et d'un certain sabayon à la mandarine Satsuma et coulis de chocolat chaud », blog Saines Gourmandises, 1er novembre 2012"
    url: https://saines-gourmandises.fr/je-vous-reparle-du-gout-du-bio/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 20
  active_min: 20

  apports:
    proteine: oeuf
    feculent: biscuit
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: mandarines, name: "mandarines Satsuma", qty: 4, unit: pièce}
    - {id: oeufs, name: "jaunes d'œufs", qty: 6, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave", qty: 4, unit: c. à s.}
    - {id: chocolat-noir, name: "chocolat noir", qty: 100, unit: g}
    - {id: lait-soja-vanille, name: "lait de soja-vanille", qty: 30, unit: cl}
    - {id: biscuits-cuillere, name: "biscuits à la cuillère", qty: 4, unit: pièce}
    - {id: cacao, name: "cacao", qty: 1, unit: c. à c.}

  steps:
    - id: sabayon
      action: "Presser les mandarines ; hacher aux ciseaux l'écorce de l'une et la fouetter 10 min avec les jaunes et l'agave, jusqu'à blanchir et tripler"
      needs: []
      uses: [mandarines, oeufs, sirop-agave]
      time_min: 12
    - id: coulis
      action: "Fondre le chocolat à feu très doux dans le soja-vanille"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, lait-soja-vanille]
      time_min: 5
      parallel_with: sabayon
    - id: dresser
      action: "En coupes : demi-biscuit trempé au jus, coulis, deux cuillerées de sabayon, l'autre demi-biscuit, un voile de cacao ; servir aussitôt"
      needs: []
      uses: [biscuits-cuillere, cacao]
      time_min: 5
      kid: {age_min_months: 36, task: "tremper les biscuits dans le jus"}

  emits: []

  plan_b: []
