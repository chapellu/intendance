# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DES « MEAT BALLS » À PEINE CARNÉES : poireaux, céleri et pomme de terre cuits
# à la vapeur, hachés avec pain rassis, œuf et jambon, roulés dans la farine et
# dorés à la poêle. Le robot-hachoir du blog devient le petit blender, en
# deux fois.

recipe:
  id: boulettes-potager-celeri-jambon
  title: « Meat balls » du potager
  format: galettes
  lang: fr
  source:
    author: Marie Chioca
    work: "« Vous faire raffoler du céleri rave ?… chiche ! », blog Saines Gourmandises, 6 mars 2026"
    url: https://saines-gourmandises.fr/vous-faire-raffoler-du-celeri-rave-chiche/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « 4 à 6 personnes en plat principal »
    pieces: 15
  time_min_total: 50        # 15 min + 20 min de vapeur + la poêle
  active_min: 30

  apports:
    proteine: viande-blanche
    feculent: pommes-de-terre
    legumes: [allium, racine]
    profil: poele
    origine: francais

  ingredients:
    - {id: poireau, name: blancs de poireaux, qty: 250, unit: g}
    - {id: celeri-rave, name: petit céleri-rave, qty: 250, unit: g}
    - {id: pomme-de-terre, name: grosse pomme de terre, qty: 250, unit: g}
    - {id: jambon, name: jambon, qty: 250, unit: g}
    - {id: pain-levain, name: pain rassis, qty: 100, unit: g}
    - {id: persil, name: persil, qty: 5, unit: brin}
    - {id: oeufs, name: œuf, qty: 1, unit: pièce}
    - {id: muscade, name: muscade, qty: 1, unit: pincée, seasoning: true}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}
    - {id: farine, name: farine pour rouler, qty: 3, unit: c. à s.}
    - {id: huile-olive, name: huile pour la poêle, qty: 3, unit: c. à s.}

  avec:
    - {id: sauce-tomate, name: sauce tomate, qty: 300, unit: g}
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: vapeur
      action: "Couper les poireaux en fines rondelles, céleri et pomme de terre en petits cubes, et les cuire 20 min à la vapeur"
      needs: [steam]
      uses: [poireau, celeri-rave, pomme-de-terre]
      time_min: 28
      attended: false
    - id: hacher
      action: "Laisser tiédir et hacher par brèves impulsions avec le pain en petits morceaux, l'œuf et le jambon ; ajouter persil haché, sel, poivre, muscade"
      astuce: "Garder de petits morceaux ; en deux fois au petit blender."
      needs: [chop-coarse-small]
      uses: [pain-levain, oeufs, jambon, persil, sel, poivre, muscade]
      time_min: 8
    - id: faconner
      action: "Façonner une quinzaine de grosses boulettes et les rouler dans la farine"
      needs: []
      uses: [farine]
      time_min: 8
      kid: {age_min_months: 24, task: "rouler les boulettes dans la farine"}
    - id: dorer
      action: "Les dorer à la poêle huilée en les faisant rouler"
      needs: [pan-fry]
      uses: [huile-olive]
      time_min: 10
      attended: true

  emits:
    - kind: reste-plat
      type: boulettes-potager-celeri-jambon
      qty_band: lunchbox
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
