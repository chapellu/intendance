# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# QUARANTE BISCUITS CROUSTILLANTS : farines d'épeautre, d'avoine et d'orge, son
# d'avoine, fleur de sel, liés d'une crème caramel de lait de soja-vanille,
# beurre, sucre de coco et huile chauffés ensemble ; la pâte épaissit en
# quelques minutes, s'étale finement, se découpe ; 15 min à 150 °C puis 15 min
# à 110 °C. En boîte hermétique.

recipe:
  id: biscuits-trois-farines-beurre
  title: Biscuits réconfortants aux trois farines
  creneaux: [gouter, petit-dejeuner]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Des biscuits super réconfortants qui embaument la maison… », blog Saines Gourmandises, 12 novembre 2014"
    url: https://saines-gourmandises.fr/que-faire-lorsquil-pleut-des-trombes/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 10          # « 40 biscuits environ »
    pieces: 40
  time_min_total: 50
  active_min: 20

  apports:
    proteine: aucune
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine T130 de grand épeautre", qty: 100, unit: g}
    - {id: farine-avoine, name: "farine d'avoine", qty: 100, unit: g}
    - {id: farine-orge, name: "farine d'orge mondé", qty: 100, unit: g}
    - {id: son-avoine, name: "son d'avoine", qty: 50, unit: g}
    - {id: lait-soja-vanille, name: "lait de soja-vanille", qty: 15, unit: cl}
    - {id: beurre, name: "beurre bio", qty: 60, unit: g}
    - {id: sucre-complet, name: "sucre de coco", qty: 50, unit: g}
    - {id: huile-pepin-raisin, name: "huile de pépin de raisin", qty: 5, unit: cl}
    - {id: fleur-de-sel, name: "pincée de fleur de sel", qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: pate
      action: "Préchauffer à 150 °C ; chauffer le lait avec le beurre, le sucre et l'huile en fouettant, et verser sur les farines, le son et le sel"
      astuce: "Très souple d'abord, la pâte épaissit en quelques minutes."
      needs: [simmer]
      charge_partielle: true
      uses: [lait-soja-vanille, beurre, sucre-complet, huile-pepin-raisin, farine-epeautre, farine-avoine, farine-orge, son-avoine, fleur-de-sel]
      time_min: 8
    - id: decouper
      action: "L'étaler finement et découper les biscuits à l'emporte-pièce sur une plaque chemisée"
      needs: []
      uses: []
      time_min: 12
      kid: {age_min_months: 30, task: "découper les biscuits"}
    - id: cuire
      action: "Cuire 15 min à 150 °C puis 15 min à 110 °C, et laisser refroidir sur une grille"
      needs: [bake]
      uses: []
      time_min: 30
      attended: false

  emits:
    - kind: base
      type: biscuits-trois-farines-beurre
      qty_band: 3-repas
      keeps: {frigo_days: 15, congelo: false}
      note: "boîte en fer ou bocal hermétique"

  plan_b: []
