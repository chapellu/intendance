# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA PÂTE BRISÉE AU SUCRE DE BOULEAU découpée en disques de 5 cm : la moitié
# tartinée de confiture (ou de curd), l'autre évidée en petite forme au
# centre et posée dessus ; 30 à 35 min, puis sucre de bouleau mixé en poudre.

recipe:
  id: sables-confiture-sucre-bouleau
  title: Sablés à la confiture au sucre de bouleau
  creneaux: [gouter]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Tartes de saison et petits gâteaux au sucre de bouleau », blog Saines Gourmandises, 18 juillet 2012"
    url: https://saines-gourmandises.fr/connaissez-vous-le-sucre-de-bouleau/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6
    pieces: 18
  lot_entier: true
  time_min_total: 55
  active_min: 20

  apports:
    proteine: aucune
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine complète d'épeautre", qty: 250, unit: g}
    - {id: margarine, name: "margarine bio (ou beurre)", qty: 125, unit: g}
    - {id: eau, name: "eau tiède", qty: 2.5, unit: cl}
    - {id: sel, name: "pincée de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: sucre-bouleau, name: "sucre de bouleau (+ mixé pour saupoudrer)", qty: 4, unit: c. à s.}
    - {id: confiture-mures, name: "confiture au choix (sans sucre raffiné) ou curd", qty: 150, unit: g}

  steps:
    - id: pate
      action: "Sabler du bout des doigts la margarine et la farine ; fondre 3 c. à s. de sucre et le sel dans l'eau tiède, verser d'un coup, former une boule"
      needs: []
      uses: [farine-epeautre, margarine, eau, sel, sucre-bouleau]
      time_min: 10
    - id: decouper
      action: "Préchauffer à 180 °C ; étaler finement, découper des disques de 5 cm, tartiner la moitié sans toucher les bords, évider les autres et les poser dessus"
      needs: []
      uses: [confiture-mures]
      time_min: 15
      kid: {age_min_months: 36, task: "évider les chapeaux"}
    - id: cuire
      action: "Cuire 30 à 35 min, puis saupoudrer de sucre de bouleau finement mixé"
      needs: [bake]
      uses: []
      time_min: 35
      attended: false

  emits:
    - kind: base
      type: sables-confiture-sucre-bouleau
      qty_band: 3-repas
      keeps: {frigo_days: 7, congelo: false}

  plan_b: []
