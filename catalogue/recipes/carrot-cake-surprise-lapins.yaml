# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN CAKE DANS LE CAKE : la veille, un cake au chocolat et à la carotte (50 min) ;
# le lendemain, des lapins taillés à l'emporte-pièce dans ses tranches, alignés
# dans une pâte de carrot-cake à l'orange, cuite 50 min à la vapeur dans un
# moule à cake de 20 cm. Il reste des chutes de cake au chocolat.

recipe:
  id: carrot-cake-surprise-lapins
  title: Carrot-cake « surprise » aux lapins de chocolat
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Carrot-cake surprise », blog Saines Gourmandises, 7 novembre 2016"
    url: https://saines-gourmandises.fr/8163/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 9          # « un cake de 8 à 10 parts »
  lot_entier: true
  time_min_total: 120
  active_min: 45

  apports:
    proteine: oeuf
    feculent: farine
    legumes: [racine]
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine T80 à T110 (165 + 200 g)", qty: 365, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 2, unit: sachet}
    - {id: carottes, name: "carottes (120 + 230 g)", qty: 350, unit: g}
    - {id: chocolat-noir, name: "chocolat noir pâtissier 70 %", qty: 120, unit: g}
    - {id: oeufs, name: "œufs (3 + 3)", qty: 6, unit: pièce}
    - {id: huile-coco, name: "huile de coco", qty: 60, unit: g}
    - {id: sirop-agave, name: "sirop d'agave (120 + 120 g)", qty: 240, unit: g}
    - {id: rhum, name: "rhum (1 + 2 c. à s.)", qty: 3, unit: c. à s.}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 1, unit: c. à s.}
    - {id: huile-essentielle-orange, name: "huile essentielle d'orange", qty: 20, unit: pièce}
    - {id: jus-orange, name: "jus d'orange", qty: 60, unit: g}
    - {id: huile-tournesol, name: "huile de tournesol", qty: 6, unit: cl}
    - {id: sucre-vanille, name: "sucre vanillé", qty: 2, unit: sachet}

  steps:
    - id: chocolat
      action: "Préchauffer à 180 °C ; mêler 120 g de carottes râpées et 3 œufs, puis le chocolat fondu avec rhum, vanille, coco et 120 g d'agave, puis la farine"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, huile-coco, extrait-vanille, carottes, rhum]
      time_min: 12
    - id: cuire-chocolat
      action: "Cuire 45 à 50 min dans un moule à cake et laisser refroidir"
      needs: [bake]
      uses: []
      time_min: 50
      attended: false
      attente_min: 600
      attente_raison: "jusqu'au lendemain, pour une découpe nette"
    - id: pate
      action: "Porter 2 l d'eau à ébullition sous un panier vapeur ; mêler la farine et la levure restantes avec le reste des ingrédients et 230 g de carottes râpées"
      needs: [steam]
      uses: [farine-epeautre, poudre-a-lever, carottes, oeufs, sirop-agave, huile-essentielle-orange, jus-orange, huile-tournesol, rhum, sucre-vanille]
      time_min: 10
    - id: lapins
      action: "Verser un quart de pâte dans le moule, aligner debout les lapins taillés dans les tranches de cake au chocolat, couvrir du reste"
      needs: []
      uses: []
      time_min: 10
      kid: {age_min_months: 36, task: "découper les lapins à l'emporte-pièce"}
    - id: vapeur
      action: "Cuire 50 min à la vapeur, démouler et laisser refroidir sur une grille avant de couper"
      needs: [steam]
      uses: []
      time_min: 50
      attended: false

  emits:
    - kind: reste-plat
      type: carrot-cake-surprise-lapins
      qty_band: 3-repas
      keeps: {frigo_days: 4, congelo: true}

  plan_b: []
