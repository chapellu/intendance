# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LE POTIMARRON SE FAIT PASSER POUR DU MARRON : 150 g de chair cuite à la vapeur,
# mixés avec le chocolat 70 % fondu dans le soja-vanille, l'huile et le sucre
# de coco, farine et levure ; 15 min dans un moule de 20 cm, un glaçage
# autolissant de chocolat, soja et agave ; une nuit, puis huit parts décorées
# en rennes. Sortir 2 h avant : l'huile de coco durcit au frais.
# LA PURÉE DE POTIMARRON EST UN RESTE du catalogue ; à défaut, cuire un
# potimarron 15 min à la vapeur.

recipe:
  id: fondant-potimarron-chocolat-rennes
  title: Fondant au (poti)marron façon « rennes de Noël »
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Fondant au (poti-)marron façon Rennes de Noël », blog Saines Gourmandises, 7 décembre 2016"
    url: https://saines-gourmandises.fr/noel-bio-a-budget-sympa-partie-1/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 8 personnes »
  lot_entier: true
  time_min_total: 40
  active_min: 25

  accepts:
    - type: puree-potimarron
      qty: {amount: 150, unit: g}
      required: true
      fallback_recipe: puree-potimarron-huile-olive

  sans_reste:
    temps_min: 15
    ingredients:
      - {id: potimarron, name: "potimarron à cuire à la vapeur (150 g de chair)", qty: 0.2, unit: pièce}

  apports:
    proteine: aucune
    feculent: farine
    legumes: [cucurbitacee]
    profil: four
    origine: francais

  ingredients:
    - {id: puree-potimarron, name: "chair de potimarron cuite", qty: 150, unit: g, from_accepts: true}
    - {id: lait-soja-vanille, name: "lait de soja vanille (10 + 5 cl)", qty: 15, unit: cl}
    - {id: chocolat-noir, name: "chocolat noir pâtissier 70 % (300 + 100 g)", qty: 400, unit: g}
    - {id: huile-coco, name: "huile de coco", qty: 75, unit: g}
    - {id: sucre-complet, name: "sucre de coco ou de canne", qty: 75, unit: g}
    - {id: farine-epeautre, name: "farine T110", qty: 75, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: fleur-de-sel, name: "pincée de fleur de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: gousse-vanille, name: "gousse de vanille", qty: 1, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave", qty: 5, unit: cl}

  steps:
    - id: fondre
      action: "Préchauffer à 180 °C ; chauffer 10 cl de soja avec l'huile, le sucre, la vanille grattée et le sel, couper à l'ébullition et y fondre 300 g de chocolat"
      needs: [simmer]
      charge_partielle: true
      uses: [huile-coco, sucre-complet, gousse-vanille, fleur-de-sel]
      time_min: 6
    - id: mixer
      action: "Mixer le chocolat avec la chair de potimarron, la farine et la levure, verser dans un moule huilé de 20 cm et cuire 15 min"
      needs: [blend-smooth, bake]
      uses: [puree-potimarron, farine-epeautre, poudre-a-lever]
      time_min: 20
    - id: glacage
      action: "Fondre doucement le reste du chocolat avec 5 cl de soja et l'agave, et le verser chaud sur le gâteau"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, lait-soja-vanille, sirop-agave]
      time_min: 5
      attente_min: 600
      attente_raison: "une nuit pour prendre"
    - id: rennes
      action: "Couper en huit à la lame chaude et décorer chaque part en renne"
      needs: []
      uses: []
      time_min: 10
      kid: {age_min_months: 36, task: "décorer les rennes"}

  emits:
    - kind: reste-plat
      type: fondant-potimarron-chocolat-rennes
      qty_band: 3-repas
      keeps: {frigo_days: 4, congelo: false}

  plan_b: []
