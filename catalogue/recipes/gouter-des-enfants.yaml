# Recette du foyer, rédigée pour ce dépôt le 2026-10-21 (T142) — aucune source
# extérieure. CE N'EST PAS UNE CARTE : c'est la RATION D'UN GOÛTER pour les deux
# enfants, que le rejeu du placard retire chaque jour (`creneaux.yaml:routines`).
# Le gâteau de la fournée ou la compote viennent du dépôt (le congélateur),
# pas d'ici. Ni biscuits ni compotes du commerce.

recipe:
  id: gouter-des-enfants
  title: Goûter des enfants
  lang: fr
  yields:
    portions_eq: 1
  time_min_total: 5
  active_min: 5

  creneaux: [gouter]

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: routine
    origine: francais

  ingredients:
    - {id: yaourt-nature, name: yaourts nature, qty: 2, unit: pot}
    # LE FRUIT DE SAISON, PAS « UNE POMME » TOUTE L'ANNÉE. La pomme n'est plus au
    # fond d'avril à août (`fond.yaml`, saisons) : l'année simulée des cinq repas
    # comptait 110 goûters sans fruit, tous entre avril et août.
    - {id: pommes, name: pomme, qty: 1, unit: pièce, subs: [{id: poires, name: poire, ratio: 1.0}, {id: peches, name: pêche, ratio: 1.0}, {id: abricots, name: abricots, ratio: 2.0}]}
    # T197 — leur lait n'est pas suivi : le foyer le gère lui-même.

  steps:
    - id: servir
      action: "Couper le fruit en quartiers, sortir les yaourts et la part de la fournée"
      needs: []
      uses: [pommes, yaourt-nature]
      time_min: 5

  plan_b: []
