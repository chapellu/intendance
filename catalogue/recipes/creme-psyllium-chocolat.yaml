# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# TROIS MINUTES ET UN INGRÉDIENT IMPROBABLE : 10 g de psyllium blond (pesé au
# gramme près) mixé avec eau, crème de coco, cacao, agave, vanille et fleur
# de sel, gonflé au moins 10 min (au mieux 1 h), remixé et mis en pots au
# frais. Mêmes proportions pour d'autres versions dans l'article.

recipe:
  id: creme-psyllium-chocolat
  title: Crème dessert au chocolat sans cuisson, au psyllium
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Les sublimes crèmes dessert sans lait, sans oeufs, sans farine… et sans cuisson ! », blog Saines Gourmandises, 13 juin 2025"
    url: https://saines-gourmandises.fr/les-sublimes-cremes-dessert-sans-lait-sans-oeufs-sans-farine-et-sans-cuisson-avec-un-ingredient-improbable/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6
    pieces: 6
  lot_entier: true
  time_min_total: 70
  active_min: 6

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: eau, name: "eau", qty: 40, unit: cl}
    - {id: creme-coco, name: "crème de coco", qty: 20, unit: cl}
    - {id: psyllium, name: "psyllium blond", qty: 10, unit: g}
    - {id: cacao, name: "cacao amer bien parfumé", qty: 25, unit: g}
    - {id: sirop-agave, name: "sirop d'agave", qty: 10, unit: cl}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 1, unit: c. à c.}
    - {id: fleur-de-sel, name: "pincée de fleur de sel", qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: mixer
      action: "Mettre tous les ingrédients dans l'eau et mixer"
      needs: [blend-smooth]
      uses: [eau, creme-coco, psyllium, cacao, sirop-agave, extrait-vanille, fleur-de-sel]
      time_min: 3
      attente_min: 60
      attente_raison: "le psyllium gonfle 10 min au moins, 1 h au mieux"
      attente_souple: true
    - id: empoter
      action: "Mixer à nouveau, verser en pots et mettre au frais"
      needs: [blend-smooth]
      uses: []
      time_min: 3
      attente_min: 60
      attente_raison: "au frais avant de servir"
      attente_souple: true

  emits:
    - kind: reste-plat
      type: creme-psyllium-chocolat
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: false}

  plan_b: []
