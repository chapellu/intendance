# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# TROIS PANCAKES-SOUFFLÉS AU CACAO cuits à couvert dans une petite poêle de 18 cm :
# peu de farine, six œufs dont les blancs montés, crème, vinaigre de cidre ;
# imbibés d'un sirop rhum-café-amande amère et montés avec une chantilly de
# coco au café. Bien protéiné, à IG très bas.

recipe:
  id: gateau-italien-poele-choco-cafe
  title: Gâteau italien choco-vanille-café à la poêle
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Gâteau italien choco, vanille, café… à la poêle ! », blog Saines Gourmandises, 31 juillet 2025"
    url: https://saines-gourmandises.fr/gateau-italien-choco-vanille-cafe-a-la-poele/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 7          # « 6 à 8 parts »
  time_min_total: 35
  active_min: 30

  apports:
    proteine: oeuf
    feculent: aucun
    legumes: []
    profil: poele
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine semi-complète", qty: 35, unit: g}
    - {id: cacao, name: "cacao amer", qty: 10, unit: g}
    - {id: sucre-complet, name: "sucre de coco", qty: 30, unit: g}
    - {id: extrait-vanille, name: "vanille en poudre (tiers de c. à c.)", qty: 1, unit: pincée}
    - {id: creme, name: "crème au choix", qty: 40, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever (tiers de sachet)", qty: 0.33, unit: sachet}
    - {id: oeufs, name: "œufs", qty: 6, unit: pièce}
    - {id: vinaigre, name: "vinaigre de cidre ou jus de citron", qty: 1, unit: c. à c.}
    - {id: fleur-de-sel, name: "bonne pincée de fleur de sel", qty: 1, unit: bonne pincée, seasoning: true}
    - {id: beurre, name: "beurre pour la poêle", qty: 10, unit: g}
    - {id: rhum, name: "rhum", qty: 1, unit: c. à s.}
    - {id: eau, name: "eau", qty: 1, unit: c. à s.}
    - {id: sirop-agave, name: "sirop d'agave", qty: 1, unit: c. à s.}
    - {id: extrait-amande-amere, name: "arôme d'amande amère", qty: 1, unit: c. à c.}
    - {id: cafe, name: "expresso bien fort", qty: 4, unit: c. à s.}
    - {id: creme-coco, name: "crème de coco bien froide", qty: 20, unit: cl}
    - {id: sucre-vanille, name: "sucre vanillé", qty: 3, unit: sachet}

  steps:
    - id: pate
      action: "Mêler farine, cacao, sucre, sel, levure et vanille, y mélanger les jaunes, la crème et le vinaigre, puis incorporer les blancs en neige"
      needs: []
      uses: [farine-epeautre, cacao, sucre-complet, fleur-de-sel, poudre-a-lever, extrait-vanille, oeufs, creme, vinaigre]
      time_min: 10
    - id: cuire
      action: "Cuire un tiers de pâte dans une petite poêle beurrée, à couvert et à feu très doux, jusqu'à ce que le dessus soit mat ; retourner quelques secondes ; trois fois"
      needs: [pan-fry]
      charge_partielle: true
      uses: [beurre]
      time_min: 18
      attended: true
    - id: monter
      action: "Mêler rhum, eau, agave, arôme et 2 c. à s. de café ; monter la crème de coco avec le reste du café et le sucre vanillé ; empiler les pancakes imbibés et crémés"
      needs: []
      uses: [rhum, eau, sirop-agave, extrait-amande-amere, cafe, creme-coco, sucre-vanille]
      time_min: 10
      kid: {age_min_months: 36, task: "étaler la crème"}

  emits:
    - kind: reste-plat
      type: gateau-italien-poele-choco-cafe
      qty_band: 1-repas
      keeps: {frigo_days: 1, congelo: false}

  plan_b: []
