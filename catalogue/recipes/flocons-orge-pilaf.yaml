# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# 300 G DE FLOCONS D'ORGE revenus à sec dans l'huile d'olive puis cuits dans 70 cl
# d'eau ou mieux de bouillon jusqu'à absorption ; couverts hors du feu pour
# gonfler. Rebondis, non gluants. Parmesan au goût. Deux autres cuissons
# (créole, ou gonflés hors du feu) dans le même article.

recipe:
  id: flocons-orge-pilaf
  title: Flocons d'orge en garniture, cuisson pilaf
  role: accompagnement
  lang: fr
  source:
    author: Marie Chioca
    work: "« Les flocons d'orge en garniture ;) », blog Saines Gourmandises, 15 janvier 2026"
    url: https://saines-gourmandises.fr/les-flocons-dorge-en-garniture/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 15
  active_min: 8

  accepts:
    - type: bouillon-os-volaille
      qty: {amount: 70, unit: cl}
      required: false

  apports:
    proteine: aucune
    feculent: orge
    legumes: []
    profil: rapide
    origine: francais

  ingredients:
    - {id: flocons-orge, name: "flocons d'orge", qty: 300, unit: g}
    - {id: huile-olive, name: "huile d'olive", qty: 3, unit: c. à s.}
    - {id: eau, name: "eau ou bouillon de poule", qty: 70, unit: cl}
    - {id: sel, name: "sel (c. à c. très rase)", qty: 1, unit: c. à c., seasoning: true}
    - {id: parmesan, name: "parmesan râpé", qty: 30, unit: g, optional: true}

  steps:
    - id: revenir
      action: "Revenir les flocons secs quelques instants dans l'huile, saler, mouiller et laisser absorber à feu moyen en remuant"
      needs: [pan-fry]
      uses: [flocons-orge, huile-olive, sel, eau]
      time_min: 8
    - id: gonfler
      action: "Couvrir hors du feu quelques minutes et servir, au goût avec du parmesan"
      needs: []
      uses: [parmesan]
      time_min: 1
      attente_min: 5
      attente_raison: "les flocons gonflent à couvert"

  emits: []

  plan_b: []
