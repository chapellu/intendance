# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE GLACE SANS SORBETIÈRE : mousse de pêches, fromage blanc, jaunes et
# alcool de noyau, allégée de blancs en neige, marbrée de coulis de
# framboise, 6 h au congélateur. La collerette de papier est facultative.

recipe:
  id: souffles-glaces-peches-framboise
  title: Soufflés glacés aux pêches, spirale framboise
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Soufflés glacés aux pêches, spirale framboise », blog Saines Gourmandises, 18 juin 2011"
    url: https://saines-gourmandises.fr/souffles-glaces-aux-peches-spirale-framboise-glace-a-ig-bas/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « pour 6 personnes »
  time_min_total: 20
  active_min: 20

  apports:
    proteine: oeuf
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: peches, name: "pêches bien mûres épluchées", qty: 4, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave (4 + 3 c. à s.)", qty: 7, unit: c. à s.}
    - {id: fromage-blanc, name: "fromage blanc (ou 3 c. à s. de purée d'amande blanche)", qty: 6, unit: c. à s.}
    - {id: oeufs, name: "œufs", qty: 3, unit: pièce}
    - {id: extrait-amande-amere, name: "extrait d'amande amère (demi-c. à moka)", qty: 1, unit: pincée}
    - {id: eau-de-vie, name: "alcool de noyau (prune, cerise, amaretto…)", qty: 1, unit: c. à s.}
    - {id: framboises, name: "framboises fraîches", qty: 150, unit: g}

  steps:
    - id: mousse
      action: "Mixer pêches, 4 c. à s. d'agave, fromage blanc, jaunes, extrait d'amande et alcool en crème lisse, puis y incorporer les blancs en neige"
      needs: [blend-smooth]
      uses: [peches, fromage-blanc, oeufs, extrait-amande-amere, eau-de-vie]
      time_min: 10
    - id: coulis
      action: "Mixer les framboises avec 3 c. à s. d'agave"
      needs: [blend-small]
      uses: [framboises, sirop-agave]
      time_min: 3
    - id: monter
      action: "Verser en verrines en alternant coulis et mousse, finir par du coulis et tracer une spirale du manche d'une cuillère"
      needs: []
      uses: []
      time_min: 5
      kid: {age_min_months: 36, task: "tracer la spirale"}
    - id: congeler
      action: "Congeler au moins 6 h et servir aussitôt sorti"
      needs: [congeler]
      uses: []
      time_min: 1
      attente_min: 360
      attente_raison: "prise au congélateur"

  emits: []

  plan_b: []
