# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA CRÈME DE POTIRON GOURMANDE : sucs de lard fumé, oignon et ail, potiron
# mouillé au bouillon de pot-au-feu avec du concentré de tomate, mixée avec le
# beaufort, chantilly salée et lard croustillant par-dessus. Une entrée
# copieuse pour quatre.
#
# LE BOUILLON DE POT-AU-FEU EST UN RESTE du catalogue (300 ml) ; à défaut, de
# l'eau et un cube de bouillon.

recipe:
  id: creme-potiron-beaufort-lard
  title: Crème de potiron au beaufort et lard fumé
  role: entree
  lang: fr
  source:
    author: Marie Chioca
    work: "« Potimarrons, courges, potirons, citrouilles and Co… rétrospective d'idées recettes », blog Saines Gourmandises, 17 septembre 2026"
    url: https://saines-gourmandises.fr/potimarrons-courges-potirons-citrouilles-and-co-retrospective-didees-recettes-geniaaaaales/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 45        # 15 min de préparation + 30 min de cuisson
  active_min: 25

  accepts:
    - type: bouillon-pot-au-feu
      qty: {amount: 300, unit: ml}
      required: false

  sans_reste:
    temps_min: 0
    ingredients:
      - {id: bouillon-legumes, name: "à défaut de bouillon de pot-au-feu, un cube dans 30 cl d'eau", qty: 1, unit: pièce}

  apports:
    proteine: fromage
    feculent: aucun
    legumes: [cucurbitacee, allium]
    profil: soupe
    origine: francais

  ingredients:
    - {id: bouillon-pot-au-feu, name: bouillon de pot-au-feu, qty: 300, unit: ml, from_accepts: true}
    - {id: potimarron, name: "potimarron ou butternut (1,2 kg)", qty: 1, unit: pièce}
    - {id: oignon, name: gros oignon, qty: 1, unit: pièce}
    - {id: ail, name: ail, qty: 3, unit: gousse}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: concentre-tomate, name: concentré de tomate, qty: 30, unit: g}
    - {id: beaufort, name: beaufort, qty: 80, unit: g}
    - {id: lardons, name: tranches fines de poitrine fumée, qty: 7, unit: tranche}
    - {id: creme, name: crème fleurette, qty: 20, unit: cl}
    - {id: persil, name: persil frais, qty: 4, unit: brin}
    - {id: muscade, name: muscade, qty: 1, unit: pincée, seasoning: true}
    - {id: piment-espelette, name: grosse pincée de piment d'Espelette, qty: 1, unit: pincée, seasoning: true}
    - {id: paprika, name: paprika fumé pour saupoudrer, qty: 1, unit: pincée, seasoning: true}
    - {id: sel, name: sel (c. à c. rase + pour la chantilly), qty: 1.5, unit: c. à c., seasoning: true}
    - {id: poivre, name: poivre du moulin, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: lard
      action: "Dorer le lard à sec au fond d'une cocotte, le réserver et garder les sucs ; ajouter l'huile"
      needs: [simmer-large]
      uses: [lardons, huile-olive]
      time_min: 5
      attended: true
    - id: oignon
      action: "Y dorer l'oignon en fines tranches avec les gousses d'ail entières"
      needs: [simmer-large]
      uses: [oignon, ail]
      time_min: 6
      attended: true
    - id: mijoter
      action: "Ajouter le potiron en gros cubes, le bouillon, le concentré, le sel, le piment et la muscade ; mijoter 20 min à couvert"
      needs: [simmer-large]
      uses: [potimarron, bouillon-pot-au-feu, concentre-tomate, sel, piment-espelette, muscade]
      time_min: 20
      attended: false
    - id: chantilly
      action: "Monter la crème en chantilly avec une grosse pincée de sel"
      needs: []
      uses: [creme]
      time_min: 5
      parallel_with: mijoter
    - id: mixer
      action: "Hors du feu, ajouter le beaufort et mixer très finement ; rectifier sel et poivre"
      needs: [blend-smooth]
      uses: [beaufort, poivre]
      time_min: 4
    - id: servir
      action: "Recroustiller le lard à la poêle sèche ; servir en bols avec persil haché, une rosace de chantilly, le lard et un soupçon de paprika"
      needs: [pan-fry]
      uses: [persil, paprika]
      time_min: 5

  emits: []

  plan_b:
    - drop: chantilly
      saves_min: 5
      effect: "sans le chapeau de crème, plus sage"
