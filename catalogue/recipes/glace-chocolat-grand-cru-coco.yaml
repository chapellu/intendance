# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# SANS SORBETIÈRE : chantilly de coco incorporée d'une sauce de cacao, agave,
# vanille et fleur de sel et de copeaux de chocolat 70 % râpés à l'économe ;
# 4 h au congélateur. La préférée de la plus jeune de la maison.

recipe:
  id: glace-chocolat-grand-cru-coco
  title: Glace chocolat « grand cru 70 % » à la chantilly de coco
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« 3 glaces végétales délicieusement chocolat (et sans sorbetière) », blog Saines Gourmandises, 26 août 2015"
    url: https://saines-gourmandises.fr/pour-fondre-de-bonheur/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « pour 4 à 6 personnes »
  time_min_total: 10
  active_min: 10

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: creme-coco, name: "crème de coco bien froide", qty: 40, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 10, unit: cl}
    - {id: cacao, name: "cacao en poudre", qty: 50, unit: g}
    - {id: extrait-vanille, name: "extrait de vanille", qty: 1, unit: c. à s.}
    - {id: lait-soja-vanille, name: "lait soja-vanille", qty: 2, unit: c. à s.}
    - {id: fleur-de-sel, name: "pincée de fleur de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: chocolat-noir, name: "bon chocolat noir 70 %", qty: 45, unit: g}

  steps:
    - id: chantilly
      action: "Monter la crème de coco en chantilly ; mêler à part cacao, vanille, soja, sel et agave en sauce un peu liquide, et râper le chocolat"
      needs: []
      uses: [creme-coco, cacao, extrait-vanille, lait-soja-vanille, fleur-de-sel, sirop-agave, chocolat-noir]
      time_min: 8
      kid: {age_min_months: 48, task: "râper le chocolat à l'économe"}
    - id: congeler
      action: "Incorporer la sauce et les copeaux en soulevant, verser dans une boîte et congeler"
      needs: [congeler]
      uses: []
      time_min: 3
      attente_min: 240
      attente_raison: "environ 4 h au congélateur"

  emits: []

  plan_b: []
