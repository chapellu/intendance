# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE PÊCHE MELBA SANS SIROP : demi-pêches avec la peau, creusées de framboises et
# d'une demi-cuillerée de miel, cuites 15 min à la vapeur face bombée en
# bas ; chantilly de coco glacée au miel, amandes effilées toastées. Il reste
# de la chantilly : 24 h au frais en boîte.

recipe:
  id: peches-vapeur-miel-framboise
  title: Pêches vapeur au miel et à la framboise, chantilly coco
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« 4 recettes minceur durable », blog Saines Gourmandises, 8 juin 2015"
    url: https://saines-gourmandises.fr/des-pancakes-des-polpettes-une-peche-melba-et-un-fondant-au-chocolat/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 2          # « pour 2 personnes »
  time_min_total: 30
  active_min: 15

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: mijote
    origine: francais

  ingredients:
    - {id: peches, name: "pêches mûres", qty: 2, unit: pièce}
    - {id: framboises, name: "framboises fraîches", qty: 125, unit: g}
    - {id: miel-acacia, name: "miel liquide d'acacia", qty: 4, unit: c. à c.}
    - {id: amandes-effilees, name: "amandes effilées", qty: 20, unit: g}
    - {id: creme-coco, name: "crème fluide de coco", qty: 20, unit: cl}

  steps:
    - id: glacer
      action: "Mettre la crème de coco, le bol et le fouet au congélateur ; chauffer l'eau sous le panier vapeur"
      needs: [steam]
      uses: [creme-coco]
      time_min: 4
    - id: garnir
      action: "Ouvrir et dénoyauter les pêches, remplir le creux de framboises et d'une demi-cuillerée de miel"
      needs: []
      uses: [peches, framboises]
      time_min: 5
      kid: {age_min_months: 30, task: "remplir les pêches de framboises"}
    - id: cuire
      action: "Cuire les oreillons 15 min à la vapeur, face bombée en bas, puis tiédir"
      needs: [steam]
      uses: []
      time_min: 15
      attended: false
    - id: finir
      action: "Toaster les amandes à sec ; monter la crème glacée en chantilly avec 2 c. à c. de miel ; servir les pêches nappées et parsemées"
      needs: [pan-fry]
      uses: [amandes-effilees, miel-acacia]
      time_min: 8

  emits: []

  plan_b: []
