# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.
# Encodée le 2026-11-18 sur photo de la page (T189).
#
# LA VERSION CHAUDE DES TARTINES DE LA PAGE D'AVANT, ET UN SAUVETAGE : le pain
# un peu rassis retrouve au four du moelleux et du croustillant. Le livre la
# marque « avec des restes ». Le modèle n'a pas d'émetteur de pain rassis —
# le pain du foyer ne sort d'aucune recette — donc pas d'`accepts` : le dire
# serait inventer une arête qu'aucun plat ne nourrit.
#
# VARIANTE NON ENCODÉE COMME RECETTE : au thon. Remplacer les champignons par
# 200 g de thon au naturel bien égoutté, avec une persillade et quelques
# câpres. Elle est portée par `subs` sur la ligne des champignons, en note.
#
# LES HERBES : origan, sarriette ou marjolaine, frais ou en poudre (1 c. à c.).
# L'origan sec est au placard ; la sarriette fraîche en est le remplaçant.

recipe:
  id: bruschettas-champignons
  title: Bruschettas « express » aux champignons
  format: tartine
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 49"
    source_id: chioca-cuisine-bio-quotidien
    page: 49
    saison: printemps
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « 4 larges bruschettas, ou 8 moyennes, selon la forme du pain »
    pieces: 4
  time_min_total: 25        # en-tête : 10 + 10 min ; on ajoute le préchauffage
  active_min: 10

  apports:
    proteine: fromage
    feculent: pain
    legumes: [champignon, solanacee]
    profil: four
    origine: italien

  ingredients:
    - {id: pain-levain, name: "bon pain au levain, en larges tranches (600 à 800 g)", qty: 700, unit: g}
    - {id: sauce-tomate, name: "sauce tomate (napolitaine ou provençale)", qty: 300, unit: g}
    - {id: mozzarella, name: "mozzarella (2 boules)", qty: 250, unit: g}
    - id: champignons-paris
      name: champignons très frais, lavés et coupés en tranches
      qty: 6
      unit: pièce
      subs:
        - {name: "thon au naturel bien égoutté (200 g), avec une persillade et quelques câpres", note: "la variante au thon de l'autrice"}
    - {id: origan, name: "origan, sarriette ou marjolaine (quelques brins, ou 1 c. à c. séchée)", qty: 1, unit: c. à c., subs: [{id: sarriette, name: "sarriette fraîche", ratio: 1.0}]}
    - {id: huile-olive, name: huile d'olive, qty: 3, unit: c. à s.}
    - {id: olives-noires, name: quelques olives noires, qty: 12, unit: pièce, optional: true}
    - {id: sel, name: sel, qty: 1, unit: pincée, seasoning: true}

  # « Savourer aussitôt avec une salade. »
  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: prechauffer
      action: "Préchauffer le four à 220 °C"
      needs: [bake]
      uses: []
      time_min: 1
      attended: false
    - id: griller
      action: "Griller les tranches de pain au grille-pain et les poser sur une plaque huilée"
      needs: []
      uses: [pain-levain]
      time_min: 4
    - id: garnir
      action: "Tartiner de sauce tomate, puis répartir dans l'ordre la mozzarella en tranches, les herbes, les champignons et les olives"
      needs: []
      uses: [sauce-tomate, mozzarella, origan, champignons-paris, olives-noires, sel]
      time_min: 5
      kid: {age_min_months: 30, task: "poser les champignons et les olives sur les tartines"}
    - id: cuire
      action: "Arroser chaque tartine d'un mince filet d'huile d'olive et enfourner 10 à 12 min, jusqu'à ce que le fromage coule et dore"
      needs: [bake]
      uses: [huile-olive]
      time_min: 12
      attended: false
    - id: servir
      action: "Servir aussitôt"
      needs: []
      uses: []
      time_min: 1
  # PAS DE PRÉLÈVEMENT BÉBÉ : sauce tomate du commerce et mozzarella sont salées
  # avant d'entrer dans la recette.

  plan_b: []                # vingt minutes, dont douze de four : rien à comprimer
