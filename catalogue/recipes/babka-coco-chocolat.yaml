# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA BABKA EN ESCARGOTS : même brioche à la crème de coco, une nuit au frais ;
# tartinade de crème de coco, chocolat 70 %, agave et huile de coco épaissie au
# congélateur, étalée sur 30 × 45 cm, raffermie 30 min, roulée, tranchée en
# escargots dans un moule à kouglof, levée 1 h au bain-marie, 10 min à
# 220 °C puis 35 min à 150 °C.

recipe:
  id: babka-coco-chocolat
  title: Babka coco-chocolat
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Babka Coco-Chocolat », blog Saines Gourmandises, 24 novembre 2015"
    url: https://saines-gourmandises.fr/vous-aimez-les-escargots-non-ouf-ca-tombe-bien-ceux-ci-sont-juste-en-pate-a-brioche-et-en-chocolat/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « une babka d'environ 8 parts »
  lot_entier: true
  time_min_total: 200       # 30 min + 30 min + 1 h + 45 min (nuit au frais)
  active_min: 35

  apports:
    proteine: aucune
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: farine de grand épeautre T110, qty: 500, unit: g}
    - {id: creme-coco, name: "crème de coco liquide (40 cl pâte + 20 cl tartinade)", qty: 60, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave (5 cl + 4 c. à s.)", qty: 11, unit: cl}
    - {id: sel, name: sel fin, qty: 5, unit: g, seasoning: true}
    - {id: extrait-vanille, name: extrait de vanille liquide, qty: 1, unit: c. à s.}
    - {id: rhum, name: rhum ambré, qty: 1, unit: c. à s.}
    - {id: levure-boulangere, name: levure de boulanger déshydratée, qty: 1, unit: sachet}
    - {id: chocolat-noir, name: chocolat noir 70 %, qty: 120, unit: g}
    - {id: huile-coco, name: huile de coco vierge, qty: 45, unit: g}
    - {id: sucre-glace, name: un peu de sucre glace, qty: 1, unit: c. à s., optional: true}

  steps:
    - id: petrir
      action: "Tiédir 40 cl de crème de coco avec 5 cl d'agave et la vanille, y fouetter la levure, pétrir 10 min avec la farine salée et le rhum, et mettre au frais"
      needs: [simmer]
      charge_partielle: true   # le récipient ne tient que cette part du plat
      uses: [farine-epeautre, sel, extrait-vanille, rhum, levure-boulangere, creme-coco]
      time_min: 14
      attente_min: 600
      attente_raison: "une nuit au frais"
    - id: tartinade
      action: "Fondre à feu très doux en remuant le reste de crème de coco, le chocolat, 4 c. à s. d'agave et l'huile de coco"
      astuce: "Quelques minutes au congélateur dans un plat large l'épaississent ; elle doit rester tartinable."
      needs: [simmer]
      charge_partielle: true   # le récipient ne tient que cette part du plat
      uses: [creme-coco, chocolat-noir, sirop-agave, huile-coco]
      time_min: 15
    - id: tartiner
      action: "Étaler la pâte en 30 × 45 cm sur un papier fariné, la tartiner et la mettre au frais 30 min"
      needs: []
      uses: []
      time_min: 8
      attente_min: 30
      attente_raison: "la tartinade prend au frais avant d'être roulée"
    - id: escargots
      action: "Rouler dans la longueur, trancher tous les 2 cm et ranger les escargots dans un moule à kouglof graissé"
      needs: []
      uses: []
      time_min: 8
      attente_min: 60
      attente_raison: "pousse au bain-marie tiède jusqu'à affleurer le moule"
      kid: {age_min_months: 36, task: "ranger les escargots dans le moule"}
    - id: cuire
      action: "Enfourner doucement à 220 °C pour 10 min, puis 35 min à 150 °C sans ouvrir ; laisser refroidir avant de démouler"
      needs: [bake]
      uses: [sucre-glace]
      time_min: 45
      attended: false

  emits:
    - kind: reste-plat
      type: babka-coco-chocolat
      qty_band: 2-repas
      keeps: {frigo_days: 2, congelo: true}
      note: "jamais au frais : l'huile de coco durcit la mie"

  plan_b: []
