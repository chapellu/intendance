# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LE CÉLERI QU'ON LAISSE DANS LA MARMITE DU POT-AU-FEU, rattrapé à la façon
# des pommes de terre tapées : céleri et pommes de terre cuits, écrasés à la
# paume, nappés de beurre fondu à l'huile et à la muscade, grillés 30 min.
#
# LES LÉGUMES DU POT-AU-FEU SONT UN RESTE du catalogue ; sans eux, cuire
# 400 g de céleri et 400 g de pommes de terre à l'eau (25 min de plus).

recipe:
  id: celeri-pommes-tapees
  title: Céleri-rave façon « pommes tapées »
  role: accompagnement
  lang: fr
  source:
    author: Marie Chioca
    work: "« Vous faire raffoler du céleri rave ?… chiche ! », blog Saines Gourmandises, 6 mars 2026"
    url: https://saines-gourmandises.fr/vous-faire-raffoler-du-celeri-rave-chiche/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « pour 4 à 6 personnes »
  time_min_total: 35        # 5 min de préparation + 30 min
  active_min: 6

  accepts:
    - type: legumes-pot-au-feu
      qty: {amount: 800, unit: g}
      required: true
      fallback_recipe: pot-au-feu-traditionnel

  sans_reste:
    temps_min: 25
    ingredients:
      - {id: celeri-rave, name: céleri-rave à cuire, qty: 400, unit: g}
      - {id: pomme-de-terre, name: pommes de terre à cuire, qty: 400, unit: g}

  apports:
    proteine: aucune
    feculent: pommes-de-terre
    legumes: [racine]
    profil: four
    origine: francais

  ingredients:
    - {id: legumes-cuits, name: "céleri-rave et pommes de terre cuits (400 g de chaque)", qty: 800, unit: g, from_accepts: true}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: beurre, name: beurre, qty: 80, unit: g}
    - {id: muscade, name: muscade, qty: 1, unit: pincée, seasoning: true}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}
    - {id: persil, name: un peu de persil, qty: 3, unit: brin, optional: true}

  steps:
    - id: taper
      action: "Allumer le gril à 220 °C ; écraser les morceaux de légumes cuits à la paume ou au fond d'un verre, sans en faire une purée"
      needs: []
      uses: [legumes-cuits]
      time_min: 3
      kid: {age_min_months: 24, task: "taper les légumes avec un verre"}
    - id: napper
      action: "Fondre le beurre avec l'huile, le poivre et la muscade, le verser sur les légumes, mélanger délicatement et étaler en couche fine dans un plat ; saler"
      needs: [simmer]
      uses: [beurre, huile-olive, poivre, muscade, sel]
      time_min: 3
    - id: griller
      action: "Griller environ 30 min en haut du four, jusqu'à un dessus très doré ; parsemer de persil"
      needs: [gratin]
      uses: [persil]
      time_min: 30
      attended: false

  emits: []

  plan_b: []
