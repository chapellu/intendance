# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN ACCOMPAGNEMENT : tranches de potimarron avec la peau, brassées dans
# l'huile, l'origan, le piment d'Espelette et la fleur de sel, rôties debout
# 20 min. À la poêle, plus vite, en plusieurs tournées.

recipe:
  id: croissants-potimarron-rotis
  title: « Croissants » de potimarron rôtis à l'origan et au piment d'Espelette
  role: accompagnement
  lang: fr
  source:
    author: Marie Chioca
    work: "« Potimarrons, courges, potirons, citrouilles and Co… rétrospective d'idées recettes », blog Saines Gourmandises, 17 septembre 2026"
    url: https://saines-gourmandises.fr/potimarrons-courges-potirons-citrouilles-and-co-retrospective-didees-recettes-geniaaaaales/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « pour 6 personnes »
  time_min_total: 35        # 15 min de préparation + 20 min de cuisson
  active_min: 15

  apports:
    proteine: aucune
    feculent: aucun
    legumes: [cucurbitacee]
    profil: four
    origine: francais

  ingredients:
    - {id: potimarron, name: potimarron moyen, qty: 1, unit: pièce}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: origan, name: origan séché, qty: 2, unit: c. à c., seasoning: true}
    - {id: piment-espelette, name: piment d'Espelette (c. à c. rase), qty: 1, unit: c. à c., seasoning: true}
    - {id: fleur-de-sel, name: fleur de sel (c. à c. bombée), qty: 1, unit: c. à c., seasoning: true}

  steps:
    - id: tailler
      action: "Préchauffer le four à 200 °C ; ôter les trognons, ouvrir le potimarron en long, l'épépiner et le couper en tranches régulières"
      needs: [chop-coarse]
      uses: [potimarron]
      time_min: 8
    - id: brasser
      action: "Brasser les tranches dans un saladier avec l'huile, l'origan, le piment et la fleur de sel"
      needs: []
      uses: [huile-olive, origan, piment-espelette, fleur-de-sel]
      time_min: 3
      kid: {age_min_months: 24, task: "brasser les tranches avec les mains"}
    - id: rotir
      action: "Ranger les tranches debout dans un plat et rôtir 20 min"
      needs: [gratin-vessel, bake]
      uses: []
      time_min: 20
      attended: false

  emits: []

  plan_b: []
