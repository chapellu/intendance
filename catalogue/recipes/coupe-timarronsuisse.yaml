# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN TIRAMISU AU MARRON EN CINQ MINUTES : biscuits à la cuillère à peine imbibés
# d'espresso à l'agave, petits-suisses mêlés de crème de marron, 8 h au frais
# filmé, cacao. La crème de marron est celle de la même page (un reste du
# catalogue) ; à défaut, une crème de marron du commerce.

recipe:
  id: coupe-timarronsuisse
  title: La coupe « timarronsuisse »
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« La crème de marron de mes rêves (et la coupe timarronsuisse) », blog Saines Gourmandises, 20 novembre 2014"
    url: https://saines-gourmandises.fr/la-creme-de-marron-de-mes-reves/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 5
  active_min: 5

  accepts:
    - type: creme-marron-maison
      qty: {amount: 150, unit: g}
      required: true
      fallback_recipe: creme-marron-vanille-maison

  sans_reste:
    temps_min: 0
    ingredients:
      - {id: creme-marron, name: "à défaut, crème de marron du commerce", qty: 150, unit: g}

  apports:
    proteine: fromage
    feculent: biscuit
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: creme-marron-maison, name: "crème de marron maison", qty: 150, unit: g, from_accepts: true}
    - {id: biscuits-cuillere, name: "biscuits à la cuillère", qty: 4, unit: pièce}
    - {id: cafe, name: "espresso très serré", qty: 3, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 2, unit: c. à s.}
    - {id: petits-suisses, name: "petits-suisses", qty: 3, unit: pièce}
    - {id: cacao, name: "un peu de cacao", qty: 1, unit: c. à c.}

  steps:
    - id: biscuits
      action: "Poser un biscuit coupé en deux au fond de 4 coupes et l'imbiber à peine du café mêlé à l'agave"
      needs: []
      uses: [biscuits-cuillere, cafe, sirop-agave]
      time_min: 2
      kid: {age_min_months: 30, task: "poser les biscuits"}
    - id: creme
      action: "Mêler les petits-suisses à la crème de marron, en napper les biscuits et filmer"
      needs: []
      uses: [petits-suisses, creme-marron-maison]
      time_min: 3
      attente_min: 480
      attente_raison: "au moins 8 h au frais"
    - id: servir
      action: "Poudrer de cacao"
      needs: []
      uses: [cacao]
      time_min: 1

  emits: []

  plan_b: []
