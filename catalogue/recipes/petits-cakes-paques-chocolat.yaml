# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DOUZE MUFFINS AU CHOCOLAT EN 10 MINUTES : chocolat fondu et pépites de chocolat
# aux éclats de fève, farine, levure, agave, jus de pomme, huile, œufs, sucre
# vanillé, rhum ; 12 min. Coiffés de chantilly de coco au sucre de bouleau
# teintée (cacao, colorants naturels) et de petits animaux en pâte d'amande :
# le décor est un jeu, il n'est pas encodé en détail.

recipe:
  id: petits-cakes-paques-chocolat
  title: Petits cakes de Pâques au chocolat
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Petits cakes de Pâques trop mignons », blog Saines Gourmandises, 7 avril 2023"
    url: https://saines-gourmandises.fr/petits-cakes-de-paques-trop-mignons/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « pour 12 muffins »
    pieces: 12
  time_min_total: 40
  active_min: 30

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: chocolat-noir, name: "chocolat noir pâtissier 70 % (+ 100 g aux éclats de fèves)", qty: 200, unit: g}
    - {id: farine-epeautre, name: "farine semi-complète", qty: 125, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: fleur-de-sel, name: "pincée de fleur de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: sirop-agave, name: "sirop d'agave (85 g + 2 c. à s.)", qty: 115, unit: g}
    - {id: jus-pomme, name: "jus de pomme", qty: 50, unit: g}
    - {id: huile-tournesol, name: "huile neutre", qty: 90, unit: g}
    - {id: oeufs, name: "œufs", qty: 3, unit: pièce}
    - {id: sucre-vanille, name: "sucre vanillé", qty: 1, unit: sachet}
    - {id: rhum, name: "rhum", qty: 1, unit: c. à s.}
    - {id: creme-coco, name: "crème de coco bien froide", qty: 40, unit: cl}
    - {id: sucre-bouleau, name: "sucre de bouleau", qty: 50, unit: g}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 1, unit: c. à s.}
    - {id: cacao, name: "cacao", qty: 1, unit: c. à s.}
    - {id: pate-amande, name: "pâte d'amande pour le décor", qty: 100, unit: g, optional: true}

  steps:
    - id: pate
      action: "Préchauffer à 180 °C ; fondre 100 g de chocolat, couper le reste en pépites, mêler farine, levure, pépites et sel, puis tout le reste juste assez"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, farine-epeautre, poudre-a-lever, fleur-de-sel, jus-pomme, huile-tournesol, oeufs, sucre-vanille, rhum]
      time_min: 10
    - id: cuire
      action: "Répartir en moules à muffins et cuire 12 min ; laisser refroidir"
      needs: [bake]
      uses: []
      time_min: 12
      attended: false
    - id: decor
      action: "Monter la crème de coco avec le sucre de bouleau et la vanille, en teinter une part de cacao et d'agave, coiffer les cakes et décorer de pâte d'amande"
      needs: []
      uses: [creme-coco, sucre-bouleau, extrait-vanille, cacao, sirop-agave, pate-amande]
      time_min: 20
      kid: {age_min_months: 36, task: "modeler les animaux en pâte d'amande"}

  emits:
    - kind: reste-plat
      type: petits-cakes-paques-chocolat
      qty_band: lunchbox
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
