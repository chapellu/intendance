# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN SOUFFLÉ CUIT À LA VAPEUR : crème de céleri bouilli mixé à la tomme de
# brebis et à la crème, jaunes, farine et levure, blancs en neige ; moule rond
# haut de 18 cm, 45 min au cuit-vapeur. Ici la cocotte et un panier vapeur.
# Les deux petits gâteaux vapeur au gouda de la même page en sont une version
# en ramequins.

recipe:
  id: souffle-vapeur-celeri-brebis
  title: Soufflé vapeur au céleri-rave, tomme de brebis et muscade
  format: gratin
  lang: fr
  source:
    author: Marie Chioca
    work: "« Vous faire raffoler du céleri rave ?… chiche ! », blog Saines Gourmandises, 6 mars 2026"
    url: https://saines-gourmandises.fr/vous-faire-raffoler-du-celeri-rave-chiche/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « pour 4 à 6 personnes »
  lot_entier: true
  time_min_total: 75        # 10 min + 15 min de céleri + 45 min de vapeur
  active_min: 20

  apports:
    proteine: oeuf
    feculent: farine
    legumes: [racine]
    profil: mijote
    origine: francais

  ingredients:
    - {id: celeri-rave, name: céleri-rave, qty: 700, unit: g}
    - {id: farine-epeautre, name: farine semi-complète de grand épeautre, qty: 125, unit: g}
    - {id: oeufs, name: œufs, qty: 6, unit: pièce}
    - {id: poudre-a-lever, name: poudre à lever, qty: 1, unit: sachet}
    - {id: creme, name: "crème de vache, de soja ou de coco", qty: 25, unit: cl}
    - {id: etorki, name: tomme de brebis râpée, qty: 100, unit: g}
    - {id: sel, name: sel, qty: 3, unit: pincée, seasoning: true}
    - {id: poivre-5-baies, name: poivre 5 baies, qty: 1, unit: pincée, seasoning: true}
    - {id: muscade, name: muscade, qty: 1, unit: pincée, seasoning: true}

  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: celeri
      action: "Bouillir le céleri en gros cubes 15 min à l'eau salée, égoutter et mixer avec le fromage, la crème, le poivre et la muscade"
      needs: [simmer]
      uses: [celeri-rave, sel, etorki, creme, poivre-5-baies, muscade]
      time_min: 20
    - id: blancs
      action: "Porter 2 l d'eau à ébullition sous un panier vapeur ; séparer les œufs, monter les blancs en neige, incorporer les jaunes à la crème de céleri"
      needs: [steam]
      uses: [oeufs]
      time_min: 8
    - id: melanger
      action: "Mêler à la maryse la crème, la farine mélangée à la levure et les blancs, en soulevant ; rectifier le sel et verser dans un moule rond haut"
      needs: []
      uses: [farine-epeautre, poudre-a-lever]
      time_min: 4
      kid: {age_min_months: 36, task: "verser la farine pendant qu'on mélange"}
    - id: cuire
      action: "Cuire environ 45 min à la vapeur, à couvert"
      needs: [steam]
      uses: []
      time_min: 45
      attended: false

  emits: []

  plan_b: []
