# LA MESURE AU POT DE YAOURT (de soja) : farine T110 (dont un pot de son d'avoine
# au choix), huile d'olive, agave, levure, trois œufs, 150 g de mûres sauvages
# et des amandes ; 25 min à 180 °C. Six à huit muffins.

recipe:
  id: muffins-mures-sauvages
  title: Muffins aux mûres sauvages, façon gâteau au yaourt
  creneaux: [gouter, petit-dejeuner]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Muffins bio aux mûres sauvages, façon gâteau au yaourt », blog Saines Gourmandises, 11 septembre 2013"
    url: https://saines-gourmandises.fr/muffins-monday-38-et-une-promenade-poetique-en-images/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 7          # « 6 à 8 muffins »
    pieces: 7
  lot_entier: true
  time_min_total: 35
  active_min: 10

  apports:
    proteine: aucune
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine T110 (4 pots, ou 3 + 1 de son d'avoine)", qty: 280, unit: g}
    - {id: yaourt-soja, name: "yaourt de soja", qty: 1, unit: pièce}
    - {id: huile-olive, name: "huile d'olive (1 pot)", qty: 10, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave (1 pot)", qty: 12, unit: cl}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: oeufs, name: "œufs", qty: 3, unit: pièce}
    - {id: sel, name: "pincée de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: mures, name: "mûres sauvages bien mûres", qty: 150, unit: g}
    - {id: amandes-effilees, name: "poignée d'amandes effilées", qty: 30, unit: g}

  steps:
    - id: pate
      action: "Préchauffer à 180 °C ; mêler farine et levure, y fouetter tous les autres ingrédients, mûres et amandes comprises"
      needs: []
      uses: [farine-epeautre, poudre-a-lever, yaourt-soja, huile-olive, sirop-agave, oeufs, sel, mures, amandes-effilees]
      time_min: 8
      kid: {age_min_months: 24, task: "verser les mûres"}
    - id: cuire
      action: "Répartir dans les moules et cuire 25 min, jusqu'à ce qu'une pique ressorte sèche"
      needs: [bake]
      uses: []
      time_min: 25
      attended: false

  emits:
    - kind: base
      type: muffins-mures-sauvages
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
