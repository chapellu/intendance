# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE FONDUE de poireaux et d'oignon au wok, poivre cinq baies ; le seitan doré
# à part dans une petite poêle puis coupé en morceaux et mêlé, avec le riz
# basmati complet cuit al dente.

recipe:
  id: wok-seitan-poireaux-basmati
  title: Wok de seitan au basmati complet et fondue de poireaux
  format: poelee
  lang: fr
  source:
    author: Marie Chioca
    work: "« Connaissez-vous le seitan ? », blog Saines Gourmandises, 10 mars 2014"
    url: https://saines-gourmandises.fr/seitan-forgeant-quon-devient-forgeron/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 30
  active_min: 15

  apports:
    proteine: tofu-soja
    feculent: riz
    legumes: [allium]
    profil: poele
    origine: japonais

  ingredients:
    - {id: riz, name: "riz basmati complet", qty: 300, unit: g}
    - {id: oignon, name: "oignon", qty: 1, unit: pièce}
    - {id: poireau, name: "poireau", qty: 2, unit: pièce}
    - {id: huile-olive, name: "huile d'olive", qty: 4, unit: c. à s.}
    - {id: sel, name: "sel", qty: 1, unit: pincée, seasoning: true}
    - {id: poivre-5-baies, name: "poivre cinq baies", qty: 1, unit: pincée, seasoning: true}
    - {id: seitan, name: "seitan", qty: 250, unit: g}

  steps:
    - id: riz
      action: "Cuire le riz al dente à l'eau salée"
      needs: [boil]
      uses: [riz]
      time_min: 25
      attended: false
    - id: fondue
      action: "Émincer oignon et poireaux et les fondre au wok dans l'huile, salés et poivrés, en remuant souvent"
      needs: [pan-fry]
      uses: [oignon, poireau, huile-olive, sel, poivre-5-baies]
      time_min: 18
      parallel_with: riz
    - id: seitan
      action: "Dorer le seitan des deux côtés dans une petite poêle, le couper en morceaux et le mêler aux poireaux et au riz"
      needs: [pan-fry]
      uses: [seitan]
      time_min: 8

  emits:
    - kind: reste-plat
      type: wok-seitan-poireaux-basmati
      qty_band: 1-repas
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
