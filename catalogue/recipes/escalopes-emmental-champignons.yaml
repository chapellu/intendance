# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.

recipe:
  id: escalopes-emmental-champignons
  title: Escalopes végétariennes emmental-champignons
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 39"
    source_id: chioca-cuisine-bio-quotidien
    page: 39
    saison: printemps
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6
    pieces: 6
  time_min_total: 40
  active_min: 30

  apports:
    proteine: oeuf
    feculent: avoine
    legumes: [champignon, allium]
    profil: four
    origine: francais

  ingredients:
    - {id: champignons-paris, name: champignons de Paris, qty: 500, unit: g}
    - {id: oignon, name: oignon, qty: 1, unit: pièce}
    - {id: fromage-rape, name: emmental, qty: 180, unit: g}
    - {id: flocons-avoine, name: flocons d'avoine, qty: 120, unit: g}
    - {id: oeufs, name: œufs, qty: 4, unit: pièce}
    - {id: huile-olive, name: huile d'olive, qty: 6, unit: c. à s.}
    - {id: ail, name: ail, qty: 1, unit: gousse}
    - {id: persil, name: persil frais, qty: 0.5, unit: bouquet}
    - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: bonne pincée, seasoning: true}

  steps:
    - id: revenir-oignon
      action: "Émincer l'oignon et le faire revenir à l'huile d'olive dans une grande poêle ou un wok"
      needs: [pan-fry]
      time_min: 5
      attended: true
    - id: cuire-champignons
      action: "Émincer les champignons, les ajouter avec l'ail émincé et les cuire à feu vif jusqu'à ce qu'ils aient rendu toute leur eau et soient bien dorés"
      needs: [pan-fry]
      time_min: 10
      attended: true
      # C'est l'étape qui décide de tout : des champignons encore humides
      # donnent une pâte qui ne tient pas à la cuisson.
    - id: prechauffer
      action: "Préchauffer le four à 220 °C"
      needs: [bake]
      time_min: 1
      parallel_with: cuire-champignons
    - id: mixer
      action: "Réunir la poêlée, les œufs, le persil, les flocons et l'emmental râpé, et mixer par impulsions courtes : une pâte homogène qui garde des morceaux, surtout pas une bouillie"
      needs: [chop-coarse]
      time_min: 5
      # Le livre dit « le bol d'un robot ». Le foyer n'en a pas : la chaîne de
      # `chop-coarse` bascule sur le petit blender, en 2–3 fois. Pour 500 g de
      # champignons plus le reste, c'est la friction réelle de cette recette.
    - id: assaisonner-pate
      action: "Saler et poivrer la pâte, puis mélanger"
      needs: []
      time_min: 1
      seasoning_gate: true
    - id: former
      action: "Déposer 6 flaques de pâte épaisses à la louche sur une lèchefrite chemisée de papier huilé, et les étaler légèrement"
      needs: []
      time_min: 4
      kid: {age_min_months: 30, task: "aplatir les tas de pâte avec le dos d'une cuillère"}
    - id: cuire-four
      action: "Enfourner 10 min, jusqu'à ce que les escalopes commencent à dorer"
      needs: [bake]
      time_min: 10
      attended: false

  baby_portion:
    take: "2 c. à s. de pâte, AVANT le sel et le poivre"
    prep: "cuire une petite escalope à part et la couper en bâtonnets à saisir"
    needs: [bake]

  emits:
    - kind: reste-plat
      type: escalopes-vegetariennes
      qty_band: 2-repas
      keeps: {frigo_days: 5, congelo: true}
      note: "l'autrice les fait exprès en avance ; réchauffage à la poêle, pas au micro-ondes"
      # 5 jours au frigo, au-delà de la fenêtre de 4 j du foyer
      # (household.fridge_window_days) : le planificateur les jettera un jour
      # trop tôt. La fenêtre est une donnée du foyer, pas du plat — c'est le
      # modèle qui ne sait pas qu'un plat puisse tenir plus longtemps que la
      # règle générale.

  plan_b:
    - swap:
        step: cuire-four
        action: "Terminer les escalopes à la poêle plutôt qu'au four"
        saves_min: 6
      effect: "moins régulier, mais évite d'allumer le four pour 10 minutes"
