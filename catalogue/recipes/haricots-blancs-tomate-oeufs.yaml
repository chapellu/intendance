# Recette du foyer, rédigée pour ce dépôt le 2026-10-18 — aucune source
# extérieure. Septième dîner du fond de roulement.
#
# DEUX PROTÉINES BON MARCHÉ DANS LA MÊME SAUTEUSE. Les haricots blancs cuisent
# pendant l'après-midi ; les œufs se cassent dans la sauce au dernier moment,
# et c'est la seule partie qui ne se garde pas — le reste, sans œufs, se
# congèle.

recipe:
  id: haricots-blancs-tomate-oeufs
  title: Haricots blancs à la tomate, œufs pochés dedans
  lang: fr
  format: mijote
  yields:
    portions_eq: 5
  time_min_total: 95        # hors trempage, lancé la veille
  active_min: 20

  apports:
    proteine: legumineuse
    feculent: legumineuse
    legumes: [solanacee, racine, allium]
    profil: mijote
    origine: francais

  ingredients:
    - {id: haricots-blancs, name: haricots blancs secs (coco ou lingots), qty: 300, unit: g}
    - {id: tomates-pelees, name: tomates pelées en conserve, qty: 800, unit: g}
    - {id: oignon, name: oignon, qty: 1, unit: pièce}
    - {id: ail, name: ail, qty: 2, unit: gousse}
    - {id: carottes, name: carotte, qty: 1, unit: pièce}
    - {id: thym, name: thym, qty: 1, unit: c. à c.}
    - {id: laurier, name: feuille de laurier, qty: 1, unit: pièce}
    - {id: paprika, name: paprika doux, qty: 1, unit: c. à c.}
    - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
    - {id: oeufs, name: œufs, qty: 4, unit: pièce}
    - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}

  steps:
    - id: tremper
      action: "Couvrir les haricots blancs de trois fois leur volume d'eau froide"
      needs: []
      uses: [haricots-blancs]
      time_min: 2
      attended: false
      attente_min: 720
      attente_raison: "trempage d'une nuit, à lancer la veille au soir"
      kid: {age_min_months: 24, task: "verser les haricots dans le saladier d'eau"}
    - id: bouillir
      action: "Égoutter, couvrir d'eau fraîche avec le laurier, porter à gros bouillons et les y tenir 10 minutes"
      astuce: "Comme tous les haricots secs, ils gagnent à bouillir franchement au début : c'est ce qui les rend digestes."
      needs: [simmer-large]
      uses: [laurier]
      time_min: 15
    - id: cuire
      action: "Baisser le feu et cuire à frémissement, à couvert, jusqu'à ce qu'ils soient fondants"
      needs: [simmer-large]
      uses: []
      time_min: 60
      attended: false
    - id: tailler
      action: "Pendant ce temps : oignon, ail et carotte en petits dés"
      needs: [chop-coarse]
      uses: [oignon, ail, carottes]
      time_min: 6
      parallel_with: cuire
    - id: sauce
      action: "À la sauteuse, faire fondre les dés à l'huile, ajouter tomates, thym et paprika, laisser compoter"
      needs: [pan-fry, simmer]
      uses: [huile-olive, tomates-pelees, thym, paprika]
      time_min: 25
      attended: false
      parallel_with: cuire
    - id: assembler
      action: "Égoutter les haricots, retirer le laurier, les mêler à la sauce et laisser 10 minutes à petit feu"
      needs: [simmer]
      uses: []
      time_min: 10
      attended: false
    - id: saler
      action: "Goûter et saler"
      needs: []
      uses: [sel]
      time_min: 1
      seasoning_gate: true
    - id: oeufs
      action: "Creuser quatre nids dans la sauce, y casser les œufs, couvrir et cuire jusqu'à ce que le blanc soit pris"
      astuce: "Pour les petits, laisser aller jusqu'au jaune ferme."
      needs: [simmer]
      uses: [oeufs]
      time_min: 8

  baby_portion:
    take: "2 c. à s. de haricots à la tomate, avant salage et avant les œufs"
    prep: "écraser finement"
    needs: []
    depuis: [assembler]

  emits:
    - kind: reste-plat
      type: haricots-blancs-tomate
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}
      note: "le reste se range sans les œufs, qui se cuisent au moment"

  plan_b: []
