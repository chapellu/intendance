# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# MEILLEUR QUE LA VERSION AU MASCARPONE, dit l'autrice : huile de coco fondue avec
# agave et vanille, tofu soyeux réchauffé dedans, mixé avec les jaunes ; blancs
# en neige ; trois couches de biscuits trempés dans un café fort sucré
# (rhum ou marsala au choix), cacao entre chaque ; 12 h au frais.

recipe:
  id: tiramisu-sans-lait-tofu
  title: « LE » tiramisu sans lait
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Les desserts sans lait, ça le fait ! », extrait de « Cuisiner sans lait », blog Saines Gourmandises, 28 janvier 2016"
    url: https://saines-gourmandises.fr/un-tiramisu-un-cheesecake-et-un-gateau-de-fete-au-chocolat/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 8 personnes »
  time_min_total: 20
  active_min: 20

  apports:
    proteine: tofu-soja
    feculent: biscuit
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: huile-coco, name: "huile de coco vierge", qty: 150, unit: g}
    - {id: sirop-agave, name: "sirop d'agave (150 g + 2 c. à s.)", qty: 180, unit: g}
    - {id: tofu-soyeux, name: "tofu soyeux très bien égoutté", qty: 400, unit: g}
    - {id: oeufs, name: "œufs ultra frais", qty: 3, unit: pièce}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 1, unit: c. à s.}
    - {id: biscuits-cuillere, name: "biscuits à la cuillère", qty: 20, unit: pièce}
    - {id: cafe, name: "bon café fort", qty: 15, unit: cl}
    - {id: rhum, name: "rhum ou marsala", qty: 1, unit: c. à s., optional: true}
    - {id: cacao, name: "cacao en poudre", qty: 3, unit: c. à s.}

  steps:
    - id: creme
      action: "Fondre l'huile de coco avec la vanille et 150 g d'agave, y tiédir le tofu soyeux, puis mixer le tout avec les jaunes jusqu'à une crème lisse"
      needs: [simmer, blend-smooth]
      charge_partielle: true
      uses: [huile-coco, extrait-vanille, tofu-soyeux]
      time_min: 8
    - id: sirop
      action: "Mêler le café, 2 c. à s. d'agave et l'alcool ; tapisser un moule de biscuits trempés vite et poudrer de cacao"
      needs: []
      uses: [cafe, sirop-agave, rhum, biscuits-cuillere, cacao]
      time_min: 5
      kid: {age_min_months: 36, task: "tremper les biscuits"}
    - id: monter
      action: "Incorporer les blancs en neige souple à la crème, puis alterner trois couches de mousse et deux de biscuits imbibés poudrés de cacao"
      needs: []
      uses: [oeufs, cacao]
      time_min: 8
      attente_min: 720
      attente_raison: "au moins 12 h au frais"

  emits:
    - kind: reste-plat
      type: tiramisu-sans-lait-tofu
      qty_band: 2-repas
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
