  title: Crêpes au son d'avoine et à la fleur d'oranger
  creneaux: [gouter, dessert, petit-dejeuner]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Bientôt la chandeleur… », blog Saines Gourmandises, 28 janvier 2012"
    url: https://saines-gourmandises.fr/bientot-la-chandeleur/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
