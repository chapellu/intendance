# DES CRÊPES DE CHANDELEUR À IG BAS : son d'avoine et un peu de farine
# complète, petits-suisses, fleur d'oranger, vanille, agave, reposées une
# demi-heure, cuites plus longtemps qu'une crêpe de blé dans une poêle en
# fer. Les noix caramélisées de l'article les accompagnent.

recipe:
