# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# 10 CL DE KÉFIR À BOIRE mêlés à un litre de lait cru (ou frais microfiltré) entier,
# versés en pots sous un torchon : 24 à 48 h jusqu'à bien épaissir, puis 4 h
# au frais. Une texture bien plus crémeuse que la plupart des yaourts maison.
# LE KÉFIR EST UNE BASE du catalogue.

