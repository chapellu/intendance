# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.

recipe:
  id: petits-pots-creme-glacee
  title: Petits pots de crème glacée vanille-fraise
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 64"
    source_id: chioca-cuisine-bio-quotidien
    page: 64
    saison: printemps
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6
    pieces: 6
  time_min_total: 15        # hors 2 h de congélation
  active_min: 15

  creneaux: [gouter, dessert]        # dessert : voir la note de `mousse-au-chocolat`

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    # Crème glacée vanille — sans sorbetière, montée à froid
    - {id: creme-coco, name: crème de coco très froide, qty: 40, unit: cl}
    - {id: sirop-agave, name: sirop d'agave (crème vanille), qty: 5, unit: cl}
    - {id: extrait-vanille, name: extrait de vanille, qty: 1, unit: c. à s.}
    # Marbrures à la fraise
    - {id: fraises, name: fraises de saison très parfumées (Mara des Bois), qty: 200, unit: g}
    - {id: sirop-agave, name: sirop d'agave (marbrures), qty: 50, unit: g}
    - {id: lait-soja-vanille, name: lait de soja-vanille, qty: 60, unit: g}
    - {id: pots-carton, name: petits pots en carton, qty: 6, unit: pièce}

  steps:
    - id: fouetter
      action: "Fouetter la crème de coco très froide avec le sirop d'agave et l'extrait de vanille, puis réserver"
      needs: [blend-smooth]
      time_min: 5
      # La crème de coco ne monte que sortant du frigo — même contrainte que la
      # chantilly de la tarte aux fraises (p. 58).
    - id: marbrures
      action: "Mixer les fraises avec le sirop d'agave et le lait de soja-vanille"
      needs: [blend-smooth]
      time_min: 4
      kid: {age_min_months: 30, task: "équeuter les fraises avant de les mixer"}
    - id: marbrer
      action: "Verser la purée de fraises dans la crème fouettée et mélanger en trois ou quatre coups de spatule — pas un de plus, sinon les marbrures disparaissent"
      needs: []
      time_min: 2
    - id: congeler
      action: "Répartir dans les 6 pots en carton et mettre au congélateur environ 2 h ; au-delà, les sortir un peu en avance pour qu'ils ne soient pas trop durs"
      needs: [congeler]
      time_min: 4
      attended: false

  emits:
    - kind: reste-plat
      type: creme-glacee
      qty_band: 2-repas
      keeps: {frigo_days: 0, congelo: true}
      # ⚠ CE `congelo: true` FAUSSE LE COMPTEUR DU CONGÉLATEUR. `bilan_congelo()`
      # additionne toute sortie congelable en « portions d'urgence », c'est-à-dire
      # en repas disponibles le soir où tout s'effondre. Six pots de glace ne
      # sont pas un dîner de secours, et ils occupent pourtant un tiroir sur les
      # trois du foyer. Le modèle confond « ce qui est au congélateur » et
      # « ce sur quoi je peux compter pour manger » — deux choses différentes.

  transportable: false      # glace : ne quitte pas le congélateur

  plan_b: []
