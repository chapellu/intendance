# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN CAKE VERT CUIT À LA VAPEUR dans un moule à savarin de 22 cm : poireaux,
# épinards, oignon, ail et persil hachés avec œufs, huile et parmesan, farine
# et levure, muscade et poivre généreux. 175 g de farine pour une texture de
# terrine, 250 g pour un gâteau plus levé : 210 g ici. Pas de cuit-vapeur :
# la cocotte de 7,5 L et un panier vapeur ; le savarin est hors inventaire.

recipe:
  id: shrek-le-cake
  title: « Shrek » le cake aux poireaux et épinards
  format: cake
  lang: fr
  source:
    author: Marie Chioca
    work: "« Shrek le cake ;) », blog Saines Gourmandises, 7 février 2020"
    url: https://saines-gourmandises.fr/en-trois-coups-de-mixeur/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « pour 6 parts »
  lot_entier: true
  time_min_total: 65        # 10 min de préparation + 50 min de cuisson
  active_min: 15

  apports:
    proteine: oeuf
    feculent: farine
    legumes: [feuille, allium]
    profil: mijote
    origine: francais

  ingredients:
    - {id: oignon, name: oignon, qty: 50, unit: g}
    - {id: poireau, name: blancs de poireaux, qty: 200, unit: g}
    - {id: pousses-epinards, name: épinards frais, qty: 400, unit: g}
    - {id: ail, name: grosse gousse d'ail, qty: 1, unit: gousse}
    - {id: persil, name: "persil (demi-bouquet, 70 g)", qty: 0.5, unit: bouquet}
    - {id: oeufs, name: œufs, qty: 4, unit: pièce}
    - {id: parmesan, name: parmesan râpé, qty: 100, unit: g}
    - {id: farine-complete, name: "farine semi-complète (175 à 250 g)", qty: 210, unit: g}
    - {id: poudre-a-lever, name: poudre à lever, qty: 1, unit: sachet}
    - {id: huile-olive, name: huile d'olive, qty: 6, unit: cl}
    - {id: muscade, name: muscade râpée (généreusement), qty: 2, unit: pincée, seasoning: true}
    - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    - {id: poivre-5-baies, name: poivre 5 baies (généreusement), qty: 3, unit: pincée, seasoning: true}

  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: vapeur
      action: "Mettre deux litres d'eau à chauffer sous un panier vapeur ; rincer et essorer très soigneusement les épinards"
      needs: [steam]
      uses: [pousses-epinards]
      time_min: 6
    - id: hacher
      action: "Hacher finement poireaux, épinards, oignon, ail et persil, puis les mélanger aux œufs, à l'huile et au parmesan"
      needs: [chop-coarse]
      uses: [poireau, oignon, ail, persil, oeufs, huile-olive, parmesan]
      time_min: 10
    - id: pate
      action: "Mêler la farine, la levure, le sel, le poivre et la muscade au hachis, juste pour mélanger, et verser dans un moule à savarin huilé"
      needs: []
      uses: [farine-complete, poudre-a-lever, sel, poivre-5-baies, muscade]
      time_min: 3
      kid: {age_min_months: 30, task: "verser la farine dans le hachis"}
    - id: cuire
      action: "Cuire 50 min à la vapeur, à couvert, et laisser tiédir avant de démouler"
      astuce: "Chaud, ou froid avec une vinaigrette ou une sauce tomate."
      needs: [steam]
      uses: []
      time_min: 50
      attended: false

  emits:
    - kind: reste-plat
      type: shrek-le-cake
      qty_band: lunchbox
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
