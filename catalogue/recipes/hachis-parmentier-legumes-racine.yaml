# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN HACHIS OÙ LA POMME DE TERRE SE PARTAGE avec des légumes blancs (panais,
# céleri, topinambour…), un reste de viande (poulet, pot-au-feu) ou du haché,
# du jambon, et une croûte de fromage grillée 10 min.
#
# LA VIANDE CUITE EST UN RESTE du catalogue (poulet-cuit, facultatif) ;
# sans elle, 150 g de viande hachée à dorer avec l'oignon.

recipe:
  id: hachis-parmentier-legumes-racine
  title: Hachis Parmentier de légumes-racines
  format: gratin
  lang: fr
  source:
    author: Marie Chioca
    work: "« Vous faire raffoler du céleri rave ?… chiche ! », blog Saines Gourmandises, 6 mars 2026"
    url: https://saines-gourmandises.fr/vous-faire-raffoler-du-celeri-rave-chiche/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 55        # 25 min de préparation + 30 min environ
  active_min: 35

  accepts:
    - type: poulet-cuit
      qty: {amount: 150, unit: g}
      required: false

  sans_reste:
    temps_min: 0
    ingredients:
      - {id: boeuf-hache, name: "à défaut de reste, viande hachée", qty: 150, unit: g}

  apports:
    proteine: viande-blanche
    feculent: pommes-de-terre
    legumes: [racine, allium]
    profil: four
    origine: francais

  ingredients:
    - {id: poulet-cuit, name: "reste de viande (poulet, pot-au-feu…)", qty: 150, unit: g, from_accepts: true}
    - {id: pomme-de-terre, name: pommes de terre, qty: 300, unit: g}
    - {id: oignon, name: oignons, qty: 2, unit: pièce}
    - {id: panais, name: "légumes blancs (panais, céleri, topinambour…)", qty: 300, unit: g}
    - {id: jambon, name: bon jambon, qty: 150, unit: g}
    - {id: fromage-rape, name: fromage râpé, qty: 70, unit: g}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: creme, name: crème liquide, qty: 10, unit: cl}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: legumes
      action: "Dorer un oignon en petits cubes, puis cuire à la poêle les légumes en petits morceaux, salés et poivrés, en remuant souvent"
      needs: [pan-fry]
      uses: [oignon, huile-olive, pomme-de-terre, panais, sel, poivre]
      time_min: 25
      attended: true
    - id: viande
      action: "Dans une autre poêle, blondir le second oignon avec la viande et le jambon hachés"
      needs: [pan-fry]
      uses: [poulet-cuit, jambon]
      time_min: 8
      parallel_with: legumes
    - id: puree
      action: "Allumer le gril à 220 °C ; écraser les légumes avec juste assez de crème, y mêler la viande et la moitié du fromage, et verser dans un plat"
      needs: [gratin-vessel]
      uses: [creme]
      time_min: 6
    - id: gratiner
      action: "Couvrir du reste de fromage et gratiner une dizaine de minutes"
      needs: [gratin]
      uses: [fromage-rape]
      time_min: 10
      attended: true

  emits:
    - kind: reste-plat
      type: hachis-parmentier-legumes-racine
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
