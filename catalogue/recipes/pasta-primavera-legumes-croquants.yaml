# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# CÉRÉALE ET LÉGUMINEUSES (fèves et petits pois) : pas besoin d'autre
# protéine, dit l'autrice, mais un peu de poulet ou de tofu fumé doré avec les
# oignons ne gâche rien. Les légumes cuisent 12 min à couvert, dorés et encore
# croquants.

recipe:
  id: pasta-primavera-legumes-croquants
  title: Pasta primavera aux légumes croquants
  format: pates
  lang: fr
  source:
    author: Marie Chioca
    work: "« 3 délicieuses recettes détox de printemps », blog Saines Gourmandises, 10 avril 2015 (extrait de « Mes recettes détox super gourmandes »)"
    url: https://saines-gourmandises.fr/apres-paques-on-fait-leger-leger/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 30        # 15 min de préparation + 15 min de cuisson
  active_min: 25

  apports:
    proteine: legumineuse
    feculent: pates
    legumes: [racine, allium, legumineuse]
    profil: poele
    origine: italien

  ingredients:
    - {id: pates, name: pâtes complètes d'épeautre, qty: 350, unit: g}
    - {id: asperges-vertes, name: asperges vertes, qty: 1, unit: botte}
    - {id: navet-primeur, name: navets primeurs, qty: 1, unit: botte}
    - {id: cebette, name: oignons tiges, qty: 1, unit: botte}
    - {id: carottes, name: carottes, qty: 4, unit: pièce}
    - {id: petits-pois, name: petits pois, qty: 2, unit: poignée}
    - id: feves
      name: très jeunes fèves
      qty: 2
      unit: poignée
      subs:
        - {id: petits-pois-surgeles, name: petits pois surgelés, ratio: 1.0}
    - id: ail-des-ours
      name: feuilles d'ail des ours
      qty: 12
      unit: pièce
      subs:
        - {id: ciboulette, name: petit bouquet de ciboulette, ratio: 1.0}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: fleur-de-sel, name: fleur de sel, qty: 2, unit: pincée, seasoning: true}
    - {id: sel, name: sel (eau des pâtes), qty: 1, unit: c. à s., seasoning: true}

  steps:
    - id: pates
      action: "Cuire les pâtes al dente à l'eau salée, les égoutter, les arroser d'un peu d'huile et les garder au chaud"
      needs: [boil]
      uses: [pates, sel]
      time_min: 12
      attended: false
    - id: preparer
      action: "Écosser fèves et petits pois, couper oignons et navets en quatre, carottes en grosse julienne, asperges en deux dans la longueur"
      needs: [chop-coarse]
      uses: [feves, petits-pois, cebette, navet-primeur, carottes, asperges-vertes]
      time_min: 12
      parallel_with: pates
    - id: dorer
      action: "Dorer doucement les oignons à l'huile dans un grand wok ou une cocotte, puis navets et carottes salés, en remuant souvent"
      needs: [simmer-large]
      uses: [huile-olive]
      time_min: 6
      attended: true
    - id: etouffee
      action: "Ajouter asperges, petits pois, fèves et une pincée de fleur de sel, couvrir et cuire 12 min exactement"
      needs: [simmer-large]
      uses: [fleur-de-sel]
      time_min: 12
      attended: false
    - id: servir
      action: "Servir les pâtes avec les légumes, parsemées d'ail des ours ciselé"
      needs: []
      uses: [ail-des-ours]
      time_min: 2

  emits: []

  plan_b: []
