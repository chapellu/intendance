# SANS SORBETIÈRE : chantilly de coco à la vanille, marbrée de quelques coups de
# cuillère d'une sauce d'agave, cacao, espresso et deux cuillerées de whisky ;
# 4 h au congélateur.

recipe:
  id: glace-marbree-irish-coffee
  title: Glace marbrée Irish-coffee
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« 3 glaces végétales délicieusement chocolat (et sans sorbetière) », blog Saines Gourmandises, 26 août 2015"
    url: https://saines-gourmandises.fr/pour-fondre-de-bonheur/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « pour 4 à 6 personnes »
  time_min_total: 10
  active_min: 10

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: creme-coco, name: "crème de coco bien froide", qty: 40, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave (2 c. à s. + 10 cl)", qty: 13, unit: cl}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 1, unit: c. à s.}
    - {id: cacao, name: "cacao", qty: 60, unit: g}
    - {id: whisky, name: "bon whisky", qty: 2, unit: c. à c.}
    - {id: cafe, name: "espresso très serré", qty: 3, unit: cl}

  steps:
    - id: chantilly
      action: "Monter la crème de coco en chantilly avec 2 c. à s. d'agave et la vanille ; mêler à part le reste d'agave, le cacao, le whisky et l'espresso"
      needs: []
      uses: [creme-coco, extrait-vanille, sirop-agave, cacao, whisky, cafe]
      time_min: 7
    - id: marbrer
      action: "Verser la sauce sur la chantilly, marbrer de quelques coups de cuillère, et congeler"
      needs: [congeler]
      uses: []
      time_min: 2
      attente_min: 240
      attente_raison: "environ 4 h au congélateur"

  emits: []

  plan_b: []
