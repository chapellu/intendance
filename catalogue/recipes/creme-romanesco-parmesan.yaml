# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE SOUPE VELOUTÉE SANS POMME DE TERRE, BEURRE NI CRÈME : fleurettes de
# romanesco cuites 20 min sur un oignon blondi, mixées à l'huile verte et au
# parmesan en ajoutant l'eau de cuisson peu à peu.

recipe:
  id: creme-romanesco-parmesan
  title: Petite crème « romanesca » à l'huile d'olive et parmesan
  format: soupe
  lang: fr
  source:
    author: Marie Chioca
    work: "« Petite crème romanesca à l'huile d'olive verte et parmesan », blog Saines Gourmandises, 24 novembre 2011"
    url: https://saines-gourmandises.fr/une-soupe-delicieusement-veloutee-a-ig-bas-sans-pommes-de-terre-ni-beurre-ni-creme/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 30
  active_min: 10

  apports:
    proteine: fromage
    feculent: aucun
    legumes: [crucifere, allium]
    profil: soupe
    origine: italien

  ingredients:
    - {id: chou-romanesco, name: chou romanesco, qty: 1, unit: pièce}
    - {id: oignon, name: oignon, qty: 1, unit: pièce}
    - {id: huile-olive, name: bonne huile d'olive un peu verte, qty: 4, unit: c. à s.}
    - {id: eau, name: eau pour couvrir, qty: 1, unit: l}
    - {id: sel, name: sel fin (c. à s. rase), qty: 1, unit: c. à s., seasoning: true}
    - {id: poivre-5-baies, name: poivre 5 baies, qty: 1, unit: pincée, seasoning: true}
    - {id: parmesan, name: parmesan râpé, qty: 50, unit: g}

  steps:
    - id: blondir
      action: "Faire revenir doucement l'oignon émincé dans 2 c. à s. d'huile jusqu'à ce qu'il dore à peine"
      needs: [simmer]
      uses: [oignon]
      time_min: 6
      attended: true
    - id: cuire
      action: "Ajouter les fleurettes de romanesco, couvrir d'eau salée et cuire 20 min"
      needs: [simmer]
      uses: [chou-romanesco, eau, sel]
      time_min: 20
      attended: false
    - id: mixer
      action: "Mixer les fleurettes avec le poivre, le reste d'huile et le parmesan, en ajoutant l'eau de cuisson peu à peu jusqu'à la bonne consistance"
      needs: [blend-smooth]
      uses: [poivre-5-baies, huile-olive, parmesan]
      time_min: 4

  emits:
    - kind: reste-plat
      type: creme-romanesco-parmesan
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
