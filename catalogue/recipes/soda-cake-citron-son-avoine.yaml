#
# UN CAKE QUI MOUSSE : le jus de citron réagit avec la levure, donc on verse
# aussitôt et on ne touche plus ; 1 h à 150 °C, pas plus chaud. En muffins,
# 25 min.

recipe:
  id: soda-cake-citron-son-avoine
  title: « Soda-cake » au citron, sirop d'agave et son d'avoine
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Soda-cake au citron, sirop d'agave et son d'avoine », blog Saines Gourmandises, 23 mars 2012"
    url: https://saines-gourmandises.fr/une-recette-toute-simple-et-legere-pour-feter-larrivee-du-printemps/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « un cake de 20 cm »
  lot_entier: true
  time_min_total: 70
  active_min: 10

  apports:
    proteine: oeuf
    feculent: avoine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: son-avoine, name: "son d'avoine", qty: 75, unit: g}
    - {id: farine-epeautre, name: "farine complète d'épeautre", qty: 75, unit: g}
    - {id: poudre-a-lever, name: "levure", qty: 1, unit: sachet}
    - {id: puree-amande-blanche, name: "purée d'amande blanche (ou margarine)", qty: 100, unit: g}
