    - {id: citron, name: "citrons (7 cl de jus)", qty: 2, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave", qty: 15, unit: cl}
    - {id: huile-essentielle-citron, name: "huile essentielle de citron (ou un zeste)", qty: 20, unit: pièce}

  steps:
    - id: pate
      action: "Préchauffer à 150 °C ; mélanger farine, levure et son, puis tous les autres ingrédients, et verser aussitôt dans le moule"
      astuce: "Dès que la pâte mousse, moins on la touche, mieux le cake lève."
      needs: []
