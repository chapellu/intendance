# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# TOMATES, PETITS POIVRONS ET COURGETTES RONDES évidés, farcis de jambon cru et
# de viande au choix dorés avec l'oignon, de leur propre chair hachée aux
# herbes et olives, de parmesan, de riz cru et de sauce tomate ; 1 h 30 de
# four, jusqu'à ce qu'ils confisent. Chauds avec une céréale, froids en entrée.

recipe:
  id: petits-farcis-nicois
  title: Petits farcis niçois
  format: piece
  lang: fr
  source:
    author: Marie Chioca
    work: "« Petits farcis niçois, vite faits bien faits », blog Saines Gourmandises, 26 août 2012"
    url: https://saines-gourmandises.fr/mais-non-cest-pas-la-rentree-souriez-cest-encore-lete/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 110       # 20 min de préparation + 1 h 30
  active_min: 25

  apports:
    proteine: viande-rouge
    feculent: riz
    legumes: [solanacee, cucurbitacee, allium]
    profil: four
    origine: francais

  ingredients:
    - {id: tomates, name: tomates, qty: 4, unit: pièce}
    - {id: poivron, name: petits poivrons, qty: 4, unit: pièce}
    - {id: courgettes, name: courgettes rondes, qty: 4, unit: pièce}
    - {id: oignon, name: oignons, qty: 2, unit: pièce}
    - {id: jambon-cru, name: jambon cru, qty: 150, unit: g}
    - {id: boeuf-hache, name: "viande crue au choix (bœuf, veau, porc, poulet)", qty: 200, unit: g}
    - {id: parmesan, name: parmesan, qty: 100, unit: g}
    - {id: sauce-tomate, name: bonne sauce tomate, qty: 200, unit: g}
    - {id: riz, name: "riz basmati complet (ou quinoa)", qty: 80, unit: g}
    - {id: huile-olive, name: huile d'olive, qty: 5, unit: c. à s.}
    - {id: herbes-fraiches, name: "persil, ciboulette, sarriette ou origan", qty: 1, unit: petit bouquet}
    - {id: olives-noires, name: olives noires dénoyautées, qty: 16, unit: pièce}
    - {id: sel, name: sel, qty: 3, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 2, unit: pincée, seasoning: true}

  steps:
    - id: evider
      action: "Découper un chapeau sur chaque légume, l'évider sans percer le fond en gardant la chair, saler et poivrer l'intérieur, et ranger sur une plaque huilée"
      needs: []
      uses: [tomates, poivron, courgettes]
      time_min: 10
    - id: viande
      action: "Dorer à l'huile l'oignon en brunoise avec le jambon et la viande hachés"
      needs: [pan-fry]
      uses: [oignon, jambon-cru, boeuf-hache]
      time_min: 8
      attended: true
    - id: farce
      action: "Hacher la chair des légumes avec les herbes, le sel, le poivre et la moitié des olives, puis amalgamer avec viande, parmesan, riz et sauce"
      needs: [chop-coarse]
      uses: [herbes-fraiches, sel, poivre, parmesan, riz, sauce-tomate]
      time_min: 8
      kid: {age_min_months: 30, task: "malaxer la farce avec les mains"}
    - id: cuire
      action: "Farcir les légumes, poser une olive et un filet d'huile sur chacun, coiffer des chapeaux et cuire 1 h 30 à 180 °C"
      needs: [bake]
      uses: [olives-noires, huile-olive]
      time_min: 90
      attended: false

  emits:
    - kind: reste-plat
      type: petits-farcis-nicois
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}
      note: "froids, en entrée"

  plan_b: []
