# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# SANS GLUTEN NI LACTOSE : crème de soja, agave et purée de noisette chauffées,
# chocolat fondu dedans à couvert, jaunes, blancs en neige et noix ; au moins
# 35 min, jusqu'à ce que la surface gonfle et se craquèle à peine. La base du
# nid de Pâques de 2013, en plat rectangulaire, avec des noix.

recipe:
  id: brownies-noix-sans-farine
  title: Brownies aux noix sans farine
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« 3 desserts au chocolat pour ce week-end… », extrait de « Mes irrésistibles recettes au chocolat », blog Saines Gourmandises, 10 octobre 2014"
    url: https://saines-gourmandises.fr/des-brownies-des-mi-cuits-des-petits-pots-de-creme-mousseuse/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 12          # « environ 12 parts »
  lot_entier: true
  time_min_total: 50
  active_min: 10

  apports:
    proteine: oeuf
    feculent: aucun
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: chocolat-noir, name: "chocolat noir 70 ou 85 %", qty: 200, unit: g}
    - {id: creme-soja, name: "crème de soja", qty: 20, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 12, unit: cl}
    - {id: puree-noisette, name: "purée de noisette bien souple", qty: 70, unit: g}
    - {id: oeufs, name: "œufs", qty: 3, unit: pièce}
    - {id: noix, name: "cerneaux de noix fraîchement cassées", qty: 80, unit: g}

  steps:
    - id: fondre
      action: "Préchauffer à 180 °C ; chauffer la crème avec l'agave et la noisette, y fondre le chocolat hors du feu à couvert"
      needs: [simmer]
      charge_partielle: true
      uses: [creme-soja, sirop-agave, puree-noisette, chocolat-noir]
      time_min: 6
    - id: pate
      action: "Lisser au fouet avec les jaunes, puis incorporer les blancs en neige et les noix"
      needs: []
      uses: [oeufs, noix]
      time_min: 6
      kid: {age_min_months: 30, task: "verser les noix"}
    - id: cuire
      action: "Cuire au moins 35 min dans un petit plat chemisé et laisser refroidir avant de couper"
      astuce: "Cuits quand la surface gonfle et craquèle ; lisse et brillante au centre, ce n'est pas encore cuit."
      needs: [bake]
      uses: []
      time_min: 38
      attended: false

  emits:
    - kind: reste-plat
      type: brownies-noix-sans-farine
      qty_band: 3-repas
      keeps: {frigo_days: 4, congelo: true}

  plan_b: []
