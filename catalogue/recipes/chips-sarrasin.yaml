# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DES CHIPS SANS FRITURE : galettes bretonnes du commerce découpées en
# triangles, 5 min au four sur un papier huilé, croustillantes une fois
# refroidies. L'huile essentielle d'origan (une goutte) est facultative.

recipe:
  id: chips-sarrasin
  title: Chips de sarrasin
  role: accompagnement
  lang: fr
  source:
    author: Marie Chioca
    work: "« Chips de sarrasin (attention, recette de méga-fainéant) », blog Saines Gourmandises, 5 octobre 2018"
    url: https://saines-gourmandises.fr/la-feuille-dautomne/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes environ »
  time_min_total: 15
  active_min: 8

  apports:
    proteine: aucune
    feculent: sarrasin
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: galettes-sarrasin, name: grandes galettes bretonnes pur sarrasin, qty: 5, unit: pièce}
    - {id: huile-olive, name: un peu d'huile d'olive, qty: 1, unit: c. à s.}
    - {id: paprika, name: piment doux ou paprika, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: decouper
      action: "Préchauffer le four à 210 °C ; huiler au pinceau un papier cuisson sur la lèchefrite et découper les galettes superposées en triangles"
      needs: []
      uses: [huile-olive, galettes-sarrasin]
      time_min: 4
      kid: {age_min_months: 36, task: "poser les triangles sur la plaque"}
    - id: cuire
      action: "Cuire 5 min par fournée, jusqu'à ce qu'elles dorent, et les laisser refroidir"
      astuce: "Elles ne croustillent qu'une fois froides."
      needs: [bake]
      uses: []
      time_min: 10
      attended: true
    - id: assaisonner
      action: "Saupoudrer de piment doux et garder dans un bocal hermétique"
      needs: []
      uses: [paprika]
      time_min: 1

  emits: []

  plan_b: []
