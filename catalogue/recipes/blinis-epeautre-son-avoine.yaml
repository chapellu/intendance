#
# TRENTE PETITS BLINIS : épeautre et son d'avoine, œufs, eau tiède, levure, un
# peu de sucre (sans lui, ils restent blancs), levés une nuit au frais ; saisis
# dans une poêle très chaude puis finis à couvert à feu très doux pour lever.

recipe:
  id: blinis-epeautre-son-avoine
  title: Blinis maison à l'épeautre et au son d'avoine
  role: base
  lang: fr
  source:
    author: Marie Chioca
    work: "« Blinis maison à l'épeautre et au son d'avoine », blog Saines Gourmandises, 16 décembre 2014"
    url: https://saines-gourmandises.fr/kalinka-kalinka-kalin-tralala/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5
    pieces: 30              # « environ 30 petits blinis »
  time_min_total: 35
  active_min: 30

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: poele
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: farine de grand épeautre T130, qty: 150, unit: g}
    - {id: son-avoine, name: son d'avoine, qty: 150, unit: g}
    - {id: eau, name: eau tiède (45 °C au plus), qty: 30, unit: cl}
    - {id: oeufs, name: œufs, qty: 4, unit: pièce}
    - {id: levure-boulangere, name: levure de boulanger déshydratée, qty: 1, unit: sachet}
    - {id: sucre-complet, name: sucre de coco ou de canne (c. à s. rases), qty: 2, unit: c. à s.}
    - {id: sel, name: bonne pincée de sel fin, qty: 1, unit: bonne pincée, seasoning: true}
    - {id: huile-olive, name: huile d'olive pour la cuisson, qty: 3, unit: c. à s.}

  steps:
    - id: pate
      action: "Délayer la levure dans l'eau tiède ; mélanger son, farine, sel et sucre, y fouetter les œufs et l'eau, couvrir et mettre au frais"
      needs: []
      uses: [levure-boulangere, eau, son-avoine, farine-epeautre, sel, sucre-complet, oeufs]
      time_min: 5
      attente_min: 600
      attente_raison: "pousse lente d'une nuit au frais (8 à 12 h)"
    - id: cuire
      action: "Remuer à peine la pâte ; dans une poêle très chaude et huilée, verser des cuillerées espacées, couvrir et finir à feu très doux, puis retourner"
      astuce: "Une poêle en fer, émail ou céramique plutôt qu'en inox."
      needs: [pan-fry]
      uses: [huile-olive]
      time_min: 25
      attended: true

  emits:
    - kind: base
      type: blinis-epeautre-son-avoine
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
