# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# SEPT MINUTES DE PRÉPARATION : farine complète et son d'avoine, levure, agave,
# huile d'olive, œufs, zeste et jus de citron, pommes en tranches ; petit
# moule de 13 à 15 cm, 35 min.

recipe:
  id: moelleux-pomme-citron-son-avoine
  title: Moelleux pomme-citron au son d'avoine et sirop d'agave
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Le moelleux pomme-citron au son d'avoine et sirop d'agave », blog Saines Gourmandises, 22 septembre 2011"
    url: https://saines-gourmandises.fr/le-moelleux-pomme-citron-au-son-davoine-et-sirop-dagave/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  lot_entier: true
  time_min_total: 42
  active_min: 7

  apports:
    proteine: oeuf
    feculent: avoine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-complete, name: "farine complète T110 de blé ou d'épeautre", qty: 100, unit: g}
    - {id: son-avoine, name: "son d'avoine", qty: 150, unit: g}
    - {id: poudre-a-lever, name: "levure à gâteaux", qty: 1, unit: sachet}
    - {id: sirop-agave, name: "sirop d'agave", qty: 6, unit: c. à s.}
    - {id: huile-olive, name: "huile d'olive", qty: 4, unit: c. à s.}
    - {id: oeufs, name: "œufs", qty: 3, unit: pièce}
    - {id: pommes, name: "pommes", qty: 2, unit: pièce}
    - {id: citron, name: "citron non traité", qty: 1, unit: pièce}

  steps:
    - id: preparer
      action: "Préchauffer à 180 °C ; presser le citron et râper son zeste, éplucher les pommes et les trancher"
      needs: []
      uses: [citron, pommes]
      time_min: 4
    - id: pate
      action: "Mélanger farine, son et levure, y fouetter agave, huile, œufs, jus et zeste, puis les pommes"
      needs: []
      uses: [farine-complete, son-avoine, poudre-a-lever, sirop-agave, huile-olive, oeufs]
      time_min: 3
      kid: {age_min_months: 30, task: "fouetter la pâte"}
    - id: cuire
      action: "Verser dans un petit moule et cuire 35 min"
      needs: [bake]
      uses: []
      time_min: 35
      attended: false

  emits:
    - kind: reste-plat
      type: moelleux-pomme-citron-son-avoine
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
