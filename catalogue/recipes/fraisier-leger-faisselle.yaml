# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN FRAISIER SANS CRÈME AU BEURRE : génoise d'amande au son d'avoine cuite
# dans un cercle, ouverte au tiers ; fraises debout contre le cercle, crème
# de faisselle égouttée à la vanille et à l'agave, second disque, crème ;
# une journée (ou une nuit) au frais.

recipe:
  id: fraisier-leger-faisselle
  title: Un fraisier tout simple et tout léger
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Un fraisier tout simple et tout léger », blog Saines Gourmandises, 1er juin 2012"
    url: https://saines-gourmandises.fr/pour-la-fete-des-mamans/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 7          # « pour 6 à 8 gourmands »
  lot_entier: true
  time_min_total: 65
  active_min: 25

  apports:
    proteine: fromage
    feculent: aucun
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: poudre-amande, name: "poudre d'amande", qty: 125, unit: g}
    - {id: oeufs, name: "œufs", qty: 4, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave (4 + 7 c. à s.)", qty: 11, unit: c. à s.}
    - {id: eau, name: "eau", qty: 3, unit: c. à s.}
    - {id: son-avoine, name: "son d'avoine", qty: 2, unit: c. à s.}
    - {id: extrait-amande-amere, name: "extrait d'amande amère", qty: 1, unit: pincée, optional: true}
    - {id: faisselle, name: "fromage blanc en faisselle (pot de 1 kg, pas tout)", qty: 700, unit: g}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 2, unit: c. à c.}
    - {id: fraises, name: "fraises de saison", qty: 500, unit: g}

  steps:
    - id: egoutter
      action: "Renverser la faisselle dans une passoire au frais"
      needs: []
      uses: [faisselle]
      time_min: 1
      attente_min: 120
      attente_raison: "égouttage d'au moins 2 h, au mieux une demi-journée"
    - id: genoise
      action: "Préchauffer à 180 °C ; mêler jaunes, poudre d'amande, son, 4 c. à s. d'agave, eau et extrait, incorporer les blancs en neige et cuire dans un cercle"
      needs: [bake]
      uses: [oeufs, poudre-amande, son-avoine, eau, extrait-amande-amere]
      time_min: 30
    - id: creme
      action: "Mixer la faisselle égouttée avec le reste d'agave et la vanille"
      needs: [blend-smooth]
      uses: [sirop-agave, extrait-vanille]
      time_min: 4
      parallel_with: genoise
    - id: monter
      action: "Ouvrir la génoise tiède au tiers ; sur le gros disque cerclé, ranger les fraises, couvrir de crème, poser le chapeau et le reste de crème"
      needs: []
      uses: [fraises]
      time_min: 12
      attente_min: 720
      attente_raison: "une journée ou une nuit au frais avant de décercler"
      kid: {age_min_months: 36, task: "ranger les fraises debout"}

  emits:
    - kind: reste-plat
      type: fraisier-leger-faisselle
      qty_band: 3-repas
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
