# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN TIRAMISU SANS LAITAGE : fraises (des bois, ou une variété très parfumée)
# compotées avec l'agave, la vanille et un peu d'agar-agar, huile de coco
# fondue dedans, blancs en neige incorporés tièdes ; en couches avec des
# biscuits à la cuillère trempés dans un sirop à l'eau de rose ; 6 h au frais.

recipe:
  id: entremet-rose-fraises-des-bois
  title: Entremet à la rose et aux fraises des bois, façon tiramisu
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Entremet à la rose et aux fraises des bois, façon tiramisu », blog Saines Gourmandises, 20 juin 2014"
    url: https://saines-gourmandises.fr/un-dessert-fleuri-pour-vous-parler-du-livre-de-geraldine/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 20
  active_min: 15

  apports:
    proteine: oeuf
    feculent: biscuit
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: fraises, name: "fraises des bois ou fraises très parfumées", qty: 250, unit: g}
    - {id: agar-agar, name: "agar-agar (demi-sachet)", qty: 1, unit: g}
    - {id: gousse-vanille, name: "gousse de vanille", qty: 1, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave (3 + 4 c. à s.)", qty: 7, unit: c. à s.}
    - {id: huile-coco, name: "huile de coco vierge", qty: 60, unit: g}
    - {id: oeufs, name: "blancs d'œufs", qty: 2, unit: pièce}
    - {id: eau-rose, name: "eau florale de rose alimentaire", qty: 3, unit: c. à s.}
    - {id: biscuits-cuillere, name: "biscuits à la cuillère", qty: 10, unit: pièce}
    - {id: cacao, name: "fin voile de cacao", qty: 1, unit: c. à c.}

  steps:
    - id: sirop
      action: "Mêler 3 c. à s. d'agave à l'eau de rose"
      needs: []
      uses: [eau-rose]
      time_min: 1
    - id: fraises
      action: "Compoter les fraises avec 4 c. à s. d'agave, les graines de vanille et l'agar-agar, porter à ébullition, puis y fondre l'huile de coco et laisser tiédir"
      needs: [simmer]
      charge_partielle: true
      uses: [fraises, sirop-agave, gousse-vanille, agar-agar, huile-coco]
      time_min: 8
    - id: monter
      action: "Incorporer vite les blancs en neige souple à la crème tiède et alterner en saladier biscuits trempés dans le sirop et mousse"
      needs: []
      uses: [oeufs, biscuits-cuillere]
      time_min: 8
      attente_min: 360
      attente_raison: "au moins 6 h au frais, une nuit au mieux"
      kid: {age_min_months: 36, task: "tremper les biscuits"}
    - id: servir
      action: "Servir sous un fin voile de cacao"
      needs: []
      uses: [cacao]
      time_min: 1

  emits: []

  plan_b: []
