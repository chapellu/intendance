# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE « SOUCHE » ROULÉE EN DOUBLE : génoise au cacao aux œufs fouettés cuite 8 min
# en plaque, coupée en deux bandes, imbibée d'un sirop de Chartreuse verte et
# d'agave, tartinée de compote de poire épaisse et de chantilly de coco,
# roulée une bande puis l'autre autour ; glacée de pâte à truffes (la même que
# les truffes de la page) tiédie.

recipe:
  id: buche-poire-chocolat-chartreuse
  title: Bûche poire-chocolat à la Chartreuse verte
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Bûche poire-chocolat à la Chartreuse verte et, en bonus, THE recette de truffes ! », blog Saines Gourmandises, 18 décembre 2018"
    url: https://saines-gourmandises.fr/pour-emmanuelle/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 9          # « pour 8/10 personnes »
  lot_entier: true
  time_min_total: 60
  active_min: 40

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: chocolat-noir, name: "chocolat noir pâtissier 70 %", qty: 200, unit: g}
    - {id: huile-coco, name: "huile de coco vierge", qty: 75, unit: g}
    - {id: creme-coco, ref: creme-truffes, name: "crème de coco liquide (truffes)", qty: 20, unit: cl}
    - {id: sirop-agave, ref: agave-truffes, name: "sirop d'agave (truffes)", qty: 10, unit: cl}
    - {id: gousse-vanille, name: "belle gousse de vanille", qty: 1, unit: pièce}
    - {id: lecithine-soja, name: "lécithine de soja (c. à s. rase)", qty: 1, unit: c. à s.}
    - {id: fleur-de-sel, name: "pointe de fleur de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: oeufs, name: "œufs", qty: 4, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave (génoise 10 cl + sirop 6 cl)", qty: 16, unit: cl}
    - {id: farine-epeautre, name: "farine T110 de grand épeautre", qty: 125, unit: g}
    - {id: cacao, name: "cacao amer", qty: 25, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: compote, name: "compote de poire épaisse sans sucre", qty: 300, unit: g}
    - {id: creme-coco, name: "crème de coco liquide (chantilly)", qty: 40, unit: cl}
    - {id: sucre-vanille, name: "sucre vanillé", qty: 4, unit: sachet}
    - {id: chartreuse, name: "Chartreuse verte", qty: 6, unit: cl}

  steps:
    - id: ganache
      action: "Chauffer doucement la crème de coco, la vanille et l'agave en fouettant, couper avant l'ébullition et y fondre huile de coco et chocolat en morceaux"
      needs: [simmer]
      charge_partielle: true
      uses: [creme-truffes, gousse-vanille, agave-truffes, huile-coco, chocolat-noir]
      time_min: 8
    - id: mixer
      action: "Ôter la gousse et mixer plusieurs minutes avec la lécithine et la fleur de sel, jusqu'à ce qu'il ne reste aucun grain"
      needs: [blend-smooth]
      uses: [lecithine-soja, fleur-de-sel]
      time_min: 5
    - id: genoise
      action: "Préchauffer à 180 °C ; fouetter les œufs avec 10 cl d'agave jusqu'à tripler, y mêler farine, cacao et levure tamisés, étaler en plaque et cuire 8 à 9 min"
      needs: [bake]
      uses: [oeufs, sirop-agave, farine-epeautre, cacao, poudre-a-lever]
      time_min: 25
    - id: garnir
      action: "Couper la génoise tiède en deux bandes, les imbiber du sirop Chartreuse-agave, tartiner de compote et poser des cuillerées de chantilly de coco vanillée"
      needs: []
      uses: [chartreuse, compote, creme-coco, sucre-vanille]
      time_min: 12
    - id: rouler
      action: "Rouler la première bande, la poser au bout de la seconde et rouler encore ; glacer de pâte à truffes tiédie et garder au frais"
      needs: []
      uses: []
      time_min: 10
      attente_min: 180
      attente_raison: "quelques heures au frais"
      kid: {age_min_months: 48, task: "aider à rouler la bûche"}

  emits:
    - kind: reste-plat
      type: buche-poire-chocolat-chartreuse
      qty_band: 3-repas
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
