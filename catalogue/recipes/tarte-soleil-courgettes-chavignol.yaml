# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE PÂTE À L'HUILE ET AU VIN BLANC, 3 c. à s. d'huile pour 8 parts : étalée
# très finement, découpée en étoile au centre, dont on rabat les branches sur
# les courgettes sautées, les pignons et le crottin. En entrée, avec du
# mesclun ; en plat, pour quatre.

recipe:
  id: tarte-soleil-courgettes-chavignol
  title: Tarte « soleil » aux jeunes courgettes, pignons et chavignol
  format: quiche
  lang: fr
  source:
    author: Marie Chioca
    work: "« Tarte soleil aux jeunes courgettes, pignons et Chavignol », blog Saines Gourmandises, 3 juillet 2014"
    url: https://saines-gourmandises.fr/pas-si-tarte-que-ca/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « une tarte de 8 parts » (en entrée)
  lot_entier: true
  time_min_total: 45        # 20 min de préparation + 25 min de four
  active_min: 25

  apports:
    proteine: fromage
    feculent: pate-brisee
    legumes: [cucurbitacee, allium]
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: farine T110 de grand épeautre, qty: 180, unit: g}
    - {id: vin-blanc-sec, name: vin blanc, qty: 6, unit: c. à s.}
    - {id: huile-olive, ref: huile-pate, name: huile d'olive (pâte), qty: 3, unit: c. à s.}
    - {id: origan, name: origan séché, qty: 2, unit: c. à c., seasoning: true}
    - {id: sel, ref: sel-pate, name: bonne pincée de sel (pâte), qty: 1, unit: bonne pincée, seasoning: true}
    - {id: courgettes, name: jeunes courgettes, qty: 3, unit: pièce}
    - {id: oignon, name: oignon, qty: 1, unit: pièce}
    - {id: huile-olive, ref: huile-garniture, name: huile d'olive (garniture), qty: 3, unit: c. à s.}
    - {id: pignons-pin, name: pignons de pin, qty: 35, unit: g}
    - {id: chevre-demi-sec, name: crottin de Chavignol, qty: 35, unit: g}
    - {id: thym-frais, name: "herbes (origan, sarriette, thym…)", qty: 3, unit: brin}
    - {id: sel, ref: sel-garniture, name: sel, qty: 1, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  avec:
    - {id: jeunes-pousses, name: mesclun, qty: 150, unit: g}

  steps:
    - id: sauter
      action: "Préchauffer le four à 180 °C ; dorer l'oignon émincé à l'huile, puis sauter à feu vif les courgettes en fines tranches, salées"
      astuce: "Jusqu'à ce qu'elles ne rendent plus d'eau, sinon la pâte détrempe."
      needs: [pan-fry]
      uses: [oignon, huile-garniture, courgettes, sel-garniture]
      time_min: 15
      attended: true
    - id: pate
      action: "Rassembler en boule farine, vin, huile, origan et sel, l'étaler très finement en disque sur une plaque farinée"
      needs: []
      uses: [farine-epeautre, vin-blanc-sec, huile-pate, origan, sel-pate]
      time_min: 6
      parallel_with: sauter
    - id: etoile
      action: "Tracer une étoile au centre à la roulette, garnir le tour de courgettes, pignons, chèvre en petits morceaux, herbes et poivre, et rabattre les branches"
      needs: []
      uses: [pignons-pin, chevre-demi-sec, thym-frais, poivre]
      time_min: 6
      kid: {age_min_months: 36, task: "replier les branches de l'étoile"}
    - id: cuire
      action: "Cuire 25 min"
      needs: [bake]
      uses: []
      time_min: 25
      attended: false

  emits: []

  plan_b: []
