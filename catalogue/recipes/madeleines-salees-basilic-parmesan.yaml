#
# DES MADELEINES D'APÉRO À L'HUILE D'OLIVE : farine T150, son d'avoine, ail,
# basilic, parmesan, œufs, mixés en pâte lisse ; 5 min à 240 °C puis 5 min à
# 200 °C. Le jus d'herbe d'orge (couleur) n'est pas encodé. Moules à
# madeleines : hors inventaire, rien ne le vérifie.

recipe:
  id: madeleines-salees-basilic-parmesan
  title: Madeleines à l'huile d'olive, basilic et parmesan
  role: entree
  lang: fr
  source:
    author: Marie Chioca
    work: "« Madeleines à l'huile d'olive, basilic et parmesan », blog Saines Gourmandises, 17 juin 2012"
    url: https://saines-gourmandises.fr/une-saine-gourmandise-pour-lapero/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6
    pieces: 24              # « 24 grandes madeleines »
  time_min_total: 20
  active_min: 8

  apports:
    proteine: oeuf
    feculent: farine
    legumes: [allium]
    profil: four
    origine: francais

  ingredients:
    - {id: farine-complete, name: farine T150, qty: 150, unit: g}
    - {id: son-avoine, name: son d'avoine, qty: 30, unit: g}
    - {id: poudre-a-lever, name: paquet de levure à gâteaux, qty: 1, unit: sachet}
    - {id: ail, name: ail, qty: 2, unit: gousse}
    - {id: basilic, name: feuilles de basilic frais, qty: 30, unit: pièce}
    - {id: parmesan, name: parmesan, qty: 50, unit: g}
    - {id: oeufs, name: œufs, qty: 4, unit: pièce}
    - {id: huile-olive, name: huile d'olive, qty: 7, unit: c. à s.}
    - {id: eau, name: eau, qty: 7, unit: c. à s.}
    - {id: sel, name: sel, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: pate
      action: "Préchauffer le four à 240 °C ; mixer longuement tous les ingrédients jusqu'à une pâte bien lisse"
      needs: [blend-smooth]
      uses: [farine-complete, son-avoine, poudre-a-lever, ail, basilic, parmesan, oeufs, huile-olive, eau, sel]
      time_min: 5
    - id: cuire
      action: "Remplir les moules huilés, cuire 5 min à 240 °C puis 5 min à 200 °C"
      astuce: "Pour une seconde fournée, remonter le four à 240 °C avant d'enfourner."
      needs: [bake]
      uses: []
      time_min: 12
      attended: true

