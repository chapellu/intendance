# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.
# Encodée le 2026-11-18 sur photo de la page (T189).
#
# UN REPAS « EN KIT » : deux tartinades de chèvre (une rose à la betterave
# crue, une verte aux herbes), des œufs durs, des radis et du pain, posés sur
# la table, et chacun compose ses tartines. Pensé pour le déjeuner, à la maison
# ou en pique-nique.
#
# MIXER PAR BRÈVES IMPULSIONS, ET C'EST LE SEUL PIÈGE : mixé à fond trop
# longtemps, le chèvre se liquéfie et la tartinade est perdue. D'où
# `chop-coarse` et non `blend-smooth`.
#
# LES HERBES SONT UNE CLASSE, comme `legumes-verts-saison` : « herbes fraîches
# de saison, seules ou en mélange ». Le mélange préféré de l'autrice en
# avril-mai est ail des ours (ou ciboulette), premières pousses d'origan et
# basilic. `herbes-fraiches` dit ça sans inventer un choix.
#
# 800 G DE PAIN POUR QUATRE : c'est le féculent du repas, pas une garniture.
# `pain-levain` est le pain du foyer ; la page veut du complet ou du
# demi-complet.

recipe:
  id: tartines-chevre-frais
  title: Tartines-repas « sur le pouce » au chèvre frais
  format: tartine
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 46"
    source_id: chioca-cuisine-bio-quotidien
    page: 46
    saison: printemps
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 10        # en-tête : 10 min de préparation, sans cuisson annoncée
  active_min: 10

  apports:
    proteine: fromage
    feculent: pain
    legumes: [racine, feuille]
    profil: cru
    origine: francais

  ingredients:
    - {id: chevre-frais, name: "fromage de chèvre frais (pas de faisselle) ou tomme fraîche", qty: 300, unit: g}
    - {id: oeufs, name: œufs, qty: 4, unit: pièce}
    - {id: betterave, name: betterave crue, qty: 1, unit: tranche}
    - {id: herbes-fraiches, name: "herbes fraîches de saison, seules ou en mélange", qty: 1, unit: poignée}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: radis, name: radis, qty: 8, unit: pièce}
    - {id: pain-levain, name: pain complet ou demi-complet, qty: 800, unit: g}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 2, unit: pincée, seasoning: true}

  # « idéalement complétée d'une salade pour renforcer l'apport en crudités »
  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: cuire-oeufs
      action: "Cuire les œufs 8 min à l'eau bouillante"
      needs: [boil]
      uses: [oeufs]
      time_min: 8
      attended: false
    - id: laver-herbes
      action: "Pendant ce temps : laver les herbes et les sécher soigneusement, à l'essoreuse par exemple"
      needs: []
      uses: [herbes-fraiches]
      time_min: 2
      parallel_with: cuire-oeufs
      kid: {age_min_months: 30, task: "tourner l'essoreuse à salade"}
    - id: creme-rose
      action: "Hacher ensemble la moitié du chèvre et la betterave, avec la moitié de l'huile, sel et poivre : c'est la crème rose"
      astuce: "Au mixeur, par brèves impulsions seulement, pour garder de petits morceaux croquants : mixé trop longtemps, le chèvre se liquéfie et c'est irrécupérable."
      needs: [chop-coarse]
      uses: [chevre-frais, betterave, huile-olive, sel, poivre]
      time_min: 2
      parallel_with: cuire-oeufs
    - id: creme-verte
      action: "Faire de même avec l'autre moitié du chèvre, le reste de l'huile et les herbes : c'est la crème verte"
      needs: [chop-coarse]
      uses: []
      time_min: 2
      parallel_with: cuire-oeufs
    - id: ecaler
      action: "Écaler les œufs ; laver les radis et leur couper la queue"
      needs: []
      uses: [radis]
      time_min: 3
      kid: {age_min_months: 36, task: "écaler les œufs durs"}
    - id: dresser
      action: "Poser sur la table les deux tartinades, les radis, les œufs et le pain tranché : chacun compose ses tartines"
      needs: []
      uses: [pain-levain]
      time_min: 2
      kid: {age_min_months: 24, task: "porter les bols de tartinade sur la table"}

  # Le chèvre est salé dans les deux tartinades ; l'œuf dur, lui, ne l'est
  # jamais : c'est la part qu'on peut donner telle quelle.
  baby_portion:
    take: "un demi-œuf dur"
    prep: "écrasé à la fourchette, avec un peu de pain en mouillette"
    needs: []
    depuis: [ecaler]

  plan_b: []                # dix minutes, dont huit de cuisson des œufs
