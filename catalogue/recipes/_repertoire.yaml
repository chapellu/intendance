# ---------------------------------------------------------------------------
# RÉPERTOIRE — saisie en vrac, « niveau plan »
#
# À CORRIGER PAR L'UTILISATEUR. Les plats ci-dessous sont une amorce : ceux que
# #29 nomme explicitement (bolognaise, fajitas, gnocchis) plus des classiques
# plausibles pour ce foyer. Les quantités et les compositions sont des
# hypothèses, pas votre façon de faire.
#
# LA DÉCOUVERTE QUI JUSTIFIE CE FICHIER : pour *planifier* et *faire les
# courses*, on n'a pas besoin de la recette. Il faut le titre, le temps, les
# ingrédients et les apports. Les étapes, le plan B, les tâches enfants et la
# portion bébé ne servent qu'au moment de cuisiner. Un plat peut donc entrer
# dans le catalogue en trente secondes, à « niveau plan », et être complété
# plus tard — c'est la seule façon d'atteindre les trente plats sans lesquels
# le choix ne veut rien dire.
#
# `apports` porte les deux critères demandés :
#   proteine / feculent / legumes  → compléter correctement les apports
#   profil / origine               → varier les plaisirs
# ---------------------------------------------------------------------------

recipes:
  - id: sauce-bolognaise
    title: Sauce bolognaise
    yields: {portions_eq: 6}
    time_min_total: 60
    apports:
      proteine: viande-rouge
      feculent: aucun
      legumes: [solanacee, allium, racine]
      profil: mijote
      origine: italien
    ingredients:
      - {id: boeuf-hache, name: bœuf haché, qty: 500, unit: g}
      - {id: tomates-pelees, name: tomates pelées en conserve, qty: 800, unit: g}
      - {id: carottes, name: carottes, qty: 2, unit: pièce}
      - {id: oignon, name: oignon, qty: 2, unit: pièce}
      - {id: ail, name: ail, qty: 2, unit: gousse}
      - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
      - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    steps:
      - id: tailler
        action: "Émincer les oignons et l'ail, tailler les carottes en petits dés"
        astuce: "Les dés de carotte plus petits que l'oignon : la carotte est dure et met deux fois plus longtemps à fondre."
        needs: [chop-coarse]
        uses: [oignon, ail, carottes]
        time_min: 8
      - id: suer
        action: "Chauffer l'huile à la cocotte, y faire blondir oignons et ail"
        astuce: "Blonds, pas dorés : l'ail qui brunit rendra toute la sauce amère, et elle a encore quarante minutes de cuisson devant elle."
        needs: [simmer-large]
        uses: [huile-olive]
        time_min: 3
      - id: revenir
        action: "Ajouter les carottes, puis le bœuf haché en l'écrasant à la cuillère jusqu'à ce qu'il perde sa couleur"
        astuce: "L'écraser tant qu'il est cru : une fois saisi en blocs, il ne se défait plus et la sauce reste grumeleuse."
        needs: [simmer-large]
        uses: [boeuf-hache]
        time_min: 7
      - id: tomates
        action: "Verser les tomates pelées, les écraser à la cuillère et porter à frémissement"
        needs: [simmer-large]
        uses: [tomates-pelees]
        time_min: 3
      - id: mijoter
        action: "Laisser mijoter à découvert"
        uses: []
        astuce: "À découvert, et c'est tout l'enjeu : c'est en réduisant qu'elle devient une sauce. Couverte, elle reste une soupe de tomate."
        needs: [simmer-large]
        time_min: 37
        attended: false
      - id: saler
        action: "Goûter et saler en fin de cuisson"
        astuce: "Jamais au début : la sauce réduit de moitié et le sel, lui, ne réduit pas."
        needs: []
        uses: [sel]
        time_min: 2
    emits:
      - kind: base
        type: sauce-bolognaise
        qty_band: 2-repas
        # 500 g de bœuf + 800 g de tomates, réduits : ~1400 g de sauce. Les
        # pâtes en réclament 500 et les lasagnes 700 — un lot couvre les deux,
        # ce que le modèle ne pouvait pas dire tant qu'il comptait en jetons.
        qty: {amount: 1400, unit: g}
        keeps: {frigo_days: 3, congelo: true}

  - id: pates-bolognaise
    title: Pâtes à la bolognaise
    yields: {portions_eq: 4}
    time_min_total: 15
    apports:
      proteine: viande-rouge
      feculent: pates
      legumes: [solanacee]
      profil: rapide
      origine: italien
    accepts:
      - type: sauce-bolognaise
        qty: {amount: 500, unit: g}
        required: true
        fallback_recipe: sauce-bolognaise
    sans_reste:
      temps_min: 45
      ingredients:
        - {id: boeuf-hache, name: bœuf haché, qty: 400, unit: g}
        - {id: tomates-pelees, name: tomates pelées en conserve, qty: 400, unit: g}
        - {id: oignon, name: oignon, qty: 1, unit: pièce}
    ingredients:
      - {id: sauce-bolognaise-ing, name: sauce bolognaise, qty: 500, unit: g, from_accepts: true}
      - {id: pates, name: "pâtes longues (spaghetti, linguine)", qty: 350, unit: g}
      - {id: fromage-rape, name: parmesan ou comté râpé, qty: 60, unit: g}
    steps:
      - id: eau
        action: "Porter une grande casserole d'eau salée à ébullition"
        astuce: "Salée comme l'eau de mer, et salée MAINTENANT : c'est le seul moment où les pâtes peuvent prendre du sel."
        needs: [boil]
        uses: []
        time_min: 6
        attended: false
      - id: rechauffer-sauce
        action: "Pendant que l'eau chauffe : réchauffer la sauce bolognaise à feu doux, à couvert"
        astuce: "À couvert et doux : une sauce qui rebout réduit une seconde fois et devient pâteuse."
        needs: [simmer]
        uses: [sauce-bolognaise-ing]
        time_min: 8
        parallel_with: "eau"
      - id: cuire-pates
        action: "Cuire les pâtes le temps indiqué sur le paquet, égoutter en gardant une louche d'eau de cuisson"
        astuce: "Prélever la louche AVANT d'égoutter : c'est le geste qu'on oublie, et il n'a pas de rattrapage."
        needs: [boil]
        uses: [pates]
        time_min: 8
      - id: servir
        action: "Mêler les pâtes à la sauce hors du feu, servir avec le fromage râpé"
        astuce: "Un fond d'eau de cuisson si la sauce est trop épaisse : son amidon la lie, là où l'eau claire la délave."
        needs: []
        uses: [fromage-rape]
        time_min: 1
  - id: lasagnes
    title: Lasagnes
    yields: {portions_eq: 6}
    time_min_total: 50
    apports:
      proteine: viande-rouge
      feculent: pates
      legumes: [solanacee]
      profil: four
      origine: italien
    accepts:
      - type: sauce-bolognaise
        qty: {amount: 700, unit: g}
        required: true
        fallback_recipe: sauce-bolognaise
    sans_reste:
      temps_min: 45
      ingredients:
        - {id: boeuf-hache, name: bœuf haché, qty: 500, unit: g}
        - {id: tomates-pelees, name: tomates pelées en conserve, qty: 600, unit: g}
        - {id: oignon, name: oignon, qty: 2, unit: pièce}
    ingredients:
      - {id: sauce-bolognaise-ing, name: sauce bolognaise, qty: 700, unit: g, from_accepts: true}
      - {id: pates-lasagne, name: plaques à lasagne, qty: 250, unit: g}
      - {id: lait, name: lait, qty: 50, unit: cl}
      - {id: farine, name: farine, qty: 4, unit: c. à s.}
      - {id: fromage-rape, name: comté râpé, qty: 100, unit: g}
    steps:
      - id: prechauffer
        action: "Préchauffer le four à 200 °C"
        needs: [bake]
        uses: []
        time_min: 1
        attended: false
      - id: bechamel
        action: "Délayer la farine dans le lait FROID au fouet, puis chauffer à feu moyen sans cesser de remuer jusqu'à ce que la sauce nappe la cuillère"
        astuce: "À froid, la farine ne fait pas de grumeaux — c'est toute la raison de commencer par le lait froid plutôt que par un roux."
        needs: [simmer]
        uses: [farine, lait]
        time_min: 9
      - id: monter
        action: "Monter le plat : une louche de bolognaise au fond, une couche de plaques, de la béchamel, et recommencer en finissant par la béchamel"
        astuce: "Les plaques du dessus ne doivent jamais rester à sec : c'est là qu'elles restent dures."
        needs: [gratin-vessel]
        uses: [sauce-bolognaise-ing, pates-lasagne]
        time_min: 10
      - id: enfourner
        action: "Couvrir de comté râpé et enfourner à 200 °C"
        astuce: "Prêtes quand le dessus est doré ET qu'un couteau traverse les plaques sans résistance — la couleur seule ment."
        needs: [gratin]
        uses: [fromage-rape]
        time_min: 30
        attended: false
    emits:
      - kind: reste-plat
        type: lasagnes
        qty_band: lunchbox
        keeps: {frigo_days: 3, congelo: true}

  - id: gnocchis-poelees
    title: Gnocchis poêlés aux légumes
    yields: {portions_eq: 4}
    time_min_total: 25
    apports:
      proteine: fromage
      feculent: pommes-de-terre
      legumes: [cucurbitacee, allium]
      profil: poele
      origine: italien
    ingredients:
      - {id: gnocchis, name: gnocchis à poêler, qty: 500, unit: g}
      - {id: courgettes, name: courgettes, qty: 2, unit: pièce}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: fromage-rape, name: parmesan râpé, qty: 60, unit: g}
      - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
    steps:
      - id: tailler
        action: "Émincer l'oignon, tailler les courgettes en demi-rondelles"
        needs: []
        time_min: 6
        uses: [oignon, courgettes]
      - id: poeler-legumes
        action: "Chauffer l'huile dans la sauteuse, faire blondir l'oignon, ajouter les courgettes et les laisser colorer"
        astuce: "Sans trop remuer : une courgette qu'on retourne sans arrêt rend son eau et bout au lieu de dorer."
        needs: [pan-fry]
        uses: [huile-olive]
        time_min: 12
      - id: poeler-gnocchis
        action: "Ajouter les gnocchis CRUS dans la poêle avec les légumes et les faire dorer sur toutes leurs faces"
        astuce: "Ceux à poêler ne passent pas par l'eau bouillante — c'est tout leur intérêt, et les y passer les rend collants."
        needs: [pan-fry]
        uses: [gnocchis]
        time_min: 6
      - id: parmesan
        action: "Hors du feu, parsemer de parmesan et laisser fondre une minute avant de servir"
        needs: []
        time_min: 1
        uses: [fromage-rape]

  - id: poulet-roti
    title: Poulet rôti et pommes de terre
    yields: {portions_eq: 6}
    # Bâti sur UN poulet entier : ce lot ne se cuisine qu'en multiples
    # entiers. Rien ne le devine — « 1 pièce » qualifie aussi un oignon.
    lot_entier: true
    # Mais un poulet a un CALIBRE. Le geste réel devant 300 g manquants n'est pas
    # d'en rôtir deux, c'est d'en prendre un plus gros — et un poulet rôti donne
    # déjà plusieurs repas : le dîner, la chair effilochée, la carcasse. Le lot
    # reste indivisible ; c'est sa taille qui a du jeu.
    lot_calibre:
      facteur_max: 1.6      # ~1,3 kg par défaut, jusqu'à ~2 kg chez le volailler
      note: "prendre un poulet plus gros plutôt que d'en rôtir deux"
    time_min_total: 80
    apports:
      proteine: viande-blanche
      feculent: pommes-de-terre
      legumes: [allium, racine]
      profil: four
      origine: francais
    ingredients:
      - {id: poulet, name: poulet fermier entier, qty: 1, unit: pièce}
      - {id: pommes-de-terre, name: pommes de terre, qty: 1, unit: kg}
      - {id: oignon, name: oignon, qty: 2, unit: pièce}
      - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
      - {id: thym, name: thym, qty: 1, unit: c. à c., seasoning: true}
    steps:
      - id: prechauffer
        action: "Préchauffer le four à 200 °C"
        needs: [bake]
        time_min: 2
        attended: false
        uses: []
      - id: preparer-poulet
        action: "Frotter le poulet d'huile d'olive, le parsemer de thym, le poser dans le plat cuisses vers le haut"
        needs: []
        time_min: 3
        uses: [poulet, huile-olive, thym]
      - id: legumes-autour
        action: "Pommes de terre en gros quartiers et oignons en demi-lunes, disposés autour du poulet"
        astuce: "Autour et pas dessous : ils cuisent dans le gras qui tombe, et sous le poulet ils cuiraient à la vapeur."
        needs: []
        uses: [pommes-de-terre, oignon]
        time_min: 10
      - id: rotir
        action: "Enfourner à 200 °C, arroser du jus à mi-cuisson et remuer les pommes de terre"
        astuce: "Cuit quand la cuisse se détache et que le jus qui sort est clair. Rose, il faut prolonger — le four ne dessèche pas un poulet arrosé."
        needs: [bake]
        uses: []
        time_min: 65
        attended: false
    emits:
      - kind: base
        type: poulet-cuit
        qty_band: 2-repas
        qty: {amount: 500, unit: g}     # ce qu'on détache d'un poulet une fois servi
        keeps: {frigo_days: 3, congelo: true}
      - kind: base
        type: carcasse-volaille
        qty_band: 1-repas
        qty: {amount: 1, unit: pièce}   # une carcasse, et il n'y en a qu'une
        keeps: {frigo_days: 2}

  - id: fajitas-poulet
    title: Fajitas au poulet
    yields: {portions_eq: 4}
    time_min_total: 25
    apports:
      proteine: viande-blanche
      feculent: pain
      legumes: [solanacee, allium]
      profil: poele
      origine: mexicain
    accepts:
      - type: poulet-cuit
        qty: {amount: 400, unit: g}
        required: false
        fallback_recipe: poulet-roti
    sans_reste:
      temps_min: 15
      ingredients:
        - {id: poulet-filets, name: filets de poulet, qty: 400, unit: g}
    ingredients:
      - {id: poulet-cuit-ing, name: poulet cuit effiloché, qty: 400, unit: g, from_accepts: true}
      - {id: tortillas, name: tortillas de blé, qty: 8, unit: pièce}
      - {id: poivron, name: poivrons, qty: 2, unit: pièce}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: creme, name: crème fraîche, qty: 10, unit: cl}
      - {id: fromage-rape, name: fromage râpé, qty: 80, unit: g}
    steps:
      - id: tailler
        action: "Poivrons et oignon en lanières"
        needs: []
        time_min: 8
        uses: [poivron, oignon]
      - id: poeler
        action: "Saisir les lanières à feu vif dans la sauteuse, sans les noyer"
        astuce: "Elles doivent rester croquantes : à feu doux, ou en trop grande quantité, elles rendent leur eau et bouillent."
        needs: [pan-fry]
        uses: []
        time_min: 10
      - id: tiedir-tortillas
        action: "Pendant que les légumes saisissent : tiédir les tortillas, à la poêle sèche ou au four éteint encore chaud"
        needs: [pan-fry]
        time_min: 5
        parallel_with: poeler
        uses: [tortillas]
      - id: rechauffer-poulet
        action: "Ajouter le poulet effiloché, juste le temps de le réchauffer"
        astuce: "Il est déjà cuit : le repasser vraiment à la poêle le dessèche."
        needs: [pan-fry]
        uses: [poulet-cuit-ing]
        time_min: 4
      - id: servir
        action: "Poser la poêle, la crème et le fromage râpé sur la table"
        astuce: "Chacun garnit sa tortilla : ce plat se finit à table, et garni en cuisine il arrive mou."
        needs: []
        uses: [creme, fromage-rape]
        time_min: 3
  - id: soupe-de-poule
    title: Soupe de poule aux vermicelles
    yields: {portions_eq: 4}
    time_min_total: 45
    apports:
      proteine: viande-blanche
      feculent: pates
      legumes: [racine, allium]
      profil: soupe
      origine: francais
    accepts:
      - type: carcasse-volaille
        qty: {amount: 1, unit: pièce}
        required: true
        fallback_recipe: poulet-roti
    sans_reste:
      temps_min: 10
      ingredients:
        - {id: bouillon-volaille, name: bouillon de volaille, qty: 1, unit: pièce}
        - {id: poulet-filets, name: filets de poulet, qty: 200, unit: g}
    ingredients:
      - {id: carcasse-ing, name: carcasse de volaille, qty: 1, unit: pièce, from_accepts: true}
      - {id: carottes, name: carottes, qty: 3, unit: pièce}
      - {id: poireau, name: poireau, qty: 1, unit: pièce}
      - {id: vermicelles, name: vermicelles, qty: 100, unit: g}
    steps:
      - id: bouillon
        action: "Couvrir la carcasse d'eau FROIDE à la cocotte, porter à frémissement et laisser tirer à petits bouillons, sans couvrir complètement"
        astuce: "L'eau froide au départ, c'est ce qui fait la différence : à l'eau chaude, la carcasse se referme et garde son goût."
        needs: [simmer-large]
        uses: [carcasse-ing]
        time_min: 30
        attended: false
      - id: legumes
        action: "Pendant que le bouillon tire : carottes en rondelles, poireau en tronçons"
        needs: []
        time_min: 8
        parallel_with: bouillon
        uses: [carottes, poireau]
      - id: filtrer
        action: "Retirer la carcasse, filtrer le bouillon, récupérer la chair qui se détache et la remettre dedans"
        needs: []
        time_min: 5
        uses: []
      - id: cuire-legumes
        action: "Remettre le bouillon à frémir avec les légumes"
        needs: [simmer-large]
        time_min: 6
        uses: []
      - id: vermicelles
        action: "Jeter les vermicelles dans le bouillon frémissant et compter le temps du paquet"
        astuce: "Pas une minute de plus : ils continuent de gonfler dans l'assiette."
        needs: [simmer-large]
        uses: [vermicelles]
        time_min: 4
  - id: curry-pois-chiches
    title: Curry de pois chiches au lait de coco
    yields: {portions_eq: 4}
    time_min_total: 30
    apports:
      proteine: legumineuse
      feculent: riz
      legumes: [solanacee, allium]
      profil: mijote
      origine: indien
    ingredients:
      - {id: pois-chiches, name: pois chiches cuits (bocal), qty: 500, unit: g}
      - {id: lait-coco, name: lait de coco, qty: 40, unit: cl}
      - {id: tomates-pelees, name: tomates pelées en conserve, qty: 400, unit: g}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: riz, name: riz basmati, qty: 250, unit: g}
      - {id: curry, name: curry doux en poudre, qty: 2, unit: c. à c., seasoning: true}
    steps:
      - id: riz
        action: "Mettre le riz à cuire"
        astuce: "C'est lui qui donne le tempo du reste : tout ce qui suit se cale sur son minuteur."
        needs: [boil]
        uses: [riz]
        time_min: 15
        attended: false
        charge_partielle: true
      - id: oignon
        action: "Pendant la cuisson du riz : émincer l'oignon et le faire revenir à la sauteuse"
        needs: [pan-fry]
        uses: [oignon]
        time_min: 6
        parallel_with: "riz"
      - id: curry
        action: "Ajouter le curry et le laisser griller quelques secondes"
        astuce: "C'est au contact du gras chaud qu'il libère son parfum, pas dans la sauce — jeté dans les tomates, il reste poudreux."
        needs: [pan-fry]
        uses: [curry]
        time_min: 2
      - id: mijoter
        action: "Verser les tomates pelées et le lait de coco, laisser réduire à feu moyen"
        needs: [simmer]
        time_min: 10
        uses: [tomates-pelees, lait-coco]
      - id: pois-chiches
        action: "Ajouter les pois chiches égouttés et rincés, les réchauffer dans la sauce"
        astuce: "Rincés, vraiment : l'eau de conserve est saumâtre et se sent dans toute la sauce."
        needs: [simmer]
        uses: [pois-chiches]
        time_min: 5
    emits:
      - kind: reste-plat
        type: curry-pois-chiches
        qty_band: lunchbox
        keeps: {frigo_days: 3, congelo: true}

  - id: saumon-riz-brocoli
    title: Pavé de saumon, riz et brocoli
    yields: {portions_eq: 4}
    time_min_total: 25
    apports:
      proteine: poisson
      feculent: riz
      legumes: [crucifere]
      profil: poele
      origine: francais
    ingredients:
      - {id: saumon, name: pavés de saumon, qty: 4, unit: pièce}
      - {id: riz, name: riz, qty: 250, unit: g}
      - {id: brocoli, name: brocoli, qty: 1, unit: pièce}
      - {id: citron, name: citron, qty: 1, unit: pièce}
    steps:
      - id: riz
        action: "Mettre le riz à cuire"
        needs: [boil]
        time_min: 15
        charge_partielle: true   # la casserole tient cet ingrédient, pas le plat
        attended: false
        uses: [riz]
      - id: brocoli
        action: "Pendant la cuisson du riz : détailler le brocoli en bouquets et le cuire à la vapeur"
        astuce: "Ferme sous la pointe du couteau, pas tendre : il finit de cuire dans l'assiette."
        needs: [steam]
        uses: [brocoli]
        time_min: 10
        charge_partielle: true
        parallel_with: "riz"
      - id: saumon
        action: "Poêler les pavés côté peau d'abord, à feu moyen, et ne les retourner qu'une fois"
        astuce: "Le cœur doit rester rosé. Un saumon cuit à cœur est un saumon sec, et il continue de cuire hors du feu."
        needs: [pan-fry]
        uses: [saumon]
        time_min: 8
      - id: citron
        action: "Servir avec le citron en quartiers, à presser à table"
        needs: []
        time_min: 2
        uses: [citron]

  - id: quiche-poireaux
    title: Quiche aux poireaux
    yields: {portions_eq: 6}
    time_min_total: 55
    apports:
      proteine: oeuf
      feculent: pate-brisee
      legumes: [allium]
      profil: four
