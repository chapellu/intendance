# ---------------------------------------------------------------------------
# RÉPERTOIRE — saisie en vrac, « niveau plan »
#
# À CORRIGER PAR L'UTILISATEUR. Les plats ci-dessous sont une amorce : ceux que
# #29 nomme explicitement (bolognaise, fajitas, gnocchis) plus des classiques
# plausibles pour ce foyer. Les quantités et les compositions sont des
# hypothèses, pas votre façon de faire.
#
# LA DÉCOUVERTE QUI JUSTIFIE CE FICHIER : pour *planifier* et *faire les
# courses*, on n'a pas besoin de la recette. Il faut le titre, le temps, les
# ingrédients et les apports. Les étapes, le plan B, les tâches enfants et la
# portion bébé ne servent qu'au moment de cuisiner. Un plat peut donc entrer
# dans le catalogue en trente secondes, à « niveau plan », et être complété
# plus tard — c'est la seule façon d'atteindre les trente plats sans lesquels
# le choix ne veut rien dire.
#
# `apports` porte les deux critères demandés :
#   proteine / feculent / legumes  → compléter correctement les apports
#   profil / origine               → varier les plaisirs
# ---------------------------------------------------------------------------

recipes:
  - id: sauce-bolognaise
    title: Sauce bolognaise
    yields: {portions_eq: 6}
    time_min_total: 60
    apports:
      proteine: viande-rouge
      feculent: aucun
      legumes: [solanacee, allium, racine]
      profil: mijote
      origine: italien
    ingredients:
      - {id: boeuf-hache, name: bœuf haché, qty: 500, unit: g}
      - {id: tomates-pelees, name: tomates pelées en conserve, qty: 800, unit: g}
      - {id: carottes, name: carottes, qty: 2, unit: pièce}
      - {id: oignon, name: oignon, qty: 2, unit: pièce}
      - {id: ail, name: ail, qty: 2, unit: gousse}
      - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
      - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    steps:
      - id: tailler
        action: "Émincer les oignons et l'ail, tailler les carottes en petits dés"
        needs: [chop-coarse]
        time_min: 8
        uses: [oignon, ail, carottes]
      - id: revenir
        action: "Chauffer l'huile à la cocotte, faire blondir oignons et ail, ajouter les carottes puis le bœuf haché en l'écrasant à la cuillère jusqu'à ce qu'il perde sa couleur"
        needs: [simmer-large]
        time_min: 10
        uses: [huile-olive, boeuf-hache]
      - id: mijoter
        action: "Verser les tomates pelées, les écraser à la cuillère, porter à frémissement puis laisser mijoter à découvert — c'est en réduisant qu'elle devient une sauce"
        needs: [simmer-large]
        time_min: 40
        attended: false
        uses: [tomates-pelees]
      - id: saler
        action: "Goûter et saler en fin de cuisson, jamais au début : la sauce réduit de moitié et le sel, lui, ne réduit pas"
        needs: []
        time_min: 2
        uses: [sel]
    emits:
      - kind: base
        type: sauce-bolognaise
        qty_band: 2-repas
        # 500 g de bœuf + 800 g de tomates, réduits : ~1400 g de sauce. Les
        # pâtes en réclament 500 et les lasagnes 700 — un lot couvre les deux,
        # ce que le modèle ne pouvait pas dire tant qu'il comptait en jetons.
        qty: {amount: 1400, unit: g}
        keeps: {frigo_days: 3, congelo: true}

  - id: pates-bolognaise
    title: Pâtes à la bolognaise
    yields: {portions_eq: 4}
    time_min_total: 15
    apports:
      proteine: viande-rouge
      feculent: pates
      legumes: [solanacee]
      profil: rapide
      origine: italien
    accepts:
      - type: sauce-bolognaise
        qty: {amount: 500, unit: g}
        required: true
        fallback_recipe: sauce-bolognaise
    sans_reste:
      temps_min: 45
      ingredients:
        - {id: boeuf-hache, name: bœuf haché, qty: 400, unit: g}
        - {id: tomates-pelees, name: tomates pelées en conserve, qty: 400, unit: g}
        - {id: oignon, name: oignon, qty: 1, unit: pièce}
    ingredients:
      - {id: sauce-bolognaise-ing, name: sauce bolognaise, qty: 500, unit: g, from_accepts: true}
      - {id: pates, name: "pâtes longues (spaghetti, linguine)", qty: 350, unit: g}
      - {id: fromage-rape, name: parmesan ou comté râpé, qty: 60, unit: g}
    steps:
      - id: eau
        action: "Porter une grande casserole d'eau salée à ébullition"
        needs: [boil]
        time_min: 6
        attended: false
        uses: []
      - id: rechauffer-sauce
        action: "Pendant que l'eau chauffe : réchauffer la sauce bolognaise à feu doux, à couvert"
        needs: [simmer]
        time_min: 8
        parallel_with: eau
        uses: [sauce-bolognaise-ing]
      - id: cuire-pates
        action: "Cuire les pâtes le temps indiqué sur le paquet, égoutter en gardant une louche d'eau de cuisson"
        needs: [boil]
        time_min: 8
        uses: [pates]
      - id: servir
        action: "Mêler les pâtes à la sauce hors du feu — un fond d'eau de cuisson si elle est trop épaisse — et servir avec le fromage râpé"
        needs: []
        time_min: 1
        uses: [fromage-rape]

  - id: lasagnes
    title: Lasagnes
    yields: {portions_eq: 6}
    time_min_total: 50
    apports:
      proteine: viande-rouge
      feculent: pates
      legumes: [solanacee]
      profil: four
      origine: italien
    accepts:
      - type: sauce-bolognaise
        qty: {amount: 700, unit: g}
        required: true
        fallback_recipe: sauce-bolognaise
    sans_reste:
      temps_min: 45
      ingredients:
        - {id: boeuf-hache, name: bœuf haché, qty: 500, unit: g}
        - {id: tomates-pelees, name: tomates pelées en conserve, qty: 600, unit: g}
        - {id: oignon, name: oignon, qty: 2, unit: pièce}
    ingredients:
      - {id: sauce-bolognaise-ing, name: sauce bolognaise, qty: 700, unit: g, from_accepts: true}
      - {id: pates-lasagne, name: plaques à lasagne, qty: 250, unit: g}
      - {id: lait, name: lait, qty: 50, unit: cl}
      - {id: farine, name: farine, qty: 4, unit: c. à s.}
      - {id: fromage-rape, name: comté râpé, qty: 100, unit: g}
    steps:
      - id: bechamel
        action: "Préchauffer le four à 200 °C. Pendant qu'il monte, délayer la farine dans le lait FROID au fouet — à froid elle ne fait pas de grumeaux — puis chauffer à feu moyen sans cesser de remuer jusqu'à ce que la sauce nappe la cuillère"
        needs: [simmer, bake]
        time_min: 10
        uses: [farine, lait]
      - id: monter
        action: "Monter le plat : une louche de bolognaise au fond, une couche de plaques, de la béchamel, et recommencer en finissant par la béchamel — les plaques du dessus ne doivent jamais rester à sec, c'est là qu'elles restent dures"
        needs: [gratin-vessel]
        time_min: 10
        uses: [sauce-bolognaise-ing, pates-lasagne]
      - id: enfourner
        action: "Couvrir de comté râpé et enfourner à 200 °C jusqu'à ce que le dessus soit doré et qu'un couteau traverse les plaques sans résistance"
        needs: [gratin]
        time_min: 30
        attended: false
        uses: [fromage-rape]
    emits:
      - kind: reste-plat
        type: lasagnes
        qty_band: lunchbox
        keeps: {frigo_days: 3, congelo: true}

  - id: gnocchis-poelees
    title: Gnocchis poêlés aux légumes
    yields: {portions_eq: 4}
    time_min_total: 25
    apports:
      proteine: fromage
      feculent: pommes-de-terre
      legumes: [cucurbitacee, allium]
      profil: poele
      origine: italien
    ingredients:
      - {id: gnocchis, name: gnocchis à poêler, qty: 500, unit: g}
      - {id: courgettes, name: courgettes, qty: 2, unit: pièce}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: fromage-rape, name: parmesan râpé, qty: 60, unit: g}
      - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
    steps:
      - id: tailler
        action: "Émincer l'oignon, tailler les courgettes en demi-rondelles"
        needs: []
        time_min: 6
        uses: [oignon, courgettes]
      - id: poeler-legumes
        action: "Chauffer l'huile dans la sauteuse, faire blondir l'oignon, ajouter les courgettes et les laisser colorer sans trop remuer"
        needs: [pan-fry]
        time_min: 12
        uses: [huile-olive]
      - id: poeler-gnocchis
        action: "Ajouter les gnocchis CRUS dans la poêle avec les légumes et les faire dorer sur toutes leurs faces — ceux à poêler ne passent pas par l'eau bouillante, c'est tout leur intérêt"
        needs: [pan-fry]
        time_min: 6
        uses: [gnocchis]
      - id: parmesan
        action: "Hors du feu, parsemer de parmesan et laisser fondre une minute avant de servir"
        needs: []
        time_min: 1
        uses: [fromage-rape]

  - id: poulet-roti
    title: Poulet rôti et pommes de terre
    yields: {portions_eq: 6}
    # Bâti sur UN poulet entier : ce lot ne se cuisine qu'en multiples
    # entiers. Rien ne le devine — « 1 pièce » qualifie aussi un oignon.
    lot_entier: true
    # Mais un poulet a un CALIBRE. Le geste réel devant 300 g manquants n'est pas
    # d'en rôtir deux, c'est d'en prendre un plus gros — et un poulet rôti donne
    # déjà plusieurs repas : le dîner, la chair effilochée, la carcasse. Le lot
    # reste indivisible ; c'est sa taille qui a du jeu.
    lot_calibre:
      facteur_max: 1.6      # ~1,3 kg par défaut, jusqu'à ~2 kg chez le volailler
      note: "prendre un poulet plus gros plutôt que d'en rôtir deux"
    time_min_total: 80
    apports:
      proteine: viande-blanche
      feculent: pommes-de-terre
      legumes: [allium, racine]
      profil: four
      origine: francais
    ingredients:
      - {id: poulet, name: poulet fermier entier, qty: 1, unit: pièce}
      - {id: pommes-de-terre, name: pommes de terre, qty: 1, unit: kg}
      - {id: oignon, name: oignon, qty: 2, unit: pièce}
      - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
      - {id: thym, name: thym, qty: 1, unit: c. à c., seasoning: true}
    steps:
      - id: prechauffer
        action: "Préchauffer le four à 200 °C"
        needs: [bake]
        time_min: 2
        attended: false
        uses: []
      - id: preparer-poulet
        action: "Frotter le poulet d'huile d'olive, le parsemer de thym, le poser dans le plat cuisses vers le haut"
        needs: []
        time_min: 3
        uses: [poulet, huile-olive, thym]
      - id: legumes-autour
        action: "Pommes de terre en gros quartiers et oignons en demi-lunes, disposés autour du poulet : ils cuiront dans le gras qui tombe"
        needs: []
        time_min: 10
        uses: [pommes-de-terre, oignon]
      - id: rotir
        action: "Enfourner à 200 °C, arroser du jus à mi-cuisson et remuer les pommes de terre. Le poulet est cuit quand la cuisse se détache et que le jus qui sort est clair"
        needs: [bake]
        time_min: 65
        attended: false
        uses: []
    emits:
      - kind: base
        type: poulet-cuit
        qty_band: 2-repas
        qty: {amount: 500, unit: g}     # ce qu'on détache d'un poulet une fois servi
        keeps: {frigo_days: 3, congelo: true}
      - kind: base
        type: carcasse-volaille
        qty_band: 1-repas
        qty: {amount: 1, unit: pièce}   # une carcasse, et il n'y en a qu'une
        keeps: {frigo_days: 2}

  - id: fajitas-poulet
    title: Fajitas au poulet
    yields: {portions_eq: 4}
    time_min_total: 25
    apports:
      proteine: viande-blanche
      feculent: pain
      legumes: [solanacee, allium]
      profil: poele
      origine: mexicain
    accepts:
      - type: poulet-cuit
        qty: {amount: 400, unit: g}
        required: false
        fallback_recipe: poulet-roti
    sans_reste:
      temps_min: 15
      ingredients:
        - {id: poulet-filets, name: filets de poulet, qty: 400, unit: g}
    ingredients:
      - {id: poulet-cuit-ing, name: poulet cuit effiloché, qty: 400, unit: g, from_accepts: true}
      - {id: tortillas, name: tortillas de blé, qty: 8, unit: pièce}
      - {id: poivron, name: poivrons, qty: 2, unit: pièce}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: creme, name: crème fraîche, qty: 10, unit: cl}
      - {id: fromage-rape, name: fromage râpé, qty: 80, unit: g}
    steps:
      - id: tailler
        action: "Poivrons et oignon en lanières"
        needs: []
        time_min: 8
        uses: [poivron, oignon]
      - id: poeler
        action: "Saisir les lanières à feu vif dans la sauteuse, sans les noyer : elles doivent rester croquantes"
        needs: [pan-fry]
        time_min: 10
        uses: []
      - id: tiedir-tortillas
        action: "Pendant que les légumes saisissent : tiédir les tortillas, à la poêle sèche ou au four éteint encore chaud"
        needs: [pan-fry]
        time_min: 5
        parallel_with: poeler
        uses: [tortillas]
      - id: rechauffer-poulet
        action: "Ajouter le poulet effiloché juste le temps de le réchauffer — il est déjà cuit, le repasser à la poêle le dessèche"
        needs: [pan-fry]
        time_min: 4
        uses: [poulet-cuit-ing]
      - id: servir
        action: "Poser la poêle, la crème et le fromage râpé sur la table : chacun garnit sa tortilla"
        needs: []
        time_min: 3
        uses: [creme, fromage-rape]

  - id: soupe-de-poule
    title: Soupe de poule aux vermicelles
    yields: {portions_eq: 4}
    time_min_total: 45
    apports:
      proteine: viande-blanche
      feculent: pates
      legumes: [racine, allium]
      profil: soupe
      origine: francais
    accepts:
      - type: carcasse-volaille
        qty: {amount: 1, unit: pièce}
        required: true
        fallback_recipe: poulet-roti
    sans_reste:
      temps_min: 10
      ingredients:
        - {id: bouillon-volaille, name: bouillon de volaille, qty: 1, unit: pièce}
        - {id: poulet-filets, name: filets de poulet, qty: 200, unit: g}
    ingredients:
      - {id: carcasse-ing, name: carcasse de volaille, qty: 1, unit: pièce, from_accepts: true}
      - {id: carottes, name: carottes, qty: 3, unit: pièce}
      - {id: poireau, name: poireau, qty: 1, unit: pièce}
      - {id: vermicelles, name: vermicelles, qty: 100, unit: g}
    steps:
      - id: bouillon
        action: "Couvrir la carcasse d'eau FROIDE à la cocotte, porter à frémissement et laisser tirer à petits bouillons, sans couvrir complètement"
        needs: [simmer-large]
        time_min: 30
        attended: false
        uses: [carcasse-ing]
      - id: legumes
        action: "Pendant que le bouillon tire : carottes en rondelles, poireau en tronçons"
        needs: []
        time_min: 8
        parallel_with: bouillon
        uses: [carottes, poireau]
      - id: filtrer
        action: "Retirer la carcasse, filtrer le bouillon, récupérer la chair qui se détache et la remettre dedans"
        needs: []
        time_min: 5
        uses: []
      - id: cuire-legumes
        action: "Remettre le bouillon à frémir avec les légumes"
        needs: [simmer-large]
        time_min: 6
        uses: []
      - id: vermicelles
        action: "Jeter les vermicelles dans le bouillon frémissant et compter le temps du paquet — pas plus, ils continuent de gonfler dans l'assiette"
        needs: [simmer-large]
        time_min: 4
        uses: [vermicelles]

  - id: curry-pois-chiches
    title: Curry de pois chiches au lait de coco
    yields: {portions_eq: 4}
    time_min_total: 30
    apports:
      proteine: legumineuse
      feculent: riz
      legumes: [solanacee, allium]
      profil: mijote
      origine: indien
    ingredients:
      - {id: pois-chiches, name: pois chiches cuits (bocal), qty: 500, unit: g}
      - {id: lait-coco, name: lait de coco, qty: 40, unit: cl}
      - {id: tomates-pelees, name: tomates pelées en conserve, qty: 400, unit: g}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: riz, name: riz basmati, qty: 250, unit: g}
      - {id: curry, name: curry doux en poudre, qty: 2, unit: c. à c., seasoning: true}
    steps:
      - id: riz
        action: "Mettre le riz à cuire : c'est lui qui donne le tempo du reste"
        needs: [boil]
        time_min: 15
        charge_partielle: true   # la casserole tient cet ingrédient, pas le plat
        attended: false
        uses: [riz]
      - id: oignon
        action: "Pendant la cuisson du riz : émincer l'oignon, le faire revenir à la sauteuse, puis ajouter le curry et le laisser griller quelques secondes — c'est au contact du gras chaud qu'il libère son parfum, pas dans la sauce"
        needs: [pan-fry]
        time_min: 8
        parallel_with: riz
        uses: [oignon, curry]
      - id: mijoter
        action: "Verser les tomates pelées et le lait de coco, laisser réduire à feu moyen"
        needs: [simmer]
        time_min: 10
        uses: [tomates-pelees, lait-coco]
      - id: pois-chiches
        action: "Ajouter les pois chiches égouttés et rincés, les réchauffer dans la sauce sans les faire éclater"
        needs: [simmer]
        time_min: 5
        uses: [pois-chiches]
    emits:
      - kind: reste-plat
        type: curry-pois-chiches
        qty_band: lunchbox
        keeps: {frigo_days: 3, congelo: true}

  - id: saumon-riz-brocoli
    title: Pavé de saumon, riz et brocoli
    yields: {portions_eq: 4}
    time_min_total: 25
    apports:
      proteine: poisson
      feculent: riz
      legumes: [crucifere]
      profil: poele
      origine: francais
    ingredients:
      - {id: saumon, name: pavés de saumon, qty: 4, unit: pièce}
      - {id: riz, name: riz, qty: 250, unit: g}
      - {id: brocoli, name: brocoli, qty: 1, unit: pièce}
      - {id: citron, name: citron, qty: 1, unit: pièce}
    steps:
      - id: riz
        action: "Mettre le riz à cuire"
        needs: [boil]
        time_min: 15
        charge_partielle: true   # la casserole tient cet ingrédient, pas le plat
        attended: false
        uses: [riz]
      - id: brocoli
        action: "Pendant la cuisson du riz : détailler le brocoli en bouquets et le cuire à la vapeur, il doit rester ferme sous la pointe du couteau"
        needs: [steam]
        time_min: 10
        charge_partielle: true   # la casserole tient cet ingrédient, pas le plat
        parallel_with: riz
        uses: [brocoli]
      - id: saumon
        action: "Poêler les pavés côté peau d'abord, à feu moyen, et ne les retourner qu'une fois : le cœur doit rester rosé"
        needs: [pan-fry]
        time_min: 8
        uses: [saumon]
      - id: citron
        action: "Servir avec le citron en quartiers, à presser à table"
        needs: []
        time_min: 2
        uses: [citron]

  - id: quiche-poireaux
    title: Quiche aux poireaux
    yields: {portions_eq: 6}
    time_min_total: 55
    apports:
      proteine: oeuf
      feculent: pate-brisee
      legumes: [allium]
      profil: four
      origine: francais
    ingredients:
      - {id: pate-brisee, name: pâte brisée, qty: 1, unit: pièce}
      - {id: poireau, name: poireaux, qty: 3, unit: pièce}
      - {id: oeufs, name: œufs, qty: 3, unit: pièce}
      - {id: creme, name: crème fraîche, qty: 20, unit: cl}
      - {id: fromage-rape, name: comté râpé, qty: 80, unit: g}
    steps:
      - id: poireaux
        action: "Émincer les poireaux et les faire fondre à la sauteuse à feu doux jusqu'à ce qu'ils rendent leur eau et deviennent tendres. Cette eau-là doit partir dans la poêle, sinon elle part dans la pâte"
        needs: [pan-fry]
        time_min: 12
        uses: [poireau]
      - id: appareil
        action: "Battre les œufs avec la crème, poivrer"
        needs: []
        time_min: 3
        uses: [oeufs, creme]
      - id: foncer
        action: "Préchauffer le four à 180 °C. Foncer le moule avec la pâte brisée et la piquer à la fourchette"
        needs: [bake]
        time_min: 3
        uses: [pate-brisee]
      - id: garnir
        action: "Étaler les poireaux sur la pâte, verser l'appareil par-dessus, couvrir de comté râpé"
        needs: []
        time_min: 2
        uses: [fromage-rape]
      - id: cuire
        action: "Enfourner à 180 °C jusqu'à ce que le centre soit pris — il ne doit plus trembler quand on bouge le moule — et le dessus doré"
        needs: [bake]
        time_min: 35
        attended: false
        uses: []
    emits:
      - kind: reste-plat
        type: quiche
        qty_band: lunchbox
        keeps: {frigo_days: 3, congelo: true}

  - id: chili-sin-carne
    title: Chili sin carne
    yields: {portions_eq: 6}
    time_min_total: 40
    apports:
      proteine: legumineuse
      feculent: riz
      legumes: [solanacee, allium]
      profil: mijote
      origine: mexicain
    ingredients:
      - {id: haricots-rouges, name: haricots rouges cuits, qty: 500, unit: g}
      - {id: tomates-pelees, name: tomates pelées en conserve, qty: 400, unit: g}
      - {id: mais, name: maïs doux, qty: 150, unit: g}
      - {id: poivron, name: poivron, qty: 1, unit: pièce}
      - {id: oignon, name: oignon, qty: 1, unit: pièce}
      - {id: riz, name: riz, qty: 250, unit: g}
    steps:
      - id: riz
        action: "Mettre le riz à cuire"
        needs: [boil]
        time_min: 15
        charge_partielle: true   # la casserole tient cet ingrédient, pas le plat
        attended: false
        uses: [riz]
      - id: revenir
        action: "Pendant la cuisson du riz : oignon et poivron en dés, à faire revenir à la sauteuse jusqu'à ce que le poivron s'assouplisse"
        needs: [chop-coarse, pan-fry]
        time_min: 10
        parallel_with: riz
        uses: [oignon, poivron]
      - id: mijoter
