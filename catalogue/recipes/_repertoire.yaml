      - id: finir
        action: "Ajouter les haricots rouges et le maïs égouttés en fin de cuisson, juste pour les réchauffer : plus longtemps et les haricots se défont"
        needs: [simmer]
        time_min: 7
        uses: [haricots-rouges, mais]
    emits:
      - kind: reste-plat
        type: chili
        qty_band: lunchbox
        keeps: {frigo_days: 3, congelo: true}

