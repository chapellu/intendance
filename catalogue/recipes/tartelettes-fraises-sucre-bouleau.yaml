# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA PÂTE BRISÉE AU SUCRE DE BOULEAU (épeautre complet, margarine, sucre fondu
# dans l'eau tiède), foncée en tartelettes et cuite 35 min ; une crème
# pâtissière sans œuf au lait de soja et à la farine ; fraises posées sur les
# fonds refroidis. Au moins 8 tartelettes.

recipe:
  id: tartelettes-fraises-sucre-bouleau
  title: Tartelettes aux fraises et au sucre de bouleau
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Tartes de saison et petits gâteaux au sucre de bouleau », blog Saines Gourmandises, 18 juillet 2012"
    url: https://saines-gourmandises.fr/connaissez-vous-le-sucre-de-bouleau/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « au moins 8 tartelettes »
    pieces: 8
  lot_entier: true
  time_min_total: 60
  active_min: 25

  apports:
    proteine: aucune
    feculent: pate-brisee
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: "farine complète d'épeautre", qty: 250, unit: g}
    - {id: margarine, name: "margarine bio (ou beurre)", qty: 125, unit: g}
    - {id: eau, name: "eau tiède", qty: 2.5, unit: cl}
    - {id: sel, name: "pincée de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: sucre-bouleau, name: "sucre de bouleau (3 c. à s. + 50 g)", qty: 85, unit: g}
    - {id: lait-soja-vanille, name: "lait de soja", qty: 50, unit: cl}
    - {id: farine-complete, name: "farine complète", qty: 50, unit: g}
    - {id: extrait-vanille, name: "extrait de vanille", qty: 1, unit: c. à s.}
    - {id: fraises, name: "fraises", qty: 500, unit: g}

  steps:
    - id: pate
      action: "Sabler du bout des doigts la margarine et la farine ; fondre 3 c. à s. de sucre et le sel dans l'eau tiède, verser d'un coup, former une boule"
      needs: []
      uses: [farine-epeautre, margarine, eau, sel, sucre-bouleau]
      time_min: 10
    - id: foncer
      action: "Étaler finement, découper des cercles, foncer les moules et cuire 35 min à 180 °C (150 °C si les bords dorent vite)"
      needs: [bake]
      uses: []
      time_min: 40
      attended: false
    - id: creme
      action: "Fouetter à froid le lait, la farine, la vanille et 50 g de sucre, puis porter à ébullition en fouettant jusqu'à épaissir"
      needs: [simmer]
      charge_partielle: true
      uses: [lait-soja-vanille, farine-complete, extrait-vanille]
      time_min: 8
      parallel_with: foncer
    - id: garnir
      action: "Sur les fonds bien refroidis, étaler la crème et poser les fraises"
      needs: []
      uses: [fraises]
      time_min: 8
      kid: {age_min_months: 24, task: "poser les fraises"}

  emits:
    - kind: reste-plat
      type: tartelettes-fraises-sucre-bouleau
      qty_band: 2-repas
      keeps: {frigo_days: 1, congelo: false}

  plan_b: []
