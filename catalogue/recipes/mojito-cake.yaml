# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN BABA DE MOJITO : génoise de quatre œufs fouettés au sucre en trois fois et de
# farine semi-complète, 20 min dans un savarin beurré de 21 cm ; imbibée d'un
# sirop de citron, eau, rhum, agave et menthe hachée au couteau infusé 20 min ;
# chantilly de coco au sucre vanillé, citron et menthe. Se fait la veille.

recipe:
  id: mojito-cake
  title: Mojito cake
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Mojito cake », blog Saines Gourmandises, 27 juin 2024"
    url: https://saines-gourmandises.fr/mojito-cake/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 8 parts »
  lot_entier: true
  time_min_total: 45
  active_min: 25

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: oeufs, name: "œufs", qty: 4, unit: pièce}
    - {id: sucre-bouleau, name: "sucre de bouleau (ou de coco)", qty: 125, unit: g}
    - {id: farine-epeautre, name: "farine semi-complète T110", qty: 125, unit: g}
    - {id: beurre, name: "beurre pour le moule", qty: 10, unit: g}
    - {id: citron, name: "citrons (10 cl de jus + 1 pour décorer)", qty: 4, unit: pièce}
    - {id: eau, name: "eau", qty: 10, unit: cl}
    - {id: rhum, name: "rhum ambré", qty: 4, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 6, unit: cl}
    - {id: menthe, name: "menthe verte bien fraîche (+ pour décorer)", qty: 4, unit: brin}
    - {id: creme-coco, name: "crème de coco bien froide", qty: 40, unit: cl}
    - {id: sucre-vanille, name: "sucre vanillé", qty: 30, unit: g}

  steps:
    - id: sirop
      action: "Préchauffer à 180 °C ; hacher la menthe au couteau, presser les citrons et mêler jus, eau, rhum, agave et menthe ; laisser infuser"
      needs: []
      uses: [citron, eau, rhum, sirop-agave, menthe]
      time_min: 6
      kid: {age_min_months: 36, task: "presser les citrons"}
    - id: baba
      action: "Beurrer un savarin ; fouetter les œufs en ajoutant le sucre en trois fois jusqu'à tripler, y mêler la farine à la spatule et cuire 20 min"
      needs: [bake]
      uses: [beurre, oeufs, sucre-bouleau, farine-epeautre]
      time_min: 30
      attended: false
    - id: finir
      action: "Démouler le baba dans un plat creux, l'imbiber généreusement de sirop, le couvrir de chantilly de coco au sucre vanillé et décorer de citron et de menthe"
      needs: []
      uses: [creme-coco, sucre-vanille]
      time_min: 10

  emits:
    - kind: reste-plat
      type: mojito-cake
      qty_band: 3-repas
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
