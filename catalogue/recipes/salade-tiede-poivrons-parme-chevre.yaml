# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# POIVRONS GRILLÉS ET PELÉS, jambon de Parme effiloché, vinaigrette balsamique
# à l'ail et au piment, basilic et chèvre frais, servis tièdes. Une entrée ;
# en version végétale, sans jambon ni fromage.

recipe:
  id: salade-tiede-poivrons-parme-chevre
  title: Salade tiède de poivrons grillés au jambon de Parme, basilic et chèvre frais
  role: entree
  lang: fr
  source:
    author: Marie Chioca
    work: "« Salade tiède de poivrons grillés au jambon de Parme, basilic et chèvre frais », blog Saines Gourmandises, 22 juillet 2011"
    url: https://saines-gourmandises.fr/salade-tiede-de-poivrons-grilles-au-jambon-de-parme-basilic-et-chevre-frais/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 25
  active_min: 15

  apports:
    proteine: fromage
    feculent: aucun
    legumes: [solanacee]
    profil: cru
    origine: italien

  ingredients:
    - {id: poivron, name: beaux poivrons rouges, qty: 4, unit: pièce}
    - {id: jambon-cru, name: tranches très fines de jambon de Parme, qty: 4, unit: tranche}
    - {id: chevre-frais, name: chèvre frais, qty: 100, unit: g}
    - {id: huile-olive, name: huile d'olive vierge extra, qty: 4, unit: c. à s.}
    - {id: vinaigre-balsamique, name: vinaigre balsamique, qty: 2, unit: c. à s.}
    - {id: ail, name: ail, qty: 1, unit: gousse}
    - {id: piment-espelette, name: pointe de piment d'Espelette, qty: 1, unit: pincée, seasoning: true}
    - {id: fleur-de-sel, name: fleur de sel, qty: 1, unit: pincée, seasoning: true}
    - {id: basilic, name: quelques feuilles de basilic, qty: 3, unit: brin}

  steps:
    - id: griller
      action: "Griller les demi-poivrons peau vers le gril une dizaine de minutes, jusqu'à ce que la peau noircisse et se décolle"
      needs: [gratin]
      uses: [poivron]
      time_min: 12
      attended: true
    - id: peler
      action: "Les laisser un peu refroidir, les peler et les mêler au jambon effiloché"
      needs: []
      uses: [jambon-cru]
      time_min: 6
      kid: {age_min_months: 36, task: "effilocher le jambon"}
    - id: servir
      action: "Arroser d'une vinaigrette d'huile, balsamique, ail pressé et piment ; servir tiède avec fleur de sel, basilic émincé et chèvre"
      needs: []
      uses: [huile-olive, vinaigre-balsamique, ail, piment-espelette, fleur-de-sel, basilic, chevre-frais]
      time_min: 4

  emits: []

  plan_b: []
