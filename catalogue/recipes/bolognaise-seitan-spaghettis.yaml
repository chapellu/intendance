# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DU SEITAN « gourmet grill » haché revenu avec deux oignons, puis une grosse boîte
# de tomates pelées égouttées et écrasées à la main ; 10 min de mijotage
# pendant que les spaghettis d'épeautre complet cuisent al dente.

recipe:
  id: bolognaise-seitan-spaghettis
  title: Spaghettis d'épeautre, bolognaise végétale au seitan
  format: pates
  lang: fr
  source:
    author: Marie Chioca
    work: "« Connaissez-vous le seitan ? », blog Saines Gourmandises, 10 mars 2014"
    url: https://saines-gourmandises.fr/seitan-forgeant-quon-devient-forgeron/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 25
  active_min: 15

  apports:
    proteine: tofu-soja
    feculent: pates
    legumes: [allium, solanacee]
    profil: rapide
    origine: italien

  ingredients:
    - {id: pates, name: "spaghettis d'épeautre complet", qty: 350, unit: g}
    - {id: oignon, name: "oignons", qty: 2, unit: pièce}
    - {id: huile-olive, name: "huile d'olive", qty: 4, unit: c. à s.}
    - {id: seitan, name: "seitan", qty: 250, unit: g}
    - {id: tomates-pelees, name: "grosse boîte de tomates pelées", qty: 800, unit: g}
    - {id: sel, name: "sel", qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: pates
      action: "Cuire les spaghettis al dente à l'eau bouillante salée"
      needs: [boil]
      uses: [pates]
      time_min: 12
      attended: false
    - id: sauce
      action: "Revenir les oignons hachés à l'huile, ajouter le seitan haché et saler ; y écraser à la main les tomates égouttées et mijoter 10 min"
      needs: [simmer]
      uses: [oignon, huile-olive, seitan, sel, tomates-pelees]
      time_min: 18
      parallel_with: pates

  emits:
    - kind: reste-plat
      type: bolognaise-seitan-spaghettis
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
