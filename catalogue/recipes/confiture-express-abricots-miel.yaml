# UNE CONFITURE MINUTE À GARDER AU FRAIS : 500 g d'abricots dénoyautés, 2 g
# d'agar-agar, 150 g de miel d'acacia, 10 min à feu doux en remuant. Elle
# accompagne la brioche « phénoménale » du même article.

recipe:
  id: confiture-express-abricots-miel
  title: Confiture « express » d'abricots au miel
  role: base
  creneaux: [petit-dejeuner, gouter]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Une brioche phénoménale à l'épeautre non hybridé (et sa petite confiture miel-abricot) », blog Saines Gourmandises, 16 juin 2015"
    url: https://saines-gourmandises.fr/aboutissement-dune-quete-aujourdhui-tadaaam-je-vous-presente-mesdames-et-messieurs/
