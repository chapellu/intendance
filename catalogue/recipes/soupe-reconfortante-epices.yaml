# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE SOUPE À MORCEAUX : potiron (ou patate douce), carottes, poireau, céleri
# et oignon revenus au beurre avec les épices, à peine mouillés, dix minutes
# d'ébullition ; on mixe tout sauf une écumoire de légumes. Paprika fumé pour
# l'Europe centrale, garam masala ou curry pour l'Inde.

recipe:
  id: soupe-reconfortante-epices
  title: Soupe réconfortante aux épices
  format: soupe
  lang: fr
  source:
    author: Marie Chioca
    work: "« Potimarrons, courges, potirons, citrouilles and Co… rétrospective d'idées recettes », blog Saines Gourmandises, 17 septembre 2026"
    url: https://saines-gourmandises.fr/potimarrons-courges-potirons-citrouilles-and-co-retrospective-didees-recettes-geniaaaaales/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4          # « pour 4 personnes »
  time_min_total: 35        # 15 min de préparation + 20 min de cuisson
  active_min: 20

  apports:
    proteine: aucune
    feculent: aucun
    legumes: [cucurbitacee, racine, allium]
    profil: soupe
    origine: indien

  ingredients:
    - {id: courge, name: potiron ou patate douce, qty: 500, unit: g}
    - {id: carottes, name: carottes, qty: 3, unit: pièce}
    - {id: poireau, name: blanc de poireau, qty: 1, unit: pièce}
    - {id: celeri-rave, name: céleri-rave, qty: 100, unit: g}
    - {id: oignon, name: oignon, qty: 1, unit: pièce}
    - {id: beurre, name: beurre ou ghee, qty: 50, unit: g}
    - {id: persil, name: persil, qty: 4, unit: brin}
    - {id: paprika, name: "paprika fumé, garam masala ou curry", qty: 1, unit: c. à c., seasoning: true}
    - {id: eau, name: eau, qty: 20, unit: cl}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: tailler
      action: "Couper les légumes en petits cubes, le poireau en tranches fines"
      needs: [chop-coarse]
      uses: [courge, carottes, poireau, celeri-rave, oignon]
      time_min: 12
    - id: revenir
      action: "Les faire revenir au beurre avec les épices dans une cocotte jusqu'à ce qu'ils soient tendres"
      needs: [simmer]
      uses: [beurre, paprika]
      time_min: 10
      attended: true
    - id: bouillir
      action: "Mouiller avec l'eau, ajouter le persil, saler, poivrer et bouillir 10 min"
      needs: [simmer]
      uses: [eau, persil, sel, poivre]
      time_min: 10
      attended: false
    - id: mixer
      action: "Retirer quelques légumes à l'écumoire, mixer finement le reste et y remettre les morceaux"
      needs: [blend-smooth]
      uses: []
      time_min: 4

  emits:
    - kind: reste-plat
      type: soupe-reconfortante-epices
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
