# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.
# Encodée le 2026-11-18 sur photo de la page (T192).
#
# LES CROZETS CUISENT COMME UN RISOTTO, dans un mélange d'eau et de vin blanc
# qu'ils boivent ; puis crème et fromage, dix minutes à couvert pour qu'ils
# gonflent, et un passage sous le grill. Le plat du menu type de l'autrice
# (journée 1, alternative à la pizza).
#
# 2 L D'EAU DANS LA LISTE, 1,5 L DANS LES ÉTAPES : « tout ne servira peut-être
# pas ». On encode 1,5 L ; on en rajoute si les crozets ont tout bu.
#
# CROZETS AU BLÉ, MI-SARRASIN OU PUR SARRASIN : au choix.

recipe:
  id: gratin-crozets-vegetarien
  title: Gratin de crozets végétarien
  format: gratin
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 198"
    source_id: chioca-cuisine-bio-quotidien
    page: 198
    saison: hiver
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « pour 6 personnes, au repas de midi avec une salade »
  time_min_total: 40        # en-tête : 10 + 15 min, 10 min de repos, plus le grill
  active_min: 15

  apports:
    proteine: fromage
    feculent: pates
    legumes: [allium]
    profil: four
    origine: francais

  ingredients:
    - {id: crozets, name: "crozets (blé, mi-sarrasin ou sarrasin)", qty: 400, unit: g}
    - {id: tofu-fume, name: tofu fumé, qty: 180, unit: g}
    - {id: oignon, name: oignons, qty: 3, unit: pièce}
    - {id: huile-olive, name: "huile au choix (ou 80 g de beurre)", qty: 4, unit: c. à s., subs: [{id: beurre, name: "beurre (80 g)", ratio: 1.3}]}
    - {id: eau, name: "eau ou bouillon (jusqu'à 2 L, tout ne servira peut-être pas)", qty: 1.5, unit: l}
    - {id: vin-blanc-sec, name: vin blanc sec, qty: 30, unit: cl}
    - {id: tomme-savoie, name: "tomme de Savoie, sans la croûte", qty: 200, unit: g}
    - {id: creme-soja, name: crème de soja, qty: 20, unit: cl}
    - {id: sel, name: sel, qty: 1, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  # « au repas de midi, avec une salade »
  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: tailler
      action: "Couper les oignons en petits cubes et le tofu fumé en fines allumettes"
      needs: []
      uses: [oignon, tofu-fume]
      time_min: 5
    - id: dorer
      action: "Dorer oignons et tofu à l'huile, puis ajouter les crozets et les faire revenir quelques instants"
      needs: [simmer-large]
      uses: [huile-olive, crozets]
      time_min: 6
    - id: mouiller
      action: "Ajouter l'eau et le vin, bien mélanger jusqu'à l'ébullition, puis couvrir et mijoter environ 15 min à petit feu en remuant souvent"
      astuce: "Le temps dépend des crozets : voir le paquet. S'ils ont trop vite tout bu, rajouter un peu d'eau."
      needs: [simmer-large]
      uses: [eau, vin-blanc-sec]
      time_min: 15
      attended: true
    - id: cremer
      action: "Goûter et saler, puis ajouter la moitié du fromage en cubes, la crème et du poivre, mélanger et couvrir 10 min hors du feu"
      needs: []
      uses: [sel, tomme-savoie, creme-soja, poivre]
      time_min: 10
      attended: false
    - id: gratiner
      action: "Transférer dans un plat à gratin, couvrir du reste de fromage et passer quelques instants sous le grill"
      needs: [gratin-vessel, gratin]
      uses: []
      time_min: 5
  # PAS DE PRÉLÈVEMENT BÉBÉ : vin blanc, tofu fumé.

  plan_b:
    - drop: gratiner
      saves_min: 5
      effect: "servir directement de la casserole, avec tout le fromage fondu dedans"
