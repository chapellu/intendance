# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN CURRY 100 % VÉGÉTAL : céleri brossé en tranches, oignons, carotte,
# piment, curry, mijotés 20 min, quelques branches du cœur pour finir, crème de
# coco hors du feu, riz basmati.

recipe:
  id: curry-cremeux-celeri
  title: Curry crémeux de céleri-rave
  format: mijote
  lang: fr
  source:
    author: Marie Chioca
    work: "« Vous faire raffoler du céleri rave ?… chiche ! », blog Saines Gourmandises, 6 mars 2026"
    url: https://saines-gourmandises.fr/vous-faire-raffoler-du-celeri-rave-chiche/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 30
  active_min: 12

  apports:
    proteine: aucune
    feculent: aucun
    legumes: [racine, allium]
    profil: mijote
    origine: indien

  ingredients:
    - {id: celeri-rave, name: beau céleri-rave, qty: 1, unit: pièce}
    - {id: oignon, name: oignons, qty: 3, unit: pièce}
    - {id: carottes, name: carotte, qty: 1, unit: pièce}
    - {id: piment-frais, name: petit piment frais ou séché, qty: 1, unit: pièce, optional: true}
    - {id: beurre, name: "ghee, beurre ou huile d'olive", qty: 30, unit: g}
    - {id: curry, name: curry bien parfumé, qty: 1, unit: c. à c., seasoning: true}
    - {id: creme-coco, name: crème de coco, qty: 10, unit: cl}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}

  avec:
    - {id: riz, name: riz basmati, qty: 300, unit: g}

  steps:
    - id: oignons
      action: "Émincer les oignons et les rissoler au ghee dans une cocotte"
      needs: [simmer-large]
      uses: [oignon, beurre]
      time_min: 6
      attended: true
    - id: mijoter
      action: "Ajouter le céleri brossé en tranches de 1 cm, la carotte en rondelles et le piment en dés ; saler, ajouter le curry, couvrir et mijoter 20 min"
      astuce: "Cinq minutes avant la fin, quelques branches tendres du cœur, ciselées."
      needs: [simmer-large]
      uses: [celeri-rave, carottes, piment-frais, sel, curry]
      time_min: 25
      attended: false
    - id: coco
      action: "Hors du feu, ajouter la crème de coco et servir avec du riz"
      needs: []
      uses: [creme-coco]
      time_min: 2

  emits:
    - kind: reste-plat
      type: curry-cremeux-celeri
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
