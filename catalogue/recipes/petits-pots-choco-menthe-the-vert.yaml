#
# DES POTS DE « TERRE » À LA MENTHE : crème de coco, soja-vanille, agave et
# lécithine bouillis, thé vert infusé 3 min hors du feu, chocolat 70 % et
# huile essentielle de menthe, mixés 5 min ; 4 à 6 h au frais, surface
# « labourée » à la fourchette, cacao, un brin de menthe planté.

recipe:
  id: petits-pots-choco-menthe-the-vert
  title: Petits pots choco-menthe au thé vert
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« 3 desserts au chocolat pour ce week-end… », extrait de « Mes irrésistibles recettes au chocolat », blog Saines Gourmandises, 10 octobre 2014"
    url: https://saines-gourmandises.fr/des-brownies-des-mi-cuits-des-petits-pots-de-creme-mousseuse/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « 4 à 6 petits pots »
  time_min_total: 15
  active_min: 15

  apports:
    proteine: tofu-soja
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: creme-coco, name: "crème de coco liquide", qty: 20, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 4, unit: c. à s.}
    - {id: lecithine-soja, name: "lécithine de soja", qty: 2, unit: c. à c.}
    - {id: lait-soja-vanille, name: "lait de soja vanille", qty: 20, unit: cl}
    - {id: the-vert, name: "sachet de thé vert", qty: 1, unit: pièce}
    - {id: chocolat-noir, name: "chocolat noir 70 %", qty: 100, unit: g}
    - {id: huile-essentielle-menthe, name: "huile essentielle de menthe", qty: 2, unit: pièce}
    - {id: menthe, name: "brins de menthe", qty: 5, unit: brin}
    - {id: cacao, name: "cacao", qty: 1, unit: c. à c.}

  steps:
    - id: infuser
      action: "Porter à ébullition la crème, l'agave, la lécithine et le soja ; hors du feu, infuser le thé 3 min, l'ôter, puis ajouter le chocolat et l'huile essentielle"
      needs: [simmer]
      charge_partielle: true
      uses: [creme-coco, sirop-agave, lecithine-soja, lait-soja-vanille, the-vert, chocolat-noir, huile-essentielle-menthe]
      time_min: 8
    - id: mixer
      action: "Mixer 5 min et verser en petits pots"
      needs: [blend-smooth]
      uses: []
      time_min: 6
      attente_min: 240
      attente_raison: "4 à 6 h au frais"
    - id: servir
      action: "Griffer la surface à la fourchette, poudrer de cacao et planter un brin de menthe"
      needs: []
      uses: [cacao, menthe]
      time_min: 3
      kid: {age_min_months: 30, task: "planter les brins de menthe"}

  emits: []

  plan_b: []
