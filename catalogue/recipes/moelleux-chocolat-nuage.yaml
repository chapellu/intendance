# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DIX MINUTES : crème de coco, jus de pomme, rhum et agave chauffés, chocolat 70 %
# fondu dedans, versé dans farine, levure, sel et vanille avec les œufs et le
# grué ; 25 min dans un moule de 18 cm. La version de Pâques (chantilly au
# matcha et à la menthe, nid de vermicelles chocolatés) est un décor, notée
# en facultatif.

recipe:
  id: moelleux-chocolat-nuage
  title: Moelleux au chocolat « nuage »
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Le moelleux au chocolat nuage et sa version poétique pour Pâques », blog Saines Gourmandises, 17 avril 2025"
    url: https://saines-gourmandises.fr/le-moelleux-au-chocolat-nuage-et-sa-version-poetique-pour-paques/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 8 parts »
  lot_entier: true
  time_min_total: 35
  active_min: 10

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: chocolat-noir, name: "chocolat pâtissier 70 %", qty: 160, unit: g}
    - {id: creme-coco, name: "crème de coco (20 cl + 40 cl pour la version de Pâques)", qty: 60, unit: cl}
    - {id: jus-pomme, name: "jus de pomme", qty: 5, unit: cl}
    - {id: rhum, name: "rhum", qty: 3, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 7, unit: cl}
    - {id: oeufs, name: "œufs", qty: 3, unit: pièce}
    - {id: farine-epeautre, name: "farine T80 à T110", qty: 100, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: fleur-de-sel, name: "pincée de fleur de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: extrait-vanille, name: "bonne pincée de vanille en poudre", qty: 1, unit: pincée}
    - {id: grue-cacao, name: "grué de cacao", qty: 2, unit: c. à s.}
    - {id: sucre-bouleau, name: "sucre de bouleau (version de Pâques)", qty: 55, unit: g, optional: true}
    - {id: the-matcha, name: "thé matcha (version de Pâques)", qty: 1, unit: c. à c., optional: true}

  steps:
    - id: fondre
      action: "Préchauffer à 180 °C et huiler un moule de 18 cm ; chauffer 20 cl de crème de coco, le jus, le rhum et l'agave, et y fondre le chocolat hors du feu"
      needs: [simmer]
      charge_partielle: true
      uses: [jus-pomme, rhum, sirop-agave, chocolat-noir]
      time_min: 6
    - id: pate
      action: "Mêler farine, levure, sel et vanille, y verser le chocolat, les œufs et le grué, mélanger juste assez et cuire 25 min"
      needs: [bake]
      uses: [farine-epeautre, poudre-a-lever, fleur-de-sel, extrait-vanille, oeufs, grue-cacao]
      time_min: 30
      attended: false
    - id: paques
      action: "Au goût, fendre le gâteau froid et le garnir d'une chantilly ferme de crème de coco au sucre de bouleau et au matcha"
      needs: []
      uses: [creme-coco, sucre-bouleau, the-matcha]
      time_min: 10
      attente_min: 120
      attente_raison: "2 h au frais pour la version de Pâques"
      attente_souple: true

  emits:
    - kind: reste-plat
      type: moelleux-chocolat-nuage
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: false}

  plan_b: []
