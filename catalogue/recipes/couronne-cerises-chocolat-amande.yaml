# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN GÂTEAU EN COURONNE DE 23 CM : petit épeautre, son d'avoine, yaourt de soja,
# purée d'amande, lait d'amande, agave, œufs, rhum, vanille et amande amère,
# cerises dénoyautées et pépites de chocolat ; 30 à 35 min. En moule plein, le
# centre cuit mal.

recipe:
  id: couronne-cerises-chocolat-amande
  title: Couronne moelleuse aux cerises, pépites de chocolat et amande
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Deux super gâteaux tout simples et de saison ! », blog Saines Gourmandises, 20 juin 2016"
    url: https://saines-gourmandises.fr/7829/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 9          # « un gâteau de 8 à 10 parts »
  lot_entier: true
  time_min_total: 50
  active_min: 15

  apports:
    proteine: oeuf
    feculent: avoine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: cerises, name: "cerises (375 g dénoyautées)", qty: 450, unit: g}
    - {id: farine-petit-epeautre, name: "farine T110 de petit épeautre", qty: 100, unit: g}
    - {id: son-avoine, name: "son d'avoine", qty: 60, unit: g}
    - {id: yaourt-soja, name: "yaourt de soja", qty: 1, unit: pot}
    - {id: puree-amande-blanche, name: "purée d'amande blanche", qty: 90, unit: g}
    - {id: lait-amande, name: "lait d'amande", qty: 5, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 10, unit: cl}
    - {id: oeufs, name: "œufs moyens", qty: 3, unit: pièce}
    - {id: chocolat-noir, name: "pépites de chocolat", qty: 75, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: rhum, name: "rhum", qty: 1, unit: c. à s.}
    - {id: extrait-vanille, name: "extrait de vanille liquide", qty: 1, unit: c. à s.}
    - {id: extrait-amande-amere, name: "arôme d'amande amère (c. à moka)", qty: 1, unit: pincée}

  steps:
    - id: cerises
      action: "Préchauffer à 180 °C ; dénoyauter les cerises"
      needs: []
      uses: [cerises]
      time_min: 10
      kid: {age_min_months: 48, task: "dénoyauter les cerises, avec un adulte"}
    - id: pate
      action: "Mêler farine, son et levure, puis yaourt, œufs, agave, purée et lait d'amande, rhum et arômes ; ajouter cerises et pépites"
      needs: []
      uses: [farine-petit-epeautre, son-avoine, poudre-a-lever, yaourt-soja, oeufs, sirop-agave, puree-amande-blanche, lait-amande, rhum, extrait-vanille, extrait-amande-amere, chocolat-noir]
      time_min: 6
    - id: cuire
      action: "Verser dans un moule en couronne huilé et cuire 30 à 35 min"
      astuce: "Baisser à 150 °C après 20 min si les bords colorent trop."
      needs: [bake]
      uses: []
      time_min: 33
      attended: false

  emits:
    - kind: reste-plat
      type: couronne-cerises-chocolat-amande
      qty_band: 3-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
