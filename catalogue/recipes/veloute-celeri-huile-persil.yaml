# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# CÉLERI-RAVE ET BLANCS DE POIREAUX, 20 min, mixés sans pomme de terre ; une
# huile de persil mixée à part, que chacun verse dans son assiette.

recipe:
  id: veloute-celeri-huile-persil
  title: Velouté de céleri-rave, huile de persil
  format: soupe
  lang: fr
  source:
    author: Marie Chioca
    work: "« Vous faire raffoler du céleri rave ?… chiche ! », blog Saines Gourmandises, 6 mars 2026"
    url: https://saines-gourmandises.fr/vous-faire-raffoler-du-celeri-rave-chiche/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 30
  active_min: 12

  apports:
    proteine: aucune
    feculent: aucun
    legumes: [racine, allium]
    profil: soupe
    origine: francais

  ingredients:
    - {id: celeri-rave, name: céleri-rave, qty: 600, unit: g}
    - {id: poireau, name: gros poireaux (le blanc), qty: 2, unit: pièce}
    - {id: eau, name: eau pour couvrir, qty: 1, unit: l}
    - {id: persil, name: brins de persil, qty: 20, unit: brin}
    - {id: huile-olive, name: huile d'olive, qty: 4, unit: c. à s.}
    - {id: muscade, name: muscade, qty: 1, unit: pincée, seasoning: true}
    - {id: sel, name: sel, qty: 3, unit: pincée, seasoning: true}
    - {id: poivre-5-baies, name: poivre 5 baies, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: cuire
      action: "Cuire le céleri en gros cubes et le blanc des poireaux émincé, couverts d'eau, salés, poivrés et muscadés, 20 min à couvert"
      astuce: "Le vert des poireaux sert pour un bouillon."
      needs: [simmer]
      uses: [celeri-rave, poireau, eau, sel, poivre-5-baies, muscade]
      time_min: 22
      attended: false
    - id: huile
      action: "Mixer le persil avec l'huile, 4 c. à s. d'eau et un peu de sel, jusqu'à une huile lisse et fluide"
      needs: [blend-small]
      uses: [persil, huile-olive]
      time_min: 4
      parallel_with: cuire
    - id: mixer
      action: "Mixer le velouté et servir avec l'huile de persil à côté"
      needs: [blend-smooth]
      uses: []
      time_min: 4

  emits:
    - kind: reste-plat
      type: veloute-celeri-huile-persil
      qty_band: 1-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
