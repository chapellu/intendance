# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# SIX ŒUFS, 150 G DE CHOCOLAT NOIR fondu au bain-marie dans le café fort et
# l'agave, les jaunes mêlés hors du feu, les blancs montés en neige souple ;
# 2 h au frais. La crème-mousse au tofu soyeux de la même page est la
# recette d'une autre autrice : elle n'est pas reprise.

recipe:
  id: mousse-chocolat-traditionnelle-agave
  title: La « vraie » mousse au chocolat, sans beurre ni crème
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Petite anthologie gourmande (et légère) de la mousse au chocolat bio », blog Saines Gourmandises, 12 juillet 2011"
    url: https://saines-gourmandises.fr/petite-anthologie-gourmande-et-legere-de-la-mousse-au-chocolat-bio/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « 4 à 6 pots »
  lot_entier: true
  time_min_total: 140
  active_min: 15

  apports:
    proteine: oeuf
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: oeufs, name: "œufs", qty: 6, unit: pièce}
    - {id: chocolat-noir, name: "chocolat noir", qty: 150, unit: g}
    - {id: sirop-agave, name: "sirop d'agave", qty: 4, unit: c. à s.}
    - {id: cafe, name: "café fort", qty: 4, unit: c. à s.}

  steps:
    - id: fondre
      action: "Fondre très doucement, au mieux au bain-marie, le chocolat dans le café et l'agave ; hors du feu, y mêler les jaunes"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, cafe, sirop-agave, oeufs]
      time_min: 8
    - id: blancs
      action: "Monter les blancs en neige souple, les incorporer et verser dans les pots"
      needs: []
      uses: []
      time_min: 8
      attente_min: 120
      attente_raison: "au moins 2 h au frais"
      kid: {age_min_months: 36, task: "incorporer les blancs à la spatule"}

  emits:
    - kind: base
      type: mousse-chocolat
      qty_band: 2-repas
      qty: {amount: 1, unit: recette}
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
