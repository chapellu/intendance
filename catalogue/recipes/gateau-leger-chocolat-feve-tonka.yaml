# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE GÉNOISE D'AMANDE À LA TONKA cuite 15 min dans un cercle de 20 cm, une
# mousse épaisse de chocolat 70 % aux éclats de fève de cacao, soja-vanille
# et margarine, allégée des blancs réservés ; 6 à 24 h au frais, cacao et
# petits œufs en chocolat pour Pâques.

recipe:
  id: gateau-leger-chocolat-feve-tonka
  title: Gâteau très léger au chocolat noir et à la fève tonka
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Gâteau très léger au chocolat noir et 2 fèves précieuses », blog Saines Gourmandises, 3 avril 2012"
    url: https://saines-gourmandises.fr/pour-paques-je-veux-que-du-chocolat/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 11          # « un gros gâteau de 10/12 parts »
  lot_entier: true
  time_min_total: 45
  active_min: 30

  apports:
    proteine: oeuf
    feculent: aucun
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: poudre-amande, name: "poudre d'amande blanche", qty: 125, unit: g}
    - {id: oeufs, name: "œufs très frais", qty: 6, unit: pièce}
    - {id: sirop-agave, name: "sirop d'agave", qty: 4, unit: c. à s.}
    - {id: lait-soja-vanille, name: "lait de soja-vanille (3 c. à s. + 20 cl)", qty: 23, unit: cl}
    - {id: feve-tonka, name: "fève tonka", qty: 1, unit: pièce}
    - {id: chocolat-noir, name: "chocolat noir 70 % aux éclats de cacao", qty: 300, unit: g}
    - {id: margarine, name: "margarine bio", qty: 65, unit: g}
    - {id: cacao, name: "cacao amer", qty: 1, unit: c. à s.}
    - {id: oeufs-chocolat, name: "petits œufs en chocolat", qty: 12, unit: pièce, optional: true}

  steps:
    - id: genoise
      action: "Préchauffer à 180 °C ; mêler poudre d'amande, agave, 3 c. à s. de soja-vanille, 3 jaunes et tonka râpée, puis la moitié des blancs montés ; cuire 15 min"
      needs: [bake]
      uses: [poudre-amande, sirop-agave, feve-tonka]
      time_min: 25
    - id: mousse
      action: "Fondre à petit feu chocolat, reste de soja-vanille et margarine ; hors du feu, y fouetter les 3 autres jaunes puis les blancs réservés"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, lait-soja-vanille, margarine, oeufs]
      time_min: 10
      parallel_with: genoise
    - id: monter
      action: "Poser le cercle et la génoise sur le plat, verser la mousse et mettre au frais"
      needs: []
      uses: []
      time_min: 4
      attente_min: 360
      attente_raison: "au moins 6 h au frais, au mieux 24 h"
    - id: decor
      action: "Démouler, poudrer de cacao et décorer de petits œufs"
      needs: []
      uses: [cacao, oeufs-chocolat]
      time_min: 4
      kid: {age_min_months: 24, task: "poser les petits œufs"}

  emits:
    - kind: reste-plat
      type: gateau-leger-chocolat-feve-tonka
      qty_band: 3-repas
      keeps: {frigo_days: 3, congelo: false}

  plan_b: []
