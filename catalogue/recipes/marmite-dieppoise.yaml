# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA MARMITE DIEPPOISE : poissons plats (sole ou limande, turbot ou carrelet),
# saumon, moules et crevettes pochés dans un bouillon de légumes, lié d'un
# roux à la farine de petit épeautre et de crème fraîche ajoutée hors du feu.
# Le poissonnier peut lever les filets.

recipe:
  id: marmite-dieppoise
  title: Marmite dieppoise
  format: mijote
  lang: fr
  source:
    author: Marie Chioca
    work: "« La cuisine des grands classiques (suite), 3 recettes de bons plats du dimanche », blog Saines Gourmandises, 11 septembre 2014"
    url: https://saines-gourmandises.fr/on-veut-des-recettes/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 8 personnes en plat principal »
  time_min_total: 60        # 35 min de préparation + 25 min de cuisson
  active_min: 45

  apports:
    proteine: poisson
    feculent: aucun
    legumes: [allium, champignon, racine]
    profil: mijote
    origine: francais

  ingredients:
    - {id: poisson-blanc, name: "filets de sole ou de limande, et de turbot ou de carrelet", qty: 600, unit: g}
    - {id: saumon, name: pavés de saumon, qty: 300, unit: g}
    - {id: moules, name: moules de bouchot, qty: 600, unit: g}
    - {id: crevettes, name: crevettes, qty: 300, unit: g}
    - {id: poireau, name: poireau, qty: 1, unit: pièce}
    - {id: echalote, name: échalotes, qty: 4, unit: pièce}
    - {id: champignons-paris, name: champignons blancs, qty: 300, unit: g}
    - {id: carottes, name: carotte, qty: 1, unit: pièce}
    - {id: celeri-branche, name: branches de céleri tendre, qty: 2, unit: pièce}
    - {id: vin-blanc-sec, name: bon vin blanc sec, qty: 50, unit: cl}
    - {id: ail, name: ail, qty: 1, unit: gousse}
    - {id: persil, name: persil, qty: 5, unit: brin}
    - {id: eau, name: eau, qty: 3, unit: verre}
    - {id: huile-olive, ref: huile-legumes, name: huile d'olive (légumes), qty: 3, unit: c. à s.}
    - {id: huile-olive, ref: huile-roux, name: huile d'olive (roux), qty: 3, unit: c. à s.}
    - {id: farine-petit-epeautre, name: farine de petit épeautre T70 (c. à s. rases), qty: 3, unit: c. à s.}
    - {id: creme, name: crème fraîche épaisse, qty: 4, unit: c. à s.}
    - {id: laurier, name: feuille de laurier, qty: 1, unit: pièce, seasoning: true}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: poivre, name: poivre du moulin, qty: 3, unit: pincée, seasoning: true}

  avec:
    - {id: riz, name: riz, qty: 400, unit: g}

  steps:
    - id: blondir
      action: "Émincer échalotes et poireau et les faire blondir à l'huile dans la marmite, puis ajouter carotte en brunoise, champignons en tranches et céleri émincé"
      needs: [simmer-large]
      uses: [echalote, poireau, huile-legumes, carottes, champignons-paris, celeri-branche]
      time_min: 12
      attended: true
    - id: suer
      action: "Saler et laisser suer une dizaine de minutes"
      needs: [simmer-large]
      uses: [sel]
      time_min: 10
      attended: false
    - id: coquillages
      action: "Cuire à part les moules et les crevettes dans le vin blanc jusqu'à ouverture des moules"
      needs: [simmer]
      uses: [moules, crevettes, vin-blanc-sec]
      time_min: 8
      parallel_with: suer
      charge_partielle: true   # la casserole ne tient que les coquillages
    - id: bouillon
      action: "Verser le jus filtré sur les légumes avec l'ail écrasé, le persil haché, le laurier et l'eau ; décoquiller les moules et décortiquer les crevettes"
      astuce: "Jeter les moules restées fermées."
      needs: [simmer-large]
      uses: [ail, persil, laurier, eau]
      time_min: 10
    - id: pocher
      action: "Remettre moules et crevettes, puis pocher les filets 7 min dans le bouillon et les retirer délicatement à l'écumoire"
      needs: [simmer-large]
      uses: [poisson-blanc, saumon]
      time_min: 8
      attended: true
    - id: roux
      action: "Blondir la farine dans l'huile, y fouetter peu à peu deux louches de bouillon comme une béchamel, cuire quelques minutes puis ajouter la crème hors du feu"
      astuce: "La crème ne cuit pas : elle garde ainsi ses ferments."
      needs: [simmer]
      uses: [huile-roux, farine-petit-epeautre, creme]
      time_min: 6
      attended: true
      charge_partielle: true   # deux louches de bouillon, pas la marmite
    - id: lier
      action: "Verser la liaison dans la marmite, poivrer généreusement, remettre les filets et servir aussitôt"
      needs: [simmer-large]
      uses: [poivre]
      time_min: 2

  emits:
    - kind: reste-plat
      type: marmite-dieppoise
      qty_band: 2-repas
      keeps: {frigo_days: 1, congelo: false}
      note: "poisson et coquillages : à finir le lendemain"

  plan_b: []
