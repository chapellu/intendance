# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE « TOMME » SANS LAIT : bière blonde douce et agar-agar portés à plus de
# 80 °C avec du tofu soyeux, puis mixés avec tofu lactofermenté, purée de
# cajou, miso, poivron grillé et piment d'Espelette ; moulée et prise au
# frais 6 h. Cinq jours au frais. Le poivron se grille et se pèle (non
# encodé : un poivron grillé en bocal convient).

recipe:
  id: tomme-vegetale-piment-espelette
  title: « Tomme » végétale au piment d'Espelette
  role: accompagnement
  lang: fr
  source:
    author: Marie Chioca
    work: "« Les fromages végétaux fait-maison », extrait de « Cuisiner sans lait », blog Saines Gourmandises, 20 janvier 2016"
    url: https://saines-gourmandises.fr/ca-peut-vraiment-etre-super-bon/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « un fromage de 8 parts »
  lot_entier: true
  time_min_total: 15        # 10 min de préparation + quelques minutes de cuisson
  active_min: 12

  apports:
    proteine: tofu-soja
    feculent: aucun
    legumes: [solanacee]
    profil: cru
    origine: francais

  ingredients:
    - {id: biere-blonde, name: bière blonde ou blanche peu amère, qty: 5, unit: cl}
    - {id: agar-agar, name: agar-agar, qty: 2, unit: g}
    - {id: tofu-lactofermente, name: tofu lactofermenté au tamari, qty: 200, unit: g}
    - {id: tofu-soyeux, name: tofu soyeux bien égoutté, qty: 150, unit: g}
    - {id: puree-cajou, name: purée de cajou, qty: 100, unit: g}
    - {id: miso-blanc, name: miso blanc, qty: 40, unit: g}
    - {id: poivron, name: poivron rouge grillé et pelé, qty: 30, unit: g}
    - {id: piment-espelette, name: piment d'Espelette (c. à c. rase), qty: 1, unit: c. à c., seasoning: true}
    - {id: sel, name: sel, qty: 8, unit: g, seasoning: true}

  steps:
    - id: chauffer
      action: "Délayer à froid l'agar-agar et le sel dans la bière, ajouter le tofu soyeux et compter 30 s d'ébullition en fouettant"
      astuce: "L'ébullition se voit à peine, il y a peu de liquide : l'agar-agar doit passer 80 °C pour prendre."
      needs: [simmer]
      charge_partielle: true   # le récipient ne tient que cette part du plat
      uses: [agar-agar, sel, biere-blonde, tofu-soyeux]
      time_min: 4
      attended: true
    - id: mixer
      action: "Mixer très finement avec le tofu lactofermenté, la purée de cajou, le miso, le poivron et le piment, et mouler dans un récipient huilé"
      needs: [blend-smooth]
      uses: [tofu-lactofermente, puree-cajou, miso-blanc, poivron, piment-espelette]
      time_min: 6
    - id: prendre
      action: "Mettre au frais, puis démouler en passant une lame tout autour"
      astuce: "Un enrobage de paprika le rend plus joli."
      needs: []
      uses: []
      time_min: 2
      attente_min: 360
      attente_raison: "prise au frais d'au moins 6 h"

  emits:
    - kind: base
      type: tomme-vegetale
      qty_band: 3-repas
      keeps: {frigo_days: 5, congelo: false}

  plan_b: []
