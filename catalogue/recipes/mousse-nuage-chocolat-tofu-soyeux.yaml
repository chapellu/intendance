# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA VARIANTE DE MARIE CHIOCA sur la crème-mousse de Valérie Cupillard (recette
# invitée) : deux œufs de plus, les jaunes mixés avec le reste, les blancs
# montés en neige et incorporés à la spatule. Plus aérien ; neuf petits pots.

recipe:
  id: mousse-nuage-chocolat-tofu-soyeux
  title: Mousse « nuage » au chocolat et tofu soyeux
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Petite anthologie gourmande (et légère) de la mousse au chocolat bio », blog Saines Gourmandises, 12 juillet 2011"
    url: https://saines-gourmandises.fr/petite-anthologie-gourmande-et-legere-de-la-mousse-au-chocolat-bio/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « 9 petits pots »
    pieces: 9
  lot_entier: true
  time_min_total: 135
  active_min: 15

  apports:
    proteine: tofu-soja
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: lait-soja-vanille, name: "lait de soja vanille", qty: 10, unit: cl}
    - {id: chocolat-noir, name: "chocolat noir 70 à 85 %", qty: 100, unit: g}
    - {id: sirop-agave, name: "sirop d'agave", qty: 3, unit: c. à s.}
    - {id: tofu-soyeux, name: "tofu soyeux", qty: 400, unit: g}
    - {id: oeufs, name: "œufs bio ultra frais", qty: 2, unit: pièce}

  steps:
    - id: fondre
      action: "Fondre le chocolat dans le lait de soja avec l'agave"
      needs: [simmer]
      charge_partielle: true
      uses: [lait-soja-vanille, chocolat-noir, sirop-agave]
      time_min: 6
    - id: mixer
      action: "Mixer le chocolat chaud avec le tofu soyeux et les jaunes d'œufs"
      needs: [blend-smooth]
      uses: [tofu-soyeux, oeufs]
      time_min: 5
    - id: blancs
      action: "Monter les blancs en neige, les incorporer à la spatule et verser en petits pots"
      needs: []
      uses: []
      time_min: 8
      attente_min: 120
      attente_raison: "au frais avant de servir"
      attente_souple: true
      kid: {age_min_months: 36, task: "incorporer les blancs"}

  emits:
    - kind: reste-plat
      type: mousse-nuage-chocolat-tofu-soyeux
      qty_band: 2-repas
      keeps: {frigo_days: 2, congelo: false}

  plan_b: []
