# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN GÂTEAU D'ENFANT : un gâteau au yaourt à l'orange et au rhum cuit dans un
# cercle de 16 cm, fendu en deux, noyé dans une ganache de chocolat 70 % à la
# crème de coco (le « bain »), trois cochons modelés en pâte d'amande rose,
# entouré de « planches » de spéculoos collées à la ganache, et un ruban.
# Cercle hors inventaire ; rien ne le vérifie.

recipe:
  id: gateau-bain-trois-petits-cochons
  title: Le gâteau d'anniversaire « bain des 3 petits cochons »
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Le gâteau d'anniversaire Bain des 3 petits cochons », blog Saines Gourmandises, 9 janvier 2014"
    url: https://saines-gourmandises.fr/2014-dans-la-tendresse-et-la-bonne-humeur/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « pour 8 parts environ »
  lot_entier: true
  time_min_total: 110
  active_min: 50

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: yaourt-nature, name: "yaourt", qty: 1, unit: pot}
    - {id: farine-epeautre, name: "farine de grand épeautre (3 pots + 200 g bise)", qty: 530, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever", qty: 1, unit: sachet}
    - {id: sucre-complet, name: "sucre de coco (1 pot et demi + 50 + 75 g)", qty: 305, unit: g}
    - {id: oeufs, name: "œufs (3 + 1)", qty: 4, unit: pièce}
    - {id: huile-tournesol, name: "huile neutre (1 pot + 10 cl)", qty: 22, unit: cl}
    - {id: extrait-vanille, name: "extrait de vanille liquide (1 + 1 c. à s.)", qty: 2, unit: c. à s.}
    - {id: huile-essentielle-orange, name: "huile essentielle d'orange douce", qty: 10, unit: pièce, optional: true}
    - {id: rhum, name: "rhum", qty: 1, unit: c. à s., optional: true}
    - {id: creme-coco, name: "crème de coco liquide", qty: 40, unit: cl}
    - {id: chocolat-noir, name: "bon chocolat 70 %", qty: 200, unit: g}
    - {id: huile-coco, name: "huile de coco vierge", qty: 45, unit: g}
    - {id: cannelle, name: "cannelle (c. à s. bombée)", qty: 1, unit: c. à s., seasoning: true}
    - {id: epices-pain-epices, name: "épices à spéculoos", qty: 0.5, unit: c. à s., seasoning: true}
    - {id: cacao, name: "cacao", qty: 1, unit: c. à s.}
    - {id: eau, name: "eau tiède", qty: 2, unit: c. à s.}
    - {id: sel, name: "pincée de sel", qty: 1, unit: pincée, seasoning: true}
    - {id: pate-amande, name: "bloc de pâte d'amande rose", qty: 1, unit: pièce}

  steps:
    - id: cochons
      action: "Modeler les trois petits cochons dans la pâte d'amande : bedons, têtes, groins, oreilles, queues en tire-bouchon"
      needs: []
      uses: [pate-amande]
      time_min: 15
      kid: {age_min_months: 36, task: "modeler les petits cochons"}
    - id: planches
      action: "Préchauffer à 180 °C ; pétrir 200 g de farine, 75 g de sucre, épices, cacao, sel, un œuf, 10 cl d'huile et l'eau ; étaler en bande, prédécouper des planches"
      needs: []
      uses: [cannelle, epices-pain-epices, cacao, sel, eau]
      time_min: 10
    - id: cuire-planches
      action: "Cuire 15 min et laisser refroidir avant de détacher les planches"
      needs: [bake]
      uses: []
      time_min: 15
      attended: false
    - id: gateau
      action: "Mélanger la farine et la levure, puis le yaourt, 3 œufs, le sucre, l'huile, le rhum, l'huile essentielle et la vanille ; cuire 35 min dans un cercle de 16 cm"
      needs: [bake]
      uses: [yaourt-nature, farine-epeautre, poudre-a-lever, sucre-complet, oeufs, huile-tournesol, extrait-vanille, huile-essentielle-orange, rhum]
      time_min: 40
      attended: false
    - id: ganache
      action: "Fondre à feu extrêmement doux la crème de coco, le chocolat, 50 g de sucre, l'huile de coco et la vanille, et mixer"
      needs: [simmer, blend-smooth]
      charge_partielle: true
      uses: [creme-coco, chocolat-noir, huile-coco]
      time_min: 8
    - id: monter
      action: "Fendre le gâteau en deux disques plats ; dans le cercle serré, un disque, la moitié de la ganache, l'autre disque, le reste ; y poser les cochons"
      needs: []
      uses: []
      time_min: 8
      attente_min: 240
      attente_raison: "au moins 4 h au frais"
    - id: finir
      action: "Décercler, coller les planches tout autour d'un point de ganache et nouer un ruban"
      needs: []
      uses: []
      time_min: 8

  emits:
    - kind: reste-plat
      type: gateau-bain-trois-petits-cochons
      qty_band: 3-repas
      keeps: {frigo_days: 3, congelo: false}

  plan_b: []
