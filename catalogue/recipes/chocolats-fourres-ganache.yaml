# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DES COQUES DE CHOCOLAT 85 % TEMPÉRÉ tapissées dans de petits moules, figées
# une heure, garnies d'une ganache au soja-vanille et à l'agave, gardée
# chaude au bain-marie et parfumée tasse par tasse (orange et spéculoos,
# vanille et coco, citron, espresso et noisette, praliné, pistache). Moules
# et thermomètre : hors inventaire.

recipe:
  id: chocolats-fourres-ganache
  title: Petits chocolats fourrés à la ganache « comme les pros »
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Leçon n°4 : petits chocolats fourrés à la ganache comme les pros », blog Saines Gourmandises, 18 décembre 2011"
    url: https://saines-gourmandises.fr/saines-gourmandises-de-noel-suite-et-fin/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 10
  time_min_total: 90
  active_min: 45

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: chocolat-noir, name: "chocolat noir 85 % (300 g coques + 200 g ganache)", qty: 500, unit: g}
    - {id: lait-soja-vanille, name: "lait de soja-vanille", qty: 20, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 5, unit: c. à s.}
    - {id: noisettes, name: "noisettes toastées (au choix)", qty: 30, unit: g, optional: true}
    - {id: puree-noisette, name: "purée de noisette (praliné)", qty: 2, unit: c. à s., optional: true}

  steps:
    - id: coques
      action: "Tempérer 300 g de chocolat et en tapisser généreusement les parois des moules à la petite cuillère"
      needs: [simmer]
      charge_partielle: true
      uses: []
      time_min: 20
      attente_min: 60
      attente_raison: "les coques figent une heure à température ambiante"
    - id: ganache
      action: "Fondre au bain-marie le reste du chocolat avec le soja-vanille et l'agave, fouetter et répartir dans des tasses gardées au chaud, une par parfum"
      needs: [simmer]
      charge_partielle: true
      uses: [chocolat-noir, lait-soja-vanille, sirop-agave, puree-noisette]
      time_min: 10
    - id: garnir
      action: "Garnir les coques de ganache tiède, ajouter noisettes ou éclats et laisser refroidir"
      needs: []
      uses: [noisettes]
      time_min: 15
      kid: {age_min_months: 48, task: "poser une noisette sur chaque chocolat"}

  emits:
    - kind: base
      type: chocolats-fourres-ganache
      qty_band: 3-repas
      keeps: {frigo_days: 7, congelo: false}

  plan_b: []
