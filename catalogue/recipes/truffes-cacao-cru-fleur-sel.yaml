# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA VERSION FONDANTE ET MOINS SUCRÉE : crème de soja chauffée avec vanille et
# agave, beurre de cacao et huile de coco fondus dedans hors du feu, mixés avec
# le cacao cru, la lécithine et la fleur de sel ; même prise et même découpe.
# Dix jours au frais, à sortir 30 min avant.

recipe:
  id: truffes-cacao-cru-fleur-sel
  title: Truffes végétaliennes ultra fondantes, touche de fleur de sel
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Truffes vegan au chocolat cru (2 recettes !) », blog Saines Gourmandises, 2 décembre 2013"
    url: https://saines-gourmandises.fr/jai-teste-pour-vous-et-pour-moi-le-chocolat-cru/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 8          # « une quarantaine de truffes »
    pieces: 40
  lot_entier: true
  time_min_total: 30
  active_min: 25

  apports:
    proteine: aucune
    feculent: aucun
    legumes: []
    profil: cru
    origine: francais

  ingredients:
    - {id: beurre-cacao, name: "beurre de cacao cru", qty: 100, unit: g}
    - {id: huile-coco, name: "huile de coco vierge", qty: 75, unit: g}
    - {id: cacao, name: "poudre de cacao cru (+ pour rouler)", qty: 110, unit: g}
    - {id: creme-soja, name: "crème de soja liquide", qty: 20, unit: cl}
    - {id: sirop-agave, name: "sirop d'agave", qty: 10, unit: cl}
    - {id: gousse-vanille, name: "gousse de vanille", qty: 1, unit: pièce}
    - {id: lecithine-soja, name: "lécithine de soja", qty: 1, unit: c. à s.}
    - {id: fleur-de-sel, name: "pointe de fleur de sel", qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: fondre
      action: "Chauffer doucement la crème avec la vanille grattée et l'agave ; hors du feu, y fondre le beurre de cacao râpé et l'huile de coco"
      needs: [simmer]
      charge_partielle: true
      uses: [creme-soja, gousse-vanille, sirop-agave, beurre-cacao, huile-coco]
      time_min: 8
    - id: mixer
      action: "Mixer plusieurs minutes avec la lécithine, le cacao et la fleur de sel, puis couler dans un petit plat chemisé"
      needs: [blend-small]
      uses: [lecithine-soja, cacao, fleur-de-sel]
      time_min: 6
      attente_min: 720
      attente_raison: "12 h au frais"
    - id: rouler
      action: "Démouler, couper en cubes et les rouler dans le cacao"
      needs: [chop-coarse]
      uses: []
      time_min: 12
      kid: {age_min_months: 30, task: "rouler les truffes dans le cacao"}

  emits:
    - kind: base
      type: truffes-cacao-cru-fleur-sel
      qty_band: 3-repas
      keeps: {frigo_days: 10, congelo: false}

  plan_b: []
