# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# TROIS COUCHES DANS UN CERCLE DE 15 À 20 CM : génoise d'amande sans farine,
# mousse de pêches à l'agar-agar et à la purée d'amande allégée de blancs,
# gelée de fraises. Le cercle est hors inventaire ; rien ne le vérifie.

recipe:
  id: bavarois-fruits-ete
  title: Bavarois tout léger aux fruits d'été
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Bavarois tout léger aux fruits d'été », blog Saines Gourmandises, 31 juillet 2011"
    url: https://saines-gourmandises.fr/bavarois-tout-leger-aux-fruits-dete/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « un gâteau de 6 personnes »
  lot_entier: true
  time_min_total: 50
  active_min: 35

  apports:
    proteine: oeuf
    feculent: aucun
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: poudre-amande, name: "poudre d'amande", qty: 65, unit: g}
    - {id: sirop-agave, name: "sirop d'agave (2 + 6 + 6 c. à s.)", qty: 14, unit: c. à s.}
    - {id: eau-de-vie, name: "eau-de-vie de prune (ou rhum)", qty: 1, unit: c. à s.}
    - {id: oeufs, name: "œufs", qty: 4, unit: pièce}
    - {id: peches, name: "pêches bien mûres", qty: 500, unit: g}
    - {id: agar-agar, name: "agar-agar (2 sachets de 2 g)", qty: 4, unit: g}
    - {id: puree-amande-blanche, name: "purée d'amande blanche", qty: 6, unit: c. à s.}
    - {id: fraises, name: "fraises", qty: 500, unit: g}

  steps:
    - id: genoise
      action: "Préchauffer à 180 °C ; mêler poudre d'amande, 2 jaunes, 2 c. à s. d'agave et l'alcool, incorporer 2 blancs en neige et cuire 10 min dans le cercle"
      needs: [bake]
      uses: [poudre-amande, eau-de-vie]
      time_min: 15
    - id: mousse
      action: "Mixer les pêches en quartiers avec un sachet d'agar-agar et 6 c. à s. d'agave, bouillir 2 min, puis mixer avec la purée d'amande"
      needs: [simmer]
      charge_partielle: true
      uses: [peches, puree-amande-blanche, agar-agar]
      time_min: 8
      parallel_with: genoise
    - id: blancs
      action: "Y fouetter 2 jaunes, incorporer les 2 blancs en neige et verser sur la génoise"
      needs: []
      uses: [oeufs]
      time_min: 6
    - id: gelee
      action: "Pocher les fraises quelques minutes avec l'autre sachet d'agar-agar et le reste d'agave, mixer et couler sur la mousse prise"
      needs: [simmer]
      charge_partielle: true
      uses: [fraises, agar-agar, sirop-agave]
      time_min: 8
      attente_min: 120
      attente_raison: "la mousse prend au frais avant la gelée"

  emits:
    - kind: reste-plat
      type: bavarois-fruits-ete
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: false}

  plan_b: []
