# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UNE GÉNOISE DE BASE AUX ŒUFS ENTIERS FOUETTÉS jusqu'à tripler, à l'agave,
# farine de petit épeautre tamisée ; 35 min à 150 °C dans un moule « agneau »
# beurré (hors inventaire ; un moule à cake fait l'affaire). Deux clous de
# girofle pour les yeux.

recipe:
  id: agneau-paques-genoise
  title: Agneau de Pâques en génoise moelleuse
  creneaux: [gouter, dessert]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Nid douillet façon fraisier + Agneau de Pâques en génoise moelleuse », blog Saines Gourmandises, 10 avril 2014"
    url: https://saines-gourmandises.fr/gourmandises-de-paques-une-genoise-de-base-2-recettes/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « un grand moule agneau (21 × 11 cm) »
  lot_entier: true
  time_min_total: 50
  active_min: 15

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: oeufs, name: "œufs", qty: 4, unit: pièce}
    - {id: sirop-agave, ref: agave-genoise, name: "sirop d'agave (génoise)", qty: 10, unit: cl}
    - {id: farine-petit-epeautre, ref: farine-genoise, name: "farine de petit épeautre T110", qty: 170, unit: g}
    - {id: poudre-a-lever, name: "poudre à lever (demi-paquet)", qty: 0.5, unit: sachet}
    - {id: beurre, name: "beurre ou margarine pour le moule", qty: 10, unit: g}
    - {id: sucre-glace, name: "un peu de sucre glace", qty: 1, unit: c. à s., optional: true}
    - {id: clous-girofle, name: "clous de girofle (les yeux)", qty: 2, unit: pièce, seasoning: true}

  steps:
    - id: fouetter
      action: "Préchauffer à 150 °C et beurrer le moule soigneusement ; fouetter les œufs avec l'agave jusqu'à ce qu'ils moussent, blanchissent et triplent"
      astuce: "Au fouet électrique, plusieurs minutes, en montant la vitesse peu à peu."
      needs: []
      uses: [beurre, oeufs, agave-genoise]
      time_min: 10
    - id: melanger
      action: "Tamiser farine et levure au-dessus et mêler en soulevant à la maryse, puis verser dans le moule"
      needs: []
      uses: [farine-genoise, poudre-a-lever]
      time_min: 4
    - id: cuire
      action: "Cuire 35 min, jusqu'à ce qu'une pique ressorte propre ; laisser refroidir avant d'ouvrir le moule"
      needs: [bake]
      uses: []
      time_min: 35
      attended: false
    - id: decor
      action: "Saupoudrer de sucre glace et planter deux clous de girofle pour les yeux"
      needs: []
      uses: [sucre-glace, clous-girofle]
      time_min: 2
      kid: {age_min_months: 30, task: "planter les yeux"}

  emits:
    - kind: reste-plat
      type: agneau-paques-genoise
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: true}

  plan_b: []
