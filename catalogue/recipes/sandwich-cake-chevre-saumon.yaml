# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# LA SMÖRGÅSTÅRTA : quatre gros blinis d'épeautre et de son d'avoine (pâte
# levée une nuit au frais, cuits dans une poêle de 16 cm), montés avec une
# crème de chèvre frais et de crème de soja lactofermentée au piment, du
# concombre, du saumon et de l'avocat citronné, puis entièrement nappés. La
# pâte donne six blinis : deux restent.

recipe:
  id: sandwich-cake-chevre-saumon
  title: Sandwich-cake au chèvre frais, saumon et piment d'Espelette
  format: tartine
  lang: fr
  source:
    author: Marie Chioca
    work: "« Sandwich-cake au chèvre frais, saumon et piment d'Espelette », blog Saines Gourmandises, 22 juin 2015"
    url: https://saines-gourmandises.fr/smorgastarta/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « un gâteau de 8/10 parts »
  lot_entier: true
  time_min_total: 60        # 35 min de préparation + les poêlées (pâte la veille)
  active_min: 50

  apports:
    proteine: poisson
    feculent: farine
    legumes: [cucurbitacee]
    profil: cru
    origine: francais

  ingredients:
    - {id: eau, name: eau tiède, qty: 50, unit: cl}
    - {id: oeufs, name: œufs, qty: 6, unit: pièce}
    - {id: farine-epeautre, name: farine T130 de grand épeautre, qty: 400, unit: g}
    - {id: son-avoine, name: son d'avoine, qty: 200, unit: g}
    - {id: levure-boulangere, name: levure de boulanger déshydratée, qty: 1, unit: sachet}
    - {id: sel, ref: sel-pate, name: sel (pâte), qty: 2, unit: pincée, seasoning: true}
    - {id: huile-olive, name: huile d'olive pour la poêle, qty: 6, unit: c. à s.}
    - {id: concombre, name: petit concombre, qty: 1, unit: pièce}
    - {id: saumon-fume, name: "saumon (300 g serait mieux)", qty: 150, unit: g}
    - {id: chevre-frais, name: chèvre frais bien égoutté, qty: 400, unit: g}
    - {id: creme-soja, name: crème de soja lactofermentée, qty: 235, unit: g}
    - {id: avocat, name: avocat Hass mûr, qty: 1, unit: pièce}
    - {id: citron, name: citron (jus), qty: 1, unit: pièce}
    - {id: piment-espelette, name: piment d'Espelette (c. à moka rase), qty: 1, unit: pincée, seasoning: true}
    - {id: paprika, name: paprika (c. à c. rase), qty: 1, unit: c. à c., seasoning: true}
    - {id: sel, ref: sel-creme, name: "sel (crème, c. à moka rase)", qty: 1, unit: pincée, seasoning: true}
    - {id: poivre-5-baies, name: poivre 5 baies, qty: 2, unit: pincée, seasoning: true}
    - {id: ciboulette, name: ciboulette pour décorer, qty: 4, unit: brin, optional: true}
    - {id: tomates-cerises, name: tomates cerises pour décorer, qty: 3, unit: pièce, optional: true}

  steps:
    - id: pate
      action: "Fouetter la levure dans l'eau tiède, puis les œufs, la farine, le son et le sel sans grumeaux ; couvrir et mettre au frais"
      needs: []
      uses: [levure-boulangere, eau, oeufs, farine-epeautre, son-avoine, sel-pate]
      time_min: 6
      attente_min: 600
      attente_raison: "la pâte lève une nuit au frais, à préparer la veille au soir"
    - id: blinis
      action: "Cuire des louches et demie de pâte à couvert dans une petite poêle huilée, 3 min à feu très doux puis 1 min 30 de l'autre côté"
      astuce: "Trop épaisse, la pâte se détend d'un peu d'eau tiède. Six blinis, quatre servent."
      needs: [pan-fry]
      uses: [huile-olive]
      time_min: 30
      attended: true
    - id: creme
      action: "Battre au fouet, sans mixer, le chèvre avec la crème de soja, le sel, le piment et le paprika"
      needs: []
      uses: [chevre-frais, creme-soja, sel-creme, piment-espelette, paprika]
      time_min: 4
      parallel_with: blinis
    - id: garniture
      action: "Trancher finement le concombre épluché, l'avocat en lamelles généreusement citronnées"
      needs: [chop-coarse]
      uses: [concombre, avocat, citron]
      time_min: 6
      parallel_with: blinis
    - id: monter
      action: "Empiler les blinis tartinés de crème en alternant concombre et saumon, concombre et avocat, poivrer, puis napper tout le gâteau du reste de crème"
      astuce: "Il y a assez de crème : étaler à la cuillère, lisser à la spatule. Deux heures de repos facilitent la découpe."
      needs: []
      uses: [saumon-fume, poivre-5-baies, ciboulette, tomates-cerises]
      time_min: 10
      kid: {age_min_months: 36, task: "décorer le dessus"}

  emits:
    - kind: reste-plat
      type: blinis-epeautre-son-avoine
      qty_band: 1-repas
      keeps: {frigo_days: 2, congelo: true}
      note: "les deux blinis qui restent"

  plan_b: []
