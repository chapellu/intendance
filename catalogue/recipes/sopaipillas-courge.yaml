# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# DES BEIGNETS CHILIENS À LA COURGE : purée de courge égouttée, farine et
# poudre à lever en pâte souple, refroidie, découpée en disques de 8 à 9 cm et
# frite 2 min. Salés avec un pebre (salsa tomate-oignon-piment), ou sucrés au
# citron, sucre brun et cannelle. L'en-tête ne donne pas de temps de repos :
# la pâte refroidit le temps de chauffer l'huile.

recipe:
  id: sopaipillas-courge
  title: Sopaipillas (beignets chiliens à la courge)
  format: galettes
  lang: fr
  source:
    author: Marie Chioca
    work: "« Potimarrons, courges, potirons, citrouilles and Co… rétrospective d'idées recettes », blog Saines Gourmandises, 17 septembre 2026"
    url: https://saines-gourmandises.fr/potimarrons-courges-potirons-citrouilles-and-co-retrospective-didees-recettes-geniaaaaales/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 5          # « environ 25 sopaipillas, 4 à 6 personnes en plat principal »
    pieces: 25
  time_min_total: 60        # 20 min de préparation + 15 min à l'eau + la friture
  active_min: 40

  apports:
    proteine: aucune
    feculent: farine
    legumes: [cucurbitacee]
    profil: poele
    origine: mexicain

  ingredients:
    - {id: courge, name: "citrouille, courge ou potiron", qty: 500, unit: g}
    - {id: farine-complete, name: farine T80 de blé ou de grand épeautre, qty: 500, unit: g}
    - {id: poudre-a-lever, name: poudre à lever, qty: 1, unit: sachet}
    - {id: sel, name: sel, qty: 2, unit: pincée, seasoning: true}
    - {id: huile-tournesol, name: huile végétale pour la friture, qty: 50, unit: cl}

  avec:
    - {id: salade-verte, name: salade verte, qty: 0.5, unit: pièce}

  steps:
    - id: cuire
      action: "Cuire la courge en gros cubes 15 à 20 min à l'eau bouillante salée"
      needs: [boil]
      uses: [courge, sel]
      time_min: 18
      attended: false
    - id: egoutter
      action: "Égoutter au moins 10 min dans une passoire, puis écraser en purée"
      needs: [puree]
      uses: []
      time_min: 12
    - id: pate
      action: "Y pétrir rapidement la farine mélangée à la levure, jusqu'à une boule souple comme une pâte à pizza, et la laisser refroidir filmée"
      astuce: "Selon la courge, ajouter un peu de farine."
      needs: []
      uses: [farine-complete, poudre-a-lever]
      time_min: 6
      kid: {age_min_months: 30, task: "pétrir la boule de pâte"}
    - id: frire
      action: "Chauffer un bain d'huile dans une sauteuse, découper des disques de 8 à 9 cm et les frire 2 min en les retournant, à peine dorés"
      astuce: "Égoutter sur du papier et servir aussitôt."
      needs: [pan-fry]
      uses: [huile-tournesol]
      time_min: 20
      attended: true

  emits: []

  plan_b: []
