# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN PAIN AUX FRUITS SANS SUCRE AJOUTÉ : pâte très liquide de farine
# d'épeautre, lait, œufs, huile, rhum, vanille et cannelle, fruits séchés
# mélangés et amandes ; levée dans un moule à cake de 30 cm (ou deux petits),
# 1 h à 180 °C. Pétrie à la cuillère, elle peut lever une nuit au frais.

recipe:
  id: fruchtebrot
  title: Früchtebrot sans sucre ajouté
  creneaux: [gouter, petit-dejeuner]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Früchtebrot (Sans sucre ajouté) », blog Saines Gourmandises, 22 juin 2021"
    url: https://saines-gourmandises.fr/fruchtebrot-sans-sucre-ajoute/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 12         # « 15 parts »
  lot_entier: true
  time_min_total: 130       # 10 min + 1 h de pousse + 1 h
  active_min: 15

  apports:
    proteine: oeuf
    feculent: farine
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: farine-epeautre, name: farine T110 de grand épeautre, qty: 500, unit: g}
    - {id: levure-boulangere, name: levure fraîche (20 g), qty: 1, unit: pièce}
    - {id: lait-coco, name: lait au choix (boisson coco), qty: 35, unit: cl}
    - {id: extrait-vanille, name: extrait de vanille, qty: 1, unit: c. à s.}
    - {id: rhum, name: rhum, qty: 3, unit: c. à s.}
    - {id: cannelle, name: cannelle ou épices à gâteau (c. à c. rase), qty: 1, unit: c. à c., seasoning: true}
    - {id: oeufs, name: œufs, qty: 2, unit: pièce}
    - {id: huile-tournesol, name: huile neutre, qty: 15, unit: cl}
    - {id: fruits-secs-melange, name: "fruits séchés mélangés (pomme, raisins, abricots, cranberries…)", qty: 150, unit: g}
    - {id: amandes, name: amandes, qty: 100, unit: g}
    - {id: sel, name: sel fin, qty: 3, unit: g, seasoning: true}

  steps:
    - id: levure
      action: "Tiédir le lait avec la vanille sous 40 °C et y délayer la levure"
      needs: [simmer]
      charge_partielle: true   # le récipient ne tient que cette part du plat
      uses: [lait-coco, extrait-vanille, levure-boulangere]
      time_min: 4
    - id: pate
      action: "Mélanger farine, cannelle et sel, puis les œufs, le lait, le rhum et l'huile ; battre quelques minutes à la cuillère et ajouter fruits et amandes"
      astuce: "La pâte est très liquide : c'est normal."
      needs: []
      uses: [farine-epeautre, cannelle, sel, oeufs, rhum, huile-tournesol, fruits-secs-melange, amandes]
      time_min: 6
      kid: {age_min_months: 30, task: "verser les fruits secs"}
    - id: lever
      action: "Verser dans un long moule à cake huilé et fariné et laisser lever jusqu'à presque doubler"
      needs: []
      uses: []
      time_min: 2
      attente_min: 50
      attente_raison: "pousse au tiède (bien plus vite l'été)"
    - id: cuire
      action: "Enfourner doucement à 180 °C pour 1 h et laisser tiédir avant de démouler"
      needs: [bake]
      uses: []
      time_min: 60
      attended: false

  emits:
    - kind: reste-plat
      type: fruchtebrot
      qty_band: 3-repas
      keeps: {frigo_days: 5, congelo: true}

  plan_b: []
