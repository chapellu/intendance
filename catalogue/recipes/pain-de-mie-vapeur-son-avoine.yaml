# Encodage structuré et reformulé d'une recette de Marie Chioca (blog Saines
# Gourmandises), selon le cadre de licence de la carte #26 : le plat, les
# quantités et le procédé relèvent du savoir-faire non protégeable ; sa prose et
# ses photos ne sont PAS reproduites. Encodée le 2026-11-22 (T196).
#
# UN PAIN DE MIE SANS CROÛTE, CUIT À LA VAPEUR : pâte coulante de farine T110 et
# son d'avoine, versée dans un moule à cake (2,5 cm de marge, il gonfle), posée
# dans le panier vapeur d'un faitout d'eau froide ; il lève pendant que l'eau
# chauffe à feu très doux, puis cuit 1 h 15 sans soulever le couvercle.
# Le moule doit tenir dans le panier de la cocotte : rien ne le vérifie.

recipe:
  id: pain-de-mie-vapeur-son-avoine
  title: Pain de mie « de rêve » cuit à la vapeur
  role: base
  creneaux: [petit-dejeuner, gouter]
  lang: fr
  source:
    author: Marie Chioca
    work: "« Pain de mie de rêve à IG bas », blog Saines Gourmandises, 4 juin 2013"
    url: https://saines-gourmandises.fr/pour-tous-vos-toasts-et-pique-niques-de-quand-yfra-beau/
    source_id: saines-gourmandises-blog
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6          # « un pain de mie de 20 cm »
  lot_entier: true
  time_min_total: 115       # 10 min + la mise en température + 1 h 15
  active_min: 10

  apports:
    proteine: aucune
    feculent: pain
    legumes: []
    profil: mijote
    origine: francais

  ingredients:
    - {id: farine-complete, name: farine de blé T110, qty: 450, unit: g}
    - {id: son-avoine, name: son d'avoine, qty: 150, unit: g}
    - {id: eau, name: eau tiède, qty: 50, unit: cl}
    - {id: sirop-agave, name: sirop d'agave, qty: 1, unit: c. à s.}
    - {id: huile-olive, name: huile d'olive, qty: 2, unit: c. à s.}
    - {id: levure-boulangere, name: levure déshydratée, qty: 1, unit: sachet}
    - {id: sel, name: sel fin (c. à c. légèrement bombée), qty: 1, unit: c. à c., seasoning: true}

  steps:
    - id: pate
      action: "Fouetter la levure dans l'eau tiède jusqu'à mousser, puis mélanger avec la farine, le son, le sel, l'huile et l'agave"
      needs: []
      uses: [levure-boulangere, eau, farine-complete, son-avoine, sel, huile-olive, sirop-agave]
      time_min: 5
    - id: mouler
      action: "Verser dans un moule à cake chemisé en laissant 2,5 cm de marge, et le poser dans le panier vapeur au-dessus d'une bonne quantité d'eau froide"
      needs: [steam]
      uses: []
      time_min: 3
    - id: cuire
      action: "Chauffer à feu très doux, puis compter 1 h 15 à partir de l'ébullition sans jamais soulever le couvercle"
      astuce: "Le pain lève pendant que l'eau chauffe : c'est pour ça que le feu reste très doux."
      needs: [steam]
      uses: []
      time_min: 100
      attended: false
    - id: refroidir
      action: "Démouler aussitôt, ôter le papier et laisser refroidir complètement sur une grille avant de trancher"
      needs: []
      uses: []
      time_min: 2
      attente_min: 90
      attente_raison: "refroidissement complet, à nu sur une grille"

  emits:
    - kind: base
      type: pain-de-mie-vapeur-son-avoine
      qty_band: 3-repas
      keeps: {frigo_days: 4, congelo: true}

  plan_b: []
