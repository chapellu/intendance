# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.
#
# TROISIÈME CONSOMMATEUR DE `pain-rassis`, ET TOUJOURS AUCUN ÉMETTEUR. « 300 g
# de pain complet ou demi-complet (il peut sans souci être un peu rassis) ».
# Après `panzanella-toscana` et les accras p. 178, trois recettes du catalogue
# tournent autour d'un reste que rien ne produit, parce que le pain rassis n'est
# pas la sortie d'un plat : c'est un ingrédient acheté qui a vieilli. Le manque
# n'est plus une hypothèse, c'est un motif.
#
# `plan_b` NE SAIT DESCENDRE, ET L'AUTRICE PROPOSE DE MONTER. Ses VARIANTES
# disent : « avec 5 à 10 minutes de temps en plus, on peut faire revenir un
# oignon, un poireau et une carotte à l'huile d'olive au fond du faitout, et/ou
# faire cuire une céréale rapide dans la soupe ». C'est un plan A+, pas un
# plan B : dix minutes de plus contre un meilleur plat. Le modèle n'a que des
# dégradations — `plan_b` se paie en minutes ÉCONOMISÉES — et rien pour dire
# « si le soir est calme, voici ce que ça devient ». Pour un foyer dont la
# contrainte varie d'un jour à l'autre, c'est la moitié manquante de l'idée.

recipe:
  id: soupe-cretoise-3-min
  title: Soupe crétoise « 3 min chrono »
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 172"
    source_id: chioca-cuisine-bio-quotidien
    page: 172
    saison: hiver
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 6
  time_min_total: 6         # en-tête : 3 min de préparation + 3 min de cuisson
  active_min: 3

  # « Pour 6 personnes (repas du soir) » : c'est l'autrice qui range le plat, et
  # `creneaux` est le champ fait pour ça. Première fois que le texte du livre
  # renseigne directement un créneau plutôt que le défaut déjeuner + dîner.
  creneaux: [diner]

  apports:
    proteine: legumineuse
    feculent: pain
    legumes: [solanacee]
    profil: soupe
    origine: grec

  accepts:
    - type: pain-rassis
      qty: {amount: 300, unit: g}
      required: false
      fallback_recipe: null

  sans_reste:
    temps_min: 0
    ingredients:
      - {id: pain-levain, name: "pain complet ou demi-complet, en tranches", qty: 300, unit: g}

  ingredients:
    - {id: pain-rassis-ing, name: "pain complet ou demi-complet un peu rassis, coupé en tranches", qty: 300, unit: g, from_accepts: true}
    - {id: sauce-tomate, name: "boîte de sauce tomate aux légumes (provençale, napolitaine…)", qty: 400, unit: g}
    - {id: pois-chiches, name: boîte de pois chiches, qty: 400, unit: g}
    - {id: flocons-avoine, name: flocons d'orge ou d'avoine, qty: 4, unit: c. à s.}
    - {id: eau, name: "eau (ou bouillon)", qty: 1.5, unit: l}
    - {id: origan, name: origan, qty: 1, unit: c. à c., seasoning: true}
    - {id: huile-olive, name: huile d'olive, qty: 3, unit: c. à s.}
    - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: rincer
      action: "Égoutter et rincer les pois chiches"
      needs: []
      uses: [pois-chiches]
      time_min: 2
    - id: reunir
      action: "Les mettre dans un faitout avec l'eau, la sauce tomate, les flocons et l'origan"
      needs: [simmer-large]
      uses: [eau, sauce-tomate, flocons-avoine, origan]
      time_min: 3
    - id: bouillir
      action: "Porter à ébullition, puis éteindre le feu"
      needs: [simmer-large]
      uses: []
      time_min: 8
      attended: false
    # L'AUTRICE SALE AVEC LE RESTE, À L'ÉTAPE `reunir`. Le sel est ici du goût
    # pur — rien ne dépend de lui, contrairement aux courgettes de la p. 85 où
    # il fait dégorger — donc le repousser après l'ébullition ne change rien au
    # plat et ouvre un prélèvement. Même découpage qu'aux accras p. 178, et pour
    # la même raison : c'est le seul moyen que la portion bébé existe.
    - id: assaisonner
      action: "Saler et poivrer la soupe"
      needs: []
      uses: [sel, poivre]
      time_min: 1
      seasoning_gate: true
    - id: griller
      action: "Pendant ce temps, faire griller les tranches de pain au grille-pain"
      needs: []
      uses: [pain-rassis-ing]
      time_min: 5
      parallel_with: bouillir
      kid: {age_min_months: 30, task: "descendre les tranches dans le grille-pain et surveiller qu'elles remontent"}
    - id: servir
      action: "Servir la soupe avec le pain grillé coupé dans les assiettes, en arrosant le tout d'un filet d'huile d'olive"
      needs: []
      uses: [huile-olive]
      time_min: 3

  baby_portion:
    take: "une petite louche de soupe avec des pois chiches, AVANT le sel et le poivre"
    prep: "mixer bien lisse"
    depuis: [bouillir]
    needs: [blend-smooth]

  emits:
    - kind: reste-plat
      type: soupe-cretoise
      qty_band: 2-repas
      keeps: {frigo_days: 3, congelo: true}
      note: "le pain grillé se refait à la minute — c'est la soupe seule qui se garde, et elle se congèle très bien"

  plan_b: []                # six minutes de cuisson : il n'y a rien sous ça
