# Le garde-manger — ce qu'il y a dans les placards, et où.
#
# CE FICHIER N'EST PAS `stock.yaml`, ET LA DISTINCTION EST LE TICKET.
# `stock.yaml` porte les SORTIES DE CUISINE : des bases cuisinées, périssables,
# indexées sur les types que les recettes `emit` et `accept`, consommées par le
# graphe de chaînage et comptées contre les places de rangement. Une conserve de
# maïs n'est rien de tout ça. Lui donner `kind: base` la ferait entrer dans le
# graphe, et le planificateur proposerait d'« enchaîner » une boîte de conserve.
#
# Le garde-manger porte la MATIÈRE PREMIÈRE : indexée sur le vocabulaire
# d'ingrédients de `rayons.yaml`, non périssable à l'échelle de la semaine, et
# rangée dans des endroits physiques qui ont des dimensions.
#
# POURQUOI DES ZONES, ALORS QUE `Espace` EXISTE DÉJÀ.
# `Espace` (frigo · congelo · placard) dit COMMENT ÇA VIEILLIT — c'est ce dont le
# modèle a besoin pour la fenêtre de fraîcheur. Il ne dit pas où c'est. Les six
# rangements de ce foyer s'écrasent tous sur `placard`, et avec eux les seules
# informations qui décident vraiment de ce qu'on peut y mettre : 17 cm de hauteur
# utile sur l'étagère ouverte, la lumière du jour qui y tombe, l'humidité sous
# l'évier. Une zone se RATTACHE à un espace ; elle ne le remplace pas.
#
# CE QUE CE FICHIER NE FAIT PAS ENCORE. Rien ne décrémente une denrée quand on
# cuisine. Le garde-manger est donc DESCRIPTIF : il dit ce qu'il y a et sous
# quelles contraintes, il ne dit pas encore à la liste de courses de se taire.
# Brancher `provenance()` dessus demande un modèle de consommation qui n'existe
# pas — c'est au backlog, pas ici. Un chiffre qu'on croirait tenu à jour alors
# que rien ne le tient est exactement la faute que ce dépôt passe son temps à
# réparer.
#
# Relevé du 2026-08-26, zone par zone, photos à l'appui.

# LA DATE EST CE QUI REND CE FICHIER HONNÊTE.
#
# Ce n'est pas « le stock » : c'est le stock **tel qu'il était le 2026-08-26**.
# T25 en fait la PREMIÈRE OBSERVATION du journal, et tout ce que l'app dit du
# placard se rejoue depuis là. Sans cette date, « je n'ai rien vu depuis » n'est
# pas calculable, et la confiance n'a rien à dépenser.
#
# C'est la réponse à l'objection que ce fichier s'était faite à lui-même — « un
# chiffre qu'on croirait tenu à jour alors que rien ne le tient » : on ne rend
# pas le chiffre plus juste, on le DATE, et l'app dit de quand il date.
#
# T143 — LE RELEVÉ DU 2026-10-21, dicté zone par zone. Il REMPLACE celui du
# 26/08 pour les zones qu'il couvre : les étagères en bois (dessus et deux
# niveaux), les deux demi-lunes, le placard haut. Le sous-évier et le tiroir à
# épices n'ont pas été relevés : ils gardent leur date (`releve:` par zone), et
# c'est elle que le rejeu lit pour eux. Le frigo et le congélateur ne sont pas
# des zones du garde-manger (ils viennent du dépôt).
releve: 2026-10-21

# ── Les rangements physiques ────────────────────────────────────────────────
#
# `hauteur_cm` est la hauteur UTILE d'un niveau, pas celle du meuble : c'est
# elle qui décide si un paquet tient debout. `niveaux` multiplie la surface,
# jamais la hauteur.
#
# `exposition` et `hygrometrie` ne sont pas décoratifs : `verifier.py` s'en sert
# pour confronter une denrée sensible à l'endroit où elle est rangée. C'est la
# seule règle du fichier qui attrape une vraie erreur de rangement.
zones:
  - id: etagere-ouverte
    label: étagère en bois, 1er niveau
    espace: placard
    # T143 — l'étagère a TROIS niveaux (le dessus et deux étages) : celui-ci,
    # sous le dessus, porte les confitures, le miel et les fruits au sirop.
    plan: {mur: gauche, x: 4, y: 88, w: 80, h: 44, court: "Étagère 1", teinte: bois-clair}
    niveaux: 1
    dimensions: {largeur_cm: 42, profondeur_cm: 30, hauteur_cm: 17}
    exposition: jour
    hygrometrie: sec
    chaleur: true
    note: >-
      Présentoir bois sur le plan de travail, à côté de la bouilloire. 17 cm :
      rien de haut n'y entre. 30 cm de profondeur pour 17 de haut : le fond est
      borgne, c'est là que les dates se périment sans se voir.

  - id: etagere-basse
    label: étagère en bois, 2e niveau
    espace: placard
    plan: {mur: gauche, x: 4, y: 134, w: 80, h: 44, court: "Étagère 2", teinte: bois-clair}
    niveaux: 1
    dimensions: {largeur_cm: 42, profondeur_cm: 30, hauteur_cm: 17}
    exposition: jour
    hygrometrie: sec
    chaleur: true
    note: >-
      Le niveau du bas du présentoir : les conserves — thon, maïs, ratatouille,
      concentré de tomate — et le reste des confitures.

  - id: dessus-etagere
    label: dessus de l'étagère ouverte
    espace: placard
    plan: {mur: gauche, x: 4, y: 38, w: 80, h: 46, court: Dessus, teinte: bois-clair}
    niveaux: 1
    dimensions: {largeur_cm: 42, profondeur_cm: 30, hauteur_cm: null}
    exposition: jour
    hygrometrie: sec
    chaleur: true
    note: >-
      Même surface que l'étagère, hauteur libre. Reçoit ce que les 17 cm du
      dessous refusent. La bouilloire est ici — source de chaleur et de vapeur.

  - id: demi-lune-basse
    label: demi-lune basse
    espace: placard
    plan: {mur: fond, x: 4, y: 180, w: 48, h: 52, court: "Coin, bas", teinte: bois-fonce}
    niveaux: 1
    dimensions: {largeur_cm: 70, profondeur_cm: 37, hauteur_cm: 26}
    forme: demi-lune
    exposition: sombre
    hygrometrie: sec
    note: >-
      Plateau demi-lune d'un placard d'angle, ~1 900 cm² (demi-disque ⌀70). Porte
      le lourd : farine et sucre. Les deux pointes de l'arc sont peu exploitables.

  - id: demi-lune-haute
    label: demi-lune haute
    espace: placard
    plan: {mur: fond, x: 4, y: 124, w: 48, h: 52, court: "Coin, haut", teinte: bois}
    niveaux: 1
    dimensions: {largeur_cm: 70, profondeur_cm: 37, hauteur_cm: 33}
    forme: demi-lune
    exposition: sombre
    hygrometrie: sec
    note: >-
      La plus grande hauteur du foyer. C'est elle qui prend les paquets
      debout que l'étagère ouverte ne peut pas porter.

  - id: tiroir-epices
    releve: 2026-08-26     # pas relevé le 21/10
    label: tiroir à épices
    espace: placard
    plan: {mur: fond, x: 4, y: 236, w: 48, h: 48, court: Tiroir épices, teinte: bois-fonce}
    niveaux: 2
    dimensions: {largeur_cm: null, profondeur_cm: null, hauteur_cm: null}
    exposition: sombre
    hygrometrie: sec
    note: >-
      Colonne coulissante, deux niveaux. Épices d'un côté, bouteilles couchées de
      l'autre. Relevé POUR INFORMATION : les condiments n'entrent pas dans le
      décompte, mais c'est le seul endroit où vivent les huiles et les vinaigres,
      et un stock sans matière grasse serait un stock faux.

  - id: placard-haut
    label: placard haut, étagère basse
    espace: placard
    plan: {mur: fond, x: 4, y: 6, w: 48, h: 80, court: Placard haut, teinte: bois}
    niveaux: 1
    dimensions: {largeur_cm: 57, profondeur_cm: 32, hauteur_cm: 23.5}
    exposition: sombre
    hygrometrie: sec
    note: >-
      ~43 L. Le poste de pâtisserie : farines, bocaux, caddy de petits sachets.
      L'étagère du dessus porte les ustensiles et les consommables d'emballage,
      qui ne sont pas des denrées et ne figurent pas ici.

  - id: sous-evier
    releve: 2026-08-26     # pas relevé le 21/10 — les oignons, l'ail et l'échalote en sont sortis
    label: sous-évier
    espace: placard
    plan: {mur: fond, x: 138, y: 124, w: 46, h: 108, court: Sous-évier, teinte: bois-fonce}
    niveaux: 1
    dimensions: {largeur_cm: null, profondeur_cm: null, hauteur_cm: null}
    exposition: sombre
    hygrometrie: humide
    note: >-
      Meuble bas sous l'évier, siphon et évacuations au-dessus. Le point le plus
      humide du logement, et c'est là que sont les légumes racines. La lessive
      vaisselle partage l'emplacement.

# ── Le plan de la cuisine (T141) ────────────────────────────────────────────
#
# L'ÉCRAN STOCK S'OUVRE SUR UN DESSIN DE LA CUISINE, ET CE DESSIN EST UNE DONNÉE.
# Chaque zone ci-dessus porte son `plan:` — le mur où elle est, sa place, son nom
# court ; ce bloc-ci porte le reste : les deux murs, les appareils qui se
# touchent sans être des zones du garde-manger, et le décor.
#
# DEUX MURS, VUS DEPUIS LA PORTE. `gauche` : les étagères en bois, dessinées en
# perspective. `fond` : le mur de l'évier, à plat. Les cotes sont des pixels CSS
# à l'échelle 1 — l'écran ne les agrandit pas, parce qu'à 360 px de large il n'a
# plus rien à donner : gauche + fond = 324 px, la largeur utile d'un écran de
# 360 px moins ses deux marges de 17,6 px. D'où la seule règle qui compte pour
# un doigt, vérifiée par `verifier.py` : un rangement touchable fait au moins
# 44 px dans les deux sens.
#
# UNE ZONE SANS `plan:` EST UNE ERREUR, PAS UN OUBLI. L'écran ne montre le
# contenu d'un rangement qu'une fois touché sur le plan : une zone absente du
# dessin serait une zone qu'on ne peut plus ouvrir.
#
# LES APPAREILS NE SONT PAS DES ZONES. Ce que le frigo et le congélateur portent
# vient du DÉPÔT (`stock.yaml` et ce que la semaine cuisine), pas d'un relevé de
# placard : ils ont une place sur le plan, un `espace`, et rien d'autre.
#
# LE DÉCOR SE VOIT ET NE SE TOUCHE PAS : placards du haut, plaques, four,
# lave-vaisselle, casier à vin, étagère des laits. Sans eux on ne se repère pas —
# un sous-évier flottant au milieu de rien ne ressemble à aucune cuisine.
plan:
  murs:
    gauche: {w: 86, h: 290, label: les étagères en bois}
    fond: {w: 238, h: 290, label: le mur de l'évier}
  appareils:
    - {id: frigo, espace: frigo, label: Frigo, mur: fond, x: 188, y: 6, w: 48, h: 140, court: Frigo, teinte: blanc}
    - {id: congelo, espace: congelo, label: Congélateur, mur: fond, x: 188, y: 150, w: 48, h: 134, court: Congélo, teinte: froid}
  decor:
    - {mur: gauche, x: 4, y: 6, w: 80, h: 26, label: bocaux bébé}
    - {mur: gauche, x: 4, y: 180, w: 80, h: 44, label: vins, teinte: mur-fonce}
    - {mur: gauche, x: 4, y: 230, w: 80, h: 54, label: "laits, briques", teinte: mur-fonce}
    - {mur: fond, x: 56, y: 6, w: 38, h: 80, label: ""}
    - {mur: fond, x: 96, y: 6, w: 38, h: 80, label: ""}
    - {mur: fond, x: 138, y: 6, w: 46, h: 80, label: ""}
    - {mur: fond, x: 0, y: 112, w: 186, h: 8, label: "", teinte: plan-de-travail}
    - {mur: fond, x: 56, y: 92, w: 78, h: 16, label: plaques, teinte: plaques}
    - {mur: fond, x: 56, y: 124, w: 38, h: 108, label: four, teinte: electromenager}
    - {mur: fond, x: 96, y: 124, w: 38, h: 108, label: lave-vaisselle, teinte: electromenager}

# ── Ce qu'il y a dedans ─────────────────────────────────────────────────────
#
# `ingredient` est un id du vocabulaire de `rayons.yaml` — c'est ce qui permettra
# un jour à `provenance()` de répondre autre chose qu'une appartenance binaire.
# `unites` × `par_unite` chiffre la matière ; `par_unite: null` dit qu'on a
# constaté sans peser, ce qui est une information et pas un trou.
#
# `sensible` déclare ce qui abîme la denrée. `incompatibles` déclare ce avec quoi
# elle ne doit pas partager une zone. Les deux se vérifient.
#
# ── LA CONSERVATION EST LA SECONDE RÉPONSE AU GASPILLAGE ─────────────────────
# `conservation.yaml` existe depuis le prototype et dit la chose que le reste du
# modèle ne disait pas : une denrée qui court ne se rattrape pas seulement en la
# cuisinant, elle se rattrape en la TRANSFORMANT. « L'aliment a une horloge, et
# le transformer remet l'horloge à zéro — mais seulement si on a le séchoir, et
# seulement si on a appris à s'en servir. »
#
# Trois champs branchent une denrée sur ces méthodes :
#
# `nature` — ce que la chose EST. Certaines méthodes ne s'appliquent qu'à
#   certaines natures (`applique_a: [legume-cru]` pour la lacto-fermentation).
#   Sans ce champ on proposerait de lacto-fermenter de la farine.
#
# `acidite` — `basse` par défaut, et ce défaut est un choix de SÉCURITÉ, pas de
#   confort : voir l'avertissement botulisme en tête de `conservation.yaml`. Le
#   bain-marie ne stérilise que les aliments acides ; sur un légume nature en
#   bocal à température ambiante, il produit exactement le milieu où prolifère
#   C. botulinum. Aucune denrée de ce fichier n'est déclarée acide, donc le
#   bain-marie n'est proposé sur aucune. C'est voulu.
#
# `conserve_mal` — l'échappatoire, pour ce que le modèle générique rate. Une
#   pomme de terre CRUE congelée devient farineuse et noircit : le congélateur
#   s'applique à tout, sauf à elle. Une règle générale qui a une exception vaut
#   mieux qu'une règle spéciale par denrée, à condition d'écrire l'exception.
#
# ── `usage` — CE À QUOI LA CHOSE SERT, QUAND CE N'EST PAS UN PLAT (T40) ──────
#
# CE N'EST NI UN RAYON NI UNE NATURE, et c'est pour ça qu'il fallait un champ.
# `rayons.ordre` dit OÙ ÇA S'ACHÈTE — les fruits secs s'achètent en épicerie,
# comme le riz, et ça ne les rend pas interchangeables. `nature` dit ce que la
# chose EST, pour décider des méthodes de conservation. Ni l'un ni l'autre ne
# sait dire « ça, c'est pour l'apéro ».
#
# ET L'APÉRO N'EST PAS UN PLAT NON PLUS : `creneaux.yaml` fait 21 créneaux, sept
# jours × trois repas, et rien d'autre. Lui inventer un vingt-deuxième créneau
# reviendrait à demander à quelqu'un de PLANIFIER ses apéros, ce que personne ne
# fait — on veut juste qu'il en reste.
#
# D'où un usage posé sur des denrées qui existent déjà, et une seule
# conséquence : ces denrées peuvent porter un plancher, donc produire une ligne
# de courses. Jamais une carte, jamais un point de score.
#
# MESURÉ, ET C'EST CE QUI EN FAIT UNE PREUVE : ces six denrées sont citées par
# ZÉRO des 86 recettes du corpus. Aucune ne peut donc gagner quoi que ce soit par
# le scoring, ni maintenant ni par accident — si elles apparaissent un jour à
# l'écran, c'est que le plancher a marché tout seul, sans le plan de la semaine.
