# ---------------------------------------------------------------------------
# Cibles d'équilibre de la semaine, et poids du classement « équilibre ».
#
# HONNÊTETÉ SUR CE QUE ÇA FAIT, ET NE FAIT PAS
# Ceci ne calcule aucun apport nutritionnel. C'est une *couverture par
# catégories* : est-ce que la semaine touche assez de sources de protéines
# différentes, assez de familles de légumes, sans répéter trois fois le même
# féculent ni le même format de plat. C'est suffisant pour proposer un plat qui
# complète la semaine, et très insuffisant pour prétendre à un équilibre
# nutritionnel réel.
#
# Le vrai chemin, si on veut des apports au sens strict : la table de
# composition **Ciqual** de l'ANSES, publiée sous **Licence Ouverte** — donc
# compatible avec la politique de contenu du projet (CC0 / Licence Ouverte /
# CC BY / travail propre), contrairement aux bases sous BY-SA. Les repères de
# fréquence ci-dessous devraient de même être sourcés sur les recommandations
# du PNNS plutôt que posés à vue. **Les chiffres actuels ne sont pas sourcés :
# ce sont des hypothèses de prototype, à remplacer.**
# ---------------------------------------------------------------------------

# Fréquences visées sur une semaine (hypothèses non sourcées — cf. ci-dessus).
cibles:
  proteine:
    legumineuse: {min: 2}
    poisson: {min: 1}
    oeuf: {min: 1}
    viande-rouge: {max: 1}
    viande-blanche: {max: 2}
    fromage: {max: 2}
    tofu-soja: {min: 0}
  # Nombre de familles de légumes distinctes visé sur la semaine.
  familles_legumes_min: 5
  # « Varier les plaisirs » se mesure sur le **format** du plat (mijoté, four,
  # poêlé, soupe, cru, rapide) — pas sur la nationalité. Corrigé par
  # l'utilisateur : dans un foyer qui cuisine français, plafonner l'origine
  # faisait remonter des plats exotiques sans raison. `origine` reste saisi
  # dans les recettes mais ne pèse plus rien.
  repetition_max:
    feculent: 2
    profil: 2

# Poids du score. Positif = attire le plat vers le haut de la proposition.
poids:
  proteine_manquante: 6      # comble une cible non atteinte
  proteine_saturee: -5       # dépasse un plafond
  famille_legume_neuve: 2    # chaque famille de légumes pas encore vue
  repetition_feculent: -3
  repetition_profil: -4      # l'axe « varier les plaisirs », renforcé
  chaine_couverte: 4         # sa base est déjà cuite plus tôt dans la semaine
  ecoule_frigo: 5            # consomme un reste qui dort au frigo
  ecoule_congelo: 3          # sort une portion d'urgence du congélateur
  chaine_manquante: -8       # exige une base que rien ne produit avant
  hors_budget: -4
  plancher_congelo: 4        # remonte le stock d'urgence quand il est bas
  article_marginal: -0.4     # la liste de courses pèse, mais ne décide plus

# Le congélateur est une *sortie* à part entière, pas un débarras : un plat
# souche produit des portions d'urgence en bocal ou en barquette. Le foyer a
# trois tiroirs (#29), et c'est la contrainte qui mord — d'où le plafond.
congelateur:
  portions_par_tiroir: 6
  # Plancher, au sens de l'ordre permanent de RimWorld (« cuisiner jusqu'à en
  # avoir N ») : en dessous, le congélateur n'a plus assez de portions pour
  # amortir un soir qui s'effondre, et un plat qui le recharge vaut plus qu'un
  # plat qui nourrit seulement ce soir. Ce n'est pas une cible à atteindre — un
  # congélateur plein n'est pas un but — c'est un seuil sous lequel on redevient
  # dépendant de la liste de courses. Valeur posée à vue, à régler à l'usage.
  plancher: 4
  # Une protéine plafonnée n'est décomptée que si elle est ACHETÉE. Reprendre
  # une bolognaise déjà cuisinée et congelée ne « dépense » pas le quota de
  # viande rouge de la semaine : la viande a été payée la semaine où on l'a
  # achetée. Refuser le reste ne fait que gaspiller.
  reste_ne_compte_pas_dans_les_plafonds: true

# Main de cartes : combien de plats proposer par soir, et quelles catégories
# garantir dans la main. Le deck tourne — un plat récemment cuisiné
# (historique.yaml) sort du paquet pour `cooldown_jours`.
main:
  taille: 5
  cooldown_jours: 10
  garantir: [express, souche, derive]
