# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose et ses photos ne sont PAS reproduites.

recipe:
  id: nuggets-colin-four
  title: Nuggets de colin au four
  lang: fr
  source:
    author: Marie Chioca
    work: "La cuisine bio du quotidien, Terre vivante, p. 51"
    source_id: chioca-cuisine-bio-quotidien
    page: 51
    saison: printemps
    encoding: étapes restructurées et reformulées ; ni prose ni photo d'origine
  yields:
    portions_eq: 4
  time_min_total: 30
  active_min: 15
  # Les 2 h de décongélation sont maintenant portées par `attente_min: 120` sur
  # l'étape `mariner` — de l'attente, pas du travail, et le modèle sait enfin
  # faire la différence. C'est la seule anticipation du catalogue qui tombe le
  # jour même : deux heures avant le dîner, pas la veille.

  apports:
    proteine: poisson
    feculent: pain
    legumes: []
    profil: four
    origine: francais

  ingredients:
    - {id: colin-surgele, name: filets de colin surgelés, sans peau ni arêtes, qty: 400, unit: g}
    - {id: fromage-rape, name: parmesan râpé, qty: 70, unit: g}
    - {id: biscottes, name: biscottes complètes de blé ou d'épeautre, qty: 70, unit: g}
    - {id: oeufs, name: œufs, qty: 2, unit: pièce}
    - {id: ciboulette, name: ciboulette, qty: 1, unit: petit bouquet}
    - {id: citron, name: citron (son jus), qty: 1, unit: pièce}
    - {id: huile-olive, name: huile d'olive ou de tournesol, qty: 2, unit: c. à s.}
    - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: mariner
      action: "Mettre le colin surgelé à décongeler dans le jus de citron, avec un peu de sel et de poivre"
      needs: []
      time_min: 5
      attended: false
      attente_min: 120
      attente_raison: decongelation
      rattrapage:
        action: "À défaut : décongeler au micro-ondes, puis laisser 15 min dans le citron"
        cout_min: 20
        effet: "chair moins ferme et marinade à peine prise — le citron n'a pas le temps d'agir"
    - id: detailler
      action: "Égoutter la marinade et découper le colin en morceaux de deux bouchées"
      needs: []
      time_min: 4
    - id: resaler
      action: "Resaler et repoivrer légèrement les morceaux"
      needs: []
      time_min: 1
      seasoning_gate: true
    - id: chapelure
      action: "Mixer les biscottes avec le parmesan et la ciboulette ciselée très finement, jusqu'à une chapelure homogène"
      needs: [chop-coarse]
      time_min: 4
    - id: preparer-plaque
      action: "Battre les œufs en omelette ; chemiser une plaque de papier cuisson et le huiler au pinceau"
      needs: []
      time_min: 3
      kid: {age_min_months: 30, task: "battre les œufs et badigeonner le papier au pinceau"}
    - id: paner
      action: "Essuyer chaque morceau, le tremper dans l'œuf battu, le rouler dans la chapelure sur toutes ses faces et le poser sur le papier huilé"
      needs: []
      time_min: 8
      kid: {age_min_months: 30, task: "rouler les morceaux dans la chapelure"}
    - id: cuire
      action: "Enfourner 10 min, retourner les nuggets, puis remettre 5 à 10 min"
      needs: [bake]
      time_min: 17
      attended: false

  baby_portion:
    take: "un morceau de colin AVANT panure et avant le second salage"
    prep: "cuire à la vapeur ou au four sans chapelure, puis écraser à la fourchette ; vérifier l'absence d'arêtes"
    needs: [steam]

  emits:
    - kind: reste-plat
      type: nuggets-colin
      qty_band: lunchbox
      keeps: {frigo_days: 2, congelo: false}
      note: "poisson pané : à manger le lendemain au plus tard, et repassé au four"

  plan_b:
    - swap:
        step: chapelure
        action: "Utiliser de la chapelure toute prête, en y mélangeant le parmesan et la ciboulette à la fourchette"
        saves_min: 3
      effect: "chapelure plus fine et moins parfumée que les biscottes mixées"
