# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose n'est PAS reproduite.

recipe:
  id: moulinee-legumes-hiver
  title: Moulinée toute blanche de légumes d'hiver au beurre salé
  lang: fr
  source:
    author: Marie Chioca
    work: "blog Saines Gourmandises"
    source_id: saines-gourmandises-blog
    url: https://saines-gourmandises.fr/mange-ta-soupe/
    saison: hiver
    encoding: étapes restructurées et reformulées ; prose d'origine non reproduite
  yields:
    portions_eq: 4
  time_min_total: 40
  active_min: 12

  apports:
    proteine: aucune
    feculent: aucun
    legumes: [racine, crucifere, allium]
    profil: soupe
    origine: francais

  ingredients:
    - {id: celeri-rave, name: céleri-rave, qty: 0.5, unit: pièce}
    - {id: navet-primeur, name: navet blanc, qty: 1, unit: pièce}
    - {id: poireau, name: blancs de poireau (garder le vert pour un autre usage), qty: 2, unit: pièce}
    - {id: oignon, name: bel oignon, qty: 1, unit: pièce}
    - {id: eau, name: eau, qty: 1.5, unit: l}
    - {id: beurre, name: beurre demi-sel (ou 4 c. à s. d'huile d'olive), qty: 50, unit: g}
    - {id: poivre, name: poivre du moulin, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: tailler
      action: "Éplucher et couper le céleri-rave et le navet en cubes, émincer l'oignon et les blancs de poireau"
      needs: []
      time_min: 10
      kid: {age_min_months: 30, task: "mettre les cubes de légumes dans la casserole"}
    - id: cuire
      action: "Tout réunir dans une casserole avec l'eau, couvrir et cuire 25 min à petits bouillons"
      needs: [simmer-large]
      time_min: 25
      attended: false
    - id: beurrer
      action: "Hors du feu, ajouter le beurre demi-sel et un peu de poivre du moulin"
      needs: []
      time_min: 1
      seasoning_gate: true
    - id: mixer
      action: "Mixer soigneusement jusqu'à une texture bien lisse"
      needs: [blend-smooth]
      time_min: 3
      # Le beurre hors du feu, pas pendant : c'est ce qui garde le velouté
      # blanc et le goût de beurre frais plutôt que cuit.

  baby_portion:
    take: "une petite louche de légumes et de bouillon, AVANT le beurre demi-sel et le poivre"
    prep: "mixer avec un peu d'eau de cuisson ; le sel du plat vient du beurre, donc le prélèvement est vraiment non salé"
    needs: [blend-smooth]
    # Cas rare dans ce corpus : le sel n'arrive qu'à la toute fin, porté par le
    # beurre demi-sel. Le prélèvement avant est réellement non salé, ce qui n'a
    # été vrai que pour le consommé de fanes jusqu'ici.

  emits:
    - kind: reste-plat
      type: moulinee-hiver
      qty_band: lunchbox
      keeps: {frigo_days: 3, congelo: true}
    # Éplucher céleri-rave, navet et oignon produit des parures que le consommé
    # de fanes (livre, p. 35) mange. Quatrième arête « déchet » du graphe.
    - kind: parure
      type: parures-legumes
      qty_band: 1-repas
      keeps: {frigo_days: 3}
      note: "le vert de poireau écarté ici va aussi au bouillon"

  plan_b:
    - swap:
        step: cuire
        action: "Tailler les légumes en cubes plus petits pour accélérer la cuisson"
        saves_min: 8
      effect: "aucun sur le résultat : la soupe est mixée de toute façon"
