# Encodage structuré et reformulé d'une recette de Marie Chioca, selon le cadre
# de licence de la carte #26 : le plat, les quantités et le procédé relèvent du
# savoir-faire non protégeable ; sa prose n'est PAS reproduite.

recipe:
  id: chiffonnade-chou-frise-cantal
  title: Chiffonnade de chou frisé au cantal, noix et jambon cru
  lang: fr
  source:
    author: Marie Chioca
    work: "blog Saines Gourmandises"
    source_id: saines-gourmandises-blog
    url: https://saines-gourmandises.fr/mal-aime-etonner/
    saison: hiver
    encoding: étapes restructurées et reformulées ; prose d'origine non reproduite
  yields:
    portions_eq: 3
  time_min_total: 20
  active_min: 20

  apports:
    proteine: fromage
    feculent: aucun
    legumes: [crucifere, allium]
    profil: cru
    origine: francais

  # LE SEUL PLAT CRU D'HIVER DU CATALOGUE. Les autres `profil: cru` saisis
  # jusqu'ici sont des salades d'été ou de printemps ; l'axe « varier les
  # plaisirs » d'`equilibre.yaml` pénalise la répétition de profil, et l'hiver
  # n'avait que des soupes et des plats au four à proposer.
  ingredients:
    - {id: chou-frise, name: chou frisé de taille moyenne, qty: 0.5, unit: pièce}
    - {id: oignon-rouge, name: oignon rouge, qty: 1, unit: pièce}
    - {id: cantal, name: cantal jeune, qty: 100, unit: g}
    - {id: jambon-cru, name: jambon cru en tranche épaisse, qty: 100, unit: g}
    - {id: pruneaux, name: pruneaux, qty: 8, unit: pièce}
    - {id: noix, name: noix en coques, qty: 10, unit: pièce}
    - {id: huile-olive, name: huile d'olive ou de noix, qty: 6, unit: c. à s.}
    - {id: vinaigre, name: vinaigre de vin, qty: 3, unit: c. à s.}
    - {id: sel, name: sel, qty: 1, unit: c. à c., seasoning: true}
    - {id: poivre, name: poivre, qty: 1, unit: pincée, seasoning: true}

  steps:
    - id: parer-chou
      action: "Ôter les deux ou trois feuilles extérieures les plus foncées et coriaces, recouper le demi-chou en deux et retirer le trognon"
      needs: []
      time_min: 5
    - id: emincer
      action: "Émincer le chou très finement, au robot ou au couteau"
      needs: [chop-coarse]
      time_min: 5
      # La finesse fait tout : un chou frisé taillé épais reste coriace cru.
    - id: garniture
      action: "Recouper le jambon en lardons, le cantal en cubes, dénoyauter et couper les pruneaux aux ciseaux, casser les noix"
      needs: []
      time_min: 7
      kid: {age_min_months: 30, task: "ramasser les cerneaux de noix cassées"}
    - id: reunir
      action: "Réunir le chou, l'oignon, le cantal, le jambon, les pruneaux et les noix dans un saladier"
      needs: []
      time_min: 2
    - id: assaisonner
      action: "Assaisonner d'huile, de vinaigre, de sel et de poivre, brasser et servir aussitôt — le chou frisé est assez tendre pour se passer de marinade"
      needs: []
      time_min: 1
      seasoning_gate: true

  baby_portion:
    take: "quelques cubes de cantal et un peu de pruneau, AVANT l'assaisonnement"
    prep: "écraser le pruneau à la fourchette ; ni chou cru ni noix, ni jambon"
    needs: []
    # Réserve : à 12 mois la noix entière est un risque de fausse route et le
    # chou cru est indigeste. Ce qui reste du plat pour un bébé est mince, et
    # c'est honnête de le dire plutôt que d'inventer un prélèvement plausible.

  # Pas d'`emits` : assaisonnée, la chiffonnade rend son eau en quelques heures.
  transportable: false

  plan_b:
    - drop: garniture
      saves_min: 7
      effect: "chou, oignon et cantal seuls : ça reste une salade, mais sans le sucré-salé"
